<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>회계감사 기말 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 감사조서(working paper) 콘셉트 — 중간고사 사이트와 같은 색·글꼴 */
:root{
  --paper:#f3f6f2; --surface:#ffffff; --ink:#1c2631; --muted:#5d6874; --rule:#d7dfd5;
  --accent:#1d6a56; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --right:#1f7a4d; --right-soft:#e3f3ea; --wrong:#b23a2e; --wrong-soft:#f9e6e3; --flag:#c98a12; --flag-soft:#fbf0d9;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111513; --surface:#1a201d; --ink:#e3e8e4; --muted:#9aa59e; --rule:#2c3530;
  --accent:#62b59a; --accent-ink:#0c1411; --accent-soft:#1f322b;
  --right:#5cc48e; --right-soft:#1c3226; --wrong:#e57a6d; --wrong-soft:#3a2220; --flag:#e7b54d; --flag-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111513; --surface:#1a201d; --ink:#e3e8e4; --muted:#9aa59e; --rule:#2c3530;
  --accent:#62b59a; --accent-ink:#0c1411; --accent-soft:#1f322b;
  --right:#5cc48e; --right-soft:#1c3226; --wrong:#e57a6d; --wrong-soft:#3a2220; --flag:#e7b54d; --flag-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:20px} h2{font-size:18px} h3{font-size:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13.5px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 0 4px;position:sticky;top:0;background:var(--paper);z-index:5}
.topbar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;min-width:40px;height:40px;padding:0 10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--accent)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sub{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:14px;min-height:96px}
.tile b{font-size:16px} .tile .n{font-family:var(--f-mono);font-size:24px}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.filt button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--rule)}
.bar i{display:block;height:100%}
.bar .m{background:var(--right)} .bar .l{background:color-mix(in srgb,var(--right) 45%,var(--surface))} .bar .w{background:var(--wrong)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--rule)}
.legend .lm::before{background:var(--right)} .legend .ll::before{background:color-mix(in srgb,var(--right) 45%,var(--surface))} .legend .lw::before{background:var(--wrong)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.badge.w{background:var(--wrong-soft);color:var(--wrong)}
.qtext{font-size:17px;font-weight:500;line-height:1.7}
.src{font-size:12.5px;color:var(--muted)}
details.ctx{border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
details.ctx>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--accent)}
.ctxb{padding:0 14px 12px;font-size:15px}
.ctxb p{margin:0 0 8px}
.box{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:8px 0}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--rule);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--accent-soft);font-weight:600;white-space:nowrap}
table.plan{display:table;table-layout:fixed;font-size:12.5px;line-height:1.4} table.plan td{text-align:center;vertical-align:middle;padding:4px 2px;word-break:keep-all;overflow-wrap:anywhere}
table.tl td{border:none;text-align:center;padding:2px 4px;white-space:nowrap}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--rule);background:var(--surface);border-radius:12px;padding:16px;font-size:24px;font-weight:700}
.opt.ok{border-color:var(--right);background:var(--right-soft);color:var(--right)}
.opt.bad{border-color:var(--wrong);background:var(--wrong-soft);color:var(--wrong)}
.fb{border-radius:12px;padding:14px 16px;border:1px solid var(--rule);background:var(--surface)}
.fb.ok{border-color:var(--right);background:var(--right-soft)} .fb.bad{border-color:var(--wrong);background:var(--wrong-soft)}
.fb .h{font-weight:700;font-size:17px}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--rule);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.actionbar .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.actionbar .btn{flex:1}
.star{border:none;background:none;font-size:22px;color:var(--muted);padding:4px 6px}
.star.on{color:var(--flag)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13.5px}
.modes button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.model{font-size:15.5px;line-height:1.85}
.model p{margin:0 0 6px}
.model .w{border-radius:3px;transition:background .15s}
.model .w.blk{color:transparent;background:var(--rule);cursor:pointer}
.model .w.hint{color:var(--accent);cursor:pointer}
.model .w.hit{background:var(--right-soft);color:var(--right)}
.model .w.miss{background:var(--wrong-soft);color:var(--wrong)}
.cover{display:flex;align-items:center;justify-content:center;min-height:120px;border:2px dashed var(--rule);border-radius:10px;color:var(--muted);cursor:pointer;text-align:center;padding:12px}
textarea.field{width:100%;min-height:160px;border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--surface);line-height:1.7;resize:vertical}
.list .item{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.list .item:first-child{border-top:none;margin-top:0;padding-top:0}
.ans{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin-top:8px}
.ans.x{border-left-color:var(--wrong)}
.mark{font-weight:700;font-size:18px;margin-right:6px}
.mark.o{color:var(--right)} .mark.x{color:var(--wrong)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
.big{font-size:30px;font-family:var(--f-mono)}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
@media print{.topbar,.actionbar,.filt,.modes,.noprint{display:none!important}.card{border:none;padding:0}}
</style>
</head>

,"ch":15,"name":"15장 서술④","title":"계속기업전제의 검토사례(Ⅲ) (KICPA)"},{"g":"15-서술⑤","ch":15,"name":"15장 서술⑤","title":"후속사건의 유형과 관련 감사절차"},{"g":"15-서술⑥","ch":15,"name":"15장 서술⑥","title":"후속사건의 검토 (KICPA)"},{"g":"15-서술⑦","ch":15,"name":"15장 서술⑦","title":"후속사건 (KICPA)"},{"g":"15-서술⑧","ch":15,"name":"15장 서술⑧","title":"감사의 종료절차-종합"},{"g":"15-서술⑨","ch":15,"name":"15장 서술⑨","title":"경영진서면진술 (KICPA)"},{"g":"15-서술⑩","ch":15,"name":"15장 서술⑩","title":"미수정왜곡표시사항의 종합과 중요성 판단 (KICPA)"},{"g":"15-사례","ch":15,"name":"15장 사례연구","title":"경영진서면진술의 거부"},{"g":"16-진위","ch":16,"name":"16장 진위","title":"진위형"},{"g":"16-서술①","ch":16,"name":"16장 서술①","title":"감사의견의 종류(Ⅰ)"},{"g":"16-서술②","ch":16,"name":"16장 서술②","title":"감사의견의 종류(Ⅱ) (KICPA)"},{"g":"16-서술③","ch":16,"name":"16장 서술③","title":"비교재무제표의 감사보고"},{"g":"16-서술④","ch":16,"name":"16장 서술④","title":"기타정보"},{"g":"16-서술⑤","ch":16,"name":"16장 서술⑤","title":"그룹재무제표 감사(Ⅰ) (KICPA)"},{"g":"16-서술⑥","ch":16,"name":"16장 서술⑥","title":"그룹재무제표 감사(Ⅱ) (KICPA)"},{"g":"16-서술⑦","ch":16,"name":"16장 서술⑦","title":"감사보고서의 강조사항과 기타사항"},{"g":"16-서술⑧","ch":16,"name":"16장 서술⑧","title":"감사보고서-종합"},{"g":"16-사례","ch":16,"name":"16장 사례연구","title":"감사보고서의 유형 (KICPA)"}],"ctx":{"6-서술①":"<p>한국거래소에 상장된 중견법인인 명륜주식회사는 당기감사를 위해 새로운 감사인으로 교체하고자 한다.<\/p><p>[요구사항] 다음 각 물음에 대해 답하시오.<\/p>","6-서술②":"<p>공인회계사인 김경솔 씨는 과거 어떤 회계법인으로부터도 감사를 받아본 적이 없는 대한주식회사의 감사를 맡게 되었다. 감사의 실시과정에서 김 회계사는 감사보고서가 당기말 재무제표에 한정되어 있으므로 기초재무상태표의 계정에 관한 감사를 실시하지 않았다.<\/p>","6-서술③":"<p>인터넷 발달로 전자상거래시장은 급속하게 성장하고 있다. 전통적인 굴뚝산업이나 중소형 IT기업 모두 사업목적을 달성하기 위해 인터넷을 이용하고 있다. 예를 들면 eBay는 온라인 경매에 이어 정찰가격 형태로 상품을 판매한다.<\/p><p>온라인 경매만 취급하던 eBay가 정찰가격으로 상품을 판매하기로 한 결정은 다음의 사업전략 목표와 관련이 있다.<\/p><p>① 정찰가격으로 판매하면 다른 기업의 인터넷 사이트에서 상품을 구입하는 소비자를 유인할 수 있다.<br>② 정찰가격 판매정책으로 확장하면 온라인 경매에 관심이 없어 다른 기업의 인터넷 사이트를 방문하던 새로운 고객을 유인할 수 있다.<\/p>","6-서술④":"<p>김한국 회계사는 회계연도말이 12월 31일로 종료되는 대한주식회사의 감사계획을 수립중이다. 다음은 전형적인 감사절차를 열거한 것이다.<\/p><p>(1) 매입채무의 외부조회<br>(2) 구매와 대금지급활동의 거래유형 세부테스트<br>(3) 매입채무 계정잔액의 세부테스트<br>(4) 후속사건의 검토<br>(5) 감사계획의 수립<br>(6) 감사보고서의 발행<br>(7) 내부통제의 이해 및 통제위험의 예비적 평가<br>(8) 매입채무계정잔액의 분석적절차<br>(9) 감사위험의 목표수준 설정, 중요성기준의 설정 및 허용왜곡표시액의 결정<br>(10) 기업에 대한 이해<\/p>","6-서술⑤":"<p>귀하는 20×3년 12월 31일에 종료하는 회계연도의 대한기업 감사계획을 수립하기 위해 경영진과 감사일정 및 기업의 협조사항을 논의하고 있다. 대한기업의 경영진은 감사기간과 감사인의 중복업무를 단축시키면 기업측에도 좋으므로 감사업무를 세 사람의 감사인에게 일률적으로 계정별로 나눌 것을 제안하였다. 즉 자산계정, 부채계정, 수익과 비용 계정을 세 명이 각각 나누어 감사할 것을 제안하였다.<\/p>","6-서술⑥":"<p>감사인은 감사계획을 수립할 때 어떤 감사절차에 중점을 두어 실시하는 것이 감사의 경제성과 감사목적의 효과적 달성 측면에서 전략적으로 바람직한지 결정한다. 다음 상황은 감사인이 기업 및 내부통제의 이해를 거친 후 수립한 감사계획이다.<\/p><p>〈상황〉<\/p><table><thead><tr><th rowspan=\"2\">상 황<\/th><th colspan=\"4\">감사절차<\/th><\/tr><tr><th>통제테스트<\/th><th>거래유형의 세부테스트<\/th><th>실증적 분석적절차<\/th><th>계정잔액의 세부테스트<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>확대<\/td><td>축소<\/td><td>확대<\/td><td>축소<\/td><\/tr><tr><td>2<\/td><td>생략<\/td><td>확대<\/td><td>생략<\/td><td>확대<\/td><\/tr><\/tbody><\/table>","6-서술⑦":"<p>다음은 감사인이 경영진의 주장을 확인하기 위해 수행하는 감사절차이다.<\/p><p>(1) 현금지출장의 합계를 계산하고 총계정원장의 잔액으로 추적하다.<br>(2) 구매원장의 거래기록 중 표본을 선택하여 관련 판매자의 송장과 추적대조하다.<br>(3) 주요 생산품의 재고자산회전율을 계산하고 이를 전기와 비교하다.<br>(4) 차입금계정의 잔액, 이자율, 담보물에 대한 증거를 수집하다.<br>(5) 미지급계정의 합계를 계산하고 총계정원장의 잔액과 비교하다.<br>(6) 보고기간말 전후의 취득거래가 적절한 기간에 기록되었는지를 결정하기 위해 증빙서류를 검토하다.<br>(7) 현금이 수취일에 빠짐없이 즉시 기록되는지 관찰하다.<br>(8) 수취채권의 회수가능성을 감사대상회사의 담당자에게 확인하다.<\/p>","6-서술⑧":"<p>한국회계법인은 서울회사의 재무제표감사를 신규로 체결하였다. 서울회사는 귀금속을 도매가로 구입하여 소매상에게 판매한다. 한국회계법인의 담당공인회계사는 다음의 감사계획을 수립하였다.<\/p><p>〈수행한 감사계획절차 기술서〉<\/p><p>1. 업무의 이해<br>(1) 감사계획을 위해 감사참여자는 ① 회사의 회계정책, ② 수정이 요구되는 재무제표 항목, ③ 관련법령, ④ 회사가 승인한 표본감사방법, ⑤ 타감사인 또는 내부감사인의 관련 범위를 고려하였다.<br>(2) 감사계획단계에서 감사참여자들은 ① 감사업무의 일반적 범위와 실시시기, ② 적발위험의 예상수준을 회사의 경영진 및 감사위원회와 논의하였다.<\/p><p>2. 인원배분<br>(1) 감사참여자의 자격요건 및 현장감사계획을 결정하기 위한 업무별 예상시간을 마련하고, ① 감사계획책임자(업무수행이사) 및 ② 회사의 재무담당임원과 감사위원회의 승인을 받았다.<br>(2) 인원배분과 관련하여 ① 업무의 규모와 복잡성, ② 감사보조자의 확보가능성, ③ 업무수행시기, ④ 참여자의 계속성과 순환, ⑤ 감사보조자의 훈련기회를 고려하였다.<\/p><p>3. 사업의 지식<br>(1) 회사 영업의 전반적인 이해를 위하여 ① 주주총회와 의사록, ② 규제기관에 제출된 문서, ③ 회계감사기준의 규정을 검토하였다.<br>(2) 감사참여자에게 ① 회사 조직과 ② 영업특성을 파악하도록 하였다.<br>(3) 회사의 ① 전산화 정도와 그 영향의 범위, 복잡성, 조직구조를 이해하고, ② 회사가 정보를 처리하기 위하여 사용하는 방법을 고려하였다.<\/p><p>4. 위험평가<br>(1) 금융기관, 경영진측 변호사, 타감사인, 기타 동업자에게 경영진의 성실성을 질문하고, 회사의 주요 고객 신용승인정책을 회사에 질문하였다.<br>(2) 감사가능성을 평가하기 위하여 회사의 신용등급을 고려하고, 회계기록의 적합성을 고려하였다.<br>(3) 수용가능한 적발위험의 수준을 결정하기 위하여 중요왜곡표시위험을 예비적으로 평가하였다.<br>(4) 회사의 내부감사인에게 고유위험과 중요한 회계추정을 평가하도록 하였다.<br>(5) 통제위험의 예비적 평가에서 경영진주장 수준 또는 재무제표 전체수준에서 통제위험을 최대로 평가하고 그 결론의 근거를 문서화하였다.<\/p><p>5. 기타사항<br>(1) 재무제표에 직접적으로 영향을 미치는 법규불이행 위험을 평가하기 위하여 ① 법규불이행을 방지하기 위한 회사의 정책, ② 회사의 법규 이해 정도, ③ 법규이행을 위한 내부통제요소를 고려하였다.<br>(2) 분석적절차를 수행하여 ① 회사의 사업과 거래 및 사건을 이해하고, ② 잠재적인 위험을 내포하고 있는 분야를 파악하며, ③ 전반적인 재무제표의 표시 및 공시를 평가하였다.<br>(3) 업무를 효율적으로 수행하기 위하여 감사프로그램을 개발하고, 이를 감사책임자에게 승인받았다.<\/p>","6-사례":"<p>최근에 대륙회계법인의 파트너로 승진한 송달호 씨는 중앙사회복지재단의 재무담당자문역으로 위촉되었다. 송달호 씨는 재단 총재인 최대풍 씨와 업무상 밀접한 관계를 유지하고 있다. 최대풍 씨는 프랜차이즈사업을 하는 건강식품회사와 부동산개발회사를 소유하고 있다. 최대풍 씨는 관련 기업의 상장을 계획하고 있어 송달호 씨에게 감사를 의뢰하였다.<\/p><p>최대풍 씨는 수년전 자신이 대관령개발에 근무할 때 대륙회계법인과 감사계약을 체결한 적이 있기 때문에 대륙회계법인의 감사업무를 잘 안다고 했다. 송달호 씨는 몇 가지 사실에 대한 예비적 협의 및 검토를 수행했다. 최대풍 씨의 기업은 급속히 성장하고 있어 수익성이 좋으며, 감사보수도 상당액을 받을 수 있을 것으로 판단했다. 송달호 씨는 최대풍 씨에게 감사계약을 제한하며 대륙회계법인의 내부 규정상 새로운 고객과 계약을 체결하기 위해 최소한 다른 파트너 1인의 승인을 받아야 하는데 특별한 문제는 없을 것이라고 설명했다.<\/p><p>송달호 씨는 승인에 필요한 몇 가지 예비조사를 하였고, 최대풍 씨가 사회적으로 저명한 인물이며 자선사업에서도 매우 활동적이라는 사실을 알게 되었다. 최대풍 씨가 운영하는 기업도 거래은행과 주요 경제연구소의 보고서에서 좋은 평판을 얻고 있으며 부정적인 정보는 없었다.<\/p><p>송달호 씨는 마지막 검토의 일환으로 과거에 대륙회계법인에 파트너로 근무하면서 최대풍 씨의 기업을 감사했던 김철수 회계사에게 최대풍 씨와 그 기업에 대해 문의하였다. 김철수 씨의 답변은 다음과 같다.<\/p><p>김철수 회계사가 대관령개발을 마지막으로 감사한 것은 12년 전이다. 대관령개발은 부동산의 개발 및 매매 등을 영업목적으로 하는 상장기업이다. 대표이사인 최대풍 씨는 대관령개발 주식을 10~20% 소유하고 있었다. 최대풍 씨는 당시 38세로서 별로 신뢰할 만한 인물은 아니었다. 대관령개발은 건물을 ₩600,000,000에 매각하여 ₩400,000,000의 이익을 보고하였다. 김철수 씨는 대관령개발측에 건물 구매자를 문의하였으나 거절당하였고, 등기부등본을 추적하여 건물 구매자는 최대풍 씨라는 것을 알게 되었다. 등기서류에 표시된 건물의 구매가격은 ₩500,000,000이었다. 김철수 씨는 이와 같은 특수이해관계자 거래로 이익을 과대계상한 사실을 이사회에 보고했다. 차기 이사회에서 최대풍 씨는 사임했고, 1년도 채 지나지 않아 대관령개발은 도산하였다. 최대풍 씨가 대표이사로 재직할 때 여러 차례의 불법적인 내부거래를 했다는 사실이 밝혀졌다.<\/p><p>김철수 씨의 이야기를 들은 송달호 씨는 며칠 동안 최대풍 씨와의 계약체결의 득실을 검토하였고, 12년이 지난 지금은 최대풍 씨가 더 이상 감사인을 속이거나 불법적인 내부거래를 하지 않을 정도로 성숙한 인품을 갖추었다고 결론을 내렸다. 이러한 결론은 과거에 엄격한 회계감사를 실시해 부정을 적발한 적이 있는데도 그가 예전과 동일한 회계법인에 회계감사를 다시 의뢰한 것은 과거의 잘못된 행위를 되풀이하지 않을 의도라는 점에 기초하고 있다. 송달호 씨는 최대풍 씨에 대한 모든 자료를 대륙회계법인의 대표공인회계사에게 보내 계약체결의 승인을 요청했다.<\/p>","7-서술①":"<p>다음은 회계감사 스터디 모임에서 구성원들이 서로 토의하고 있는 내용이다.<\/p><p>(1) 고유위험과 통제위험이 높을수록, 감사인의 감사비용은 높아진다.<br>(2) 적정의견은 재무제표가 어떤 왜곡표시도 없이 재무보고체계를 완전하게 준수하고 있다는 것을 의미하지는 않는다.<br>(3) 감사인이 목표로 한 위험(목표감사위험), 고유위험, 통제위험이 각각 10%, 20%, 30%일 경우 감사인은 고유위험과 내부통제의 평가과정에서 실수가 없었는지를 재차 확인하는 것만으로 감사절차를 종료할 수 있다.<br>(4) 감사인은 감사계약을 체결할 시점에서 내부통제가 취약하다고 판단하여 감사계획 수립과정에서 전수조사를 통하여 내부통제를 평가하기로 하였다.<br>(5) 기업의 임직원에 의한 내부공모, 위조 또는 변조 등 문서의 허위성 여부에 대한 조사 및 판단은 재무제표감사의 범위에 포함되지 않는다.<br>(6) 기업의 내부통제가 취약하다면 감사인은 재무제표에 대한 감사보고서에 적정의견을 표명할 수 없다.<\/p>","7-서술②":"<p>다음은 통제환경과 관련된 요소들이다.<\/p><p>(1) 해당 기업이 속한 업종에 대한 정부규제가 매우 엄격하다.<br>(2) 기업이 속한 산업의 제품수요가 전반적으로 증가하는 추세이다.<br>(3) 기업은 대부분 자금을 타인자본으로 조달했는데 최근 시장이자율이 상승하는 추세이다.<br>(4) 경영진은 최대주주이고, 감사는 경영진의 측근이다.<br>(5) 내부감사보고서가 경영진에게 직접 보고된다.<br>(6) 회계담당자 인사이동이 빈번하지 않다.<br>(7) 경영진은 감사인이 제시한 내부통제 개선제안을 잘 받아들인다.<br>(8) 경영진은 기본급여 없이 주식선택권으로만 보상받는다.<\/p>","7-서술③":"<p>다음은 서로 다른 세 개 회사의 내부통제를 기술한 것이다.<\/p><p>(1) 남궁민 씨는 공장에서 사용할 재료를 주문하고, 검수부에는 구매주문서 부본을 보낸다. 검수 후 재료가 창고로 운송되는 동안, 검수직원인 서혜정 씨는 이 구매주문서에 물품수령사실의 여부만을 기록하여 서명한 후 구매주문서를 회계부로 보낸다. 회계부에서는 재료의 구입을 매입장에 주문량만큼 기록하고 동액을 매입채무계정에 계상한다. 재료가 창고에 입고될 때, 주문량을 초과한 입고량이 있으면 이러한 내용을 제품수불대장에만 기록한다.<\/p><p>(2) 씽씽자동차회사의 수백명 종업원은 매일 작업시간카드에 출퇴근 시간을 기록한다. 시간집계담당자는 이 카드들을 일주일에 한 번씩 집계하여 생산관리부서로 보낸다. 생산관리부서에서 작업시간카드 자료는 전산용 입력카드로 변경된다. 입력된 자료들은 급여지급분개장, 노무비배분기록, 급여이체명세서의 작성 등에 사용된다. 자금담당책임자 신경애 씨는 급여지급분개장과 급여이체명세서를 비교한 후 은행이체지시서에 서명한다. 급여이체명세서를 생산관리부서 감독관인 문정규 씨에게 보내면, 문정규 씨가 종업원에게 직접 배부한다.<\/p><p>(3) 진성화장품회사의 종로지점에는 지점장인 박연경 씨와 판매보조원 김형우 씨가 근무한다. 종로지점은 진성화장품회사의 명의로 개설된 은행계좌를 이용하여 대금을 지급한다. 진성화장품 본점의 자금담당자는 이병남 씨이지만 지점장인 박연경 씨의 서명이 있어야만 예금 인출이 가능하다. 지점장인 박연경 씨는 매월 은행으로부터 은행조회서를 받고, 직접 종로지점의 회계기록과 은행조회서를 조정검토하고 보관하며 정기적으로 지출보고서를 작성하여 본사에 보고한다.<\/p>","7-서술④":"<p>김대한 공인회계사는 한국주식회사의 원재료 구매·검수·보관·출고의 내부통제를 평가하였다. 김 회계사는 한국주식회사의 내부통제를 파악한 후 다음과 같이 업무기술서를 작성하였다.<\/p><p>“원재료는 주로 고가의 전자부품으로서 자물쇠장치가 있는 창고에 보관되어 있다. 창고에는 반장 한 명과 네 명의 직원이 있다. 이들은 모두 잘 훈련되어 있고 유능하며 신용보증보험에도 가입되어 있다. 원재료는 생산담당책임자의 구두 또는 서면승인이 있어야만 출고된다. 계속기록법에 따라 기록되는 재고자산 장부는 없어 창고직원들은 물품을 수령하거나 반출할 때 아무런 기록을 하지 않는다. 계속기록법 대신에 철저한 감독하에 매월 창고직원이 재고자산을 실사한다. 한국주식회사의 매월 생산수준이 동일하지는 않다. 실사 후 창고감독자가 실지재고량과 재주문점을 비교하여 재주문점수량에 미달하면 감독자는 원재료요청서를 작성하여 이를 매입채무담당자에게 보낸다. 매입채무담당자는 각 부서에서 요청받은 예정주문량에 따라 주문서를 작성하여 최근에 구입한 구매처에 구매주문서를 발송한다.<\/p><p>주문한 원재료가 도착하면 창고직원이 수령한다. 창고직원은 수령한 원재료 수량이 공급자세금계산서의 수량과 일치하는지 조사한다. 판매자가 송부한 모든 공급자세금계산서에 날짜를 기입하고 서명한 후, 이를 원재료반입영수증에 대신하여 보관한다.”<\/p>","7-서술⑤":"<p>그린미술감정가협회는 미술홍보와 재원확보를 위해 미술관을 운영하고 있다. 입구에서 2명의 검표원이 비회원은 ₩5,000의 입장료를 받으며, 회원은 회원증을 제시하면 입장할 수 있다. 매일 마감시간이 되면 1명의 검표원이 입장료 수입을 회계책임자에게 전달하고, 회계책임자는 검표원의 입회하에 현금을 확인한 후 금고에 보관한다. 매주 금요일 오후 회계책임자와 1명의 검표원은 금고에 보관하고 있는 모든 현금을 은행에 예금한다. 회계책임자는 입금액을 현금수입장에 기록하고 이를 증빙하기 위해 은행에서 수령한 입금확인서를 첨부한다.<\/p><p>협회의 운영위원회는 현금입장료와 관련한 내부통제의 개선 필요성을 절감하고 있다. 위원회에서는 입장인원 자동계산을 위한 회전식 문의 설치, 미술관의 구조변경을 위해 필요한 자금소요액이 전체수입을 초과한다고 판단하였다. 위원회는 개선노력의 일부로 입장권의 발매제도를 동의하고 도입할 예정이다. 고려중인 입장권 발매제도는 입장료를 수납하면 입장권을 발행하며 관람객은 입장할 때 입장권의 일부를 절취하여 검표원에게 제출하는 방식이다. 정통한 회계사는 위원회로부터 현금입장료의 내부통제와 관련한 개선방안을 수립해 달라는 요청을 받았다.<\/p>","7-서술⑥":"<p>A(주)는 코스닥시장상장법인으로 20×4년(1.1~12.31)에 X회계법인으로부터 감사를 받고 있다. X회계법인은 20×3년부터 A(주)를 감사하고 있다.<\/p><p>※ 다음의 각 물음은 문제에서 특별한 언급이 없는 한 독립적인 상황이다.<\/p>","7-사례":"<p>돌돌시네마의 직원은 사장, 관리직원 1명, 사무직원 1명과 기계실기사 1명, 청소업체(경비절감을 위해 외주) 직원 2명이다. 영화관에 입장할 때 입구에 서 있는 관리직원인 김구경 씨에게 ₩7,000을 지급하면 입장할 수 있다. 김구경 씨는 현금을 수령하여 확인한 후 앞에 놓여 있는 현금수거함에 넣도록 되어 있다. 현금수거함은 커다란 자물쇠로 잠겨 있으며 열쇠는 사무직원인 김국진 씨가 보관한다. 영화관의 실내구조는 다음과 같다.<\/p><table class=\"plan\"><tbody><tr><td rowspan=\"5\">인도<br>(길)<\/td><td>매점<br>■<\/td><td>화장실<br>■<\/td><td rowspan=\"3\">스크린<br><br>관람석<br><br>비상구<\/td><td colspan=\"2\">화장실<br>■<\/td><\/tr><tr><td colspan=\"2\">입구<\/td><td colspan=\"2\">출구<\/td><\/tr><tr><td rowspan=\"3\">■<br>PC방<br>■<\/td><td rowspan=\"3\">■<br>대기실<br>(휴게실)<\/td><td colspan=\"2\">사무실 ■<br>■ ■<\/td><\/tr><tr><td><\/td><td>사장실<\/td><td>청소<br>직원실<br>■<\/td><\/tr><tr><td>기계실<\/td><td colspan=\"2\">비상통로<\/td><\/tr><\/tbody><\/table><p>■ ─ 출입문을 의미함.<\/p><p>매점과 오락실은 외부사업자에게 임대하여 임대료를 받고 있다. 영화관 좌석은 총 150석이며, 하루 10차례 영화를 상영한다. 비상구는 화재 등 긴급한 상황에서만 이용가능하며 평소에는 자물쇠로 잠겨 있다(이 열쇠는 사무직원, 기계실직원, 청소직원이 하나씩 갖고 있다). 기계실과 청소직원실 직원은 비상통로를 이용하고 있다.<\/p><p>이 극장은 멀티플렉스 영화관(여러 상영관에서 다양한 영화를 상영하는 곳)과 경쟁하기 위해 홀수회와 짝수회마다 각각 다른 영화를 상영한다. 각 회를 상영하는 동안 기계실에서 이전 회에서 상영한 영화 필름을 되감기 때문에 이 영화관은 홀수회와 짝수회의 상영간격이 매우 짧아 하루 10회 상영이 가능하다. 영화상영시 기계실기사는 기계실을 떠날 수 없다. 관람석 청소는 짝수회가 끝날 때마다 이루어진다.<\/p><p>1회당 평균좌석 점유율은 70%이다. 영화상영이 시작되면 입구는 김구경 씨, 출구는 김국진 씨에 의해 폐쇄된다. 사장은 직원이 다른 사람을 입장시키는 것을 방지하기 위해 입구와 출구를 매시 정각에 방문한다. 입장료는 매일 상영이 끝나면 김구경 씨가 사무실로 현금수거함을 가져오고, 김국진 씨가 열쇠로 개봉하여 계수한 현금을 입금으로 기록하고 사장에게 전화로 보고하고(사장은 이미 퇴근했으므로) 다음날 아침까지 금고에 보관한 후(금고열쇠는 사장과 김국진 씨가 보관) 은행에 입금한다.<\/p><p>돌돌시네마 사장은 김구경 씨와 김국진 씨가 급여에 비해 상당히 고급스러운 수입차를 몰고 다니는 것을 알게 되었다. 사장은 내부통제에 문제가 있는 것은 아닌지 귀하에게 자문을 요청했다.<\/p>","9-서술①":"<p>다음은 대한주식회사에서 발생한 왜곡표시의 유형이다.<\/p><p>(1) 매출송장을 합산하는 과정에서 ₩100,000만큼 과대계상되었다.<br>(2) 회계연도 마지막날에 매출액이 담당자의 실수로 이중기록되었다. 매출액은 이틀 전에 발생한 것으로 이미 기록되었다.<br>(3) 영업사원이 거래처를 방문하여 외상매출금을 회수한 후 잠적하였다.<br>(4) 접수계원이 현금집계표에 기록한 매출채권 회수액을 현금수입장 및 매출채권원장 기록담당자가 회수거래기록을 누락시켜 횡령하였다.<br>(5) 선하증권을 분실해 고객에게 적송한 상품에 대해 대금을 청구하지 못했다.<br>(6) 고객에게 상품을 적송했으나 적송서류를 작성하지 않았다. 대금을 적송서류를 기준으로 청구하기 때문에 대금청구가 누락되었다.<br>(7) 용역매출을 제품매출로 잘못 분류하였다.<\/p>","9-서술②":"<p>다음은 매출거래의 감사목표와 통제테스트를 예시한 것이다.<\/p><table><thead><tr><th>감사목표<\/th><th>테스트절차<\/th><\/tr><\/thead><tbody><tr><td>(1) 기록된 매출거래는 실제 발생한 것인가?<br>(2) 실제 발생한 매출은 모두 기록되었는가?<br>(3) 매출거래는 보조원장에 적절히 기록되었고 올바르게 요약되었는가?<\/td><td>(1) 매출송장을 검토하여 각 송장에 적송서류가 부착되어 있는지 검토한다.<br>(2) 매출거래에서 표본을 추출하여 매출채권보조원장에 전기되었음을 확인하는 검증표시가 매출분개장에 존재하는지 확인한다.<br>(3) 적송서류에서 표본을 추출하여 각 서류의 좌측 하단에 매출송장번호가 기입되었는지 검토한다.<\/td><\/tr><\/tbody><\/table>","9-서술③":"<p>대한주식회사는 용역을 제공하고 고객에게 청구서를 발송한 후 대금을 회수한다. 현금을 포함한 모든 대금회수는 재무책임자인 김부실 씨가 담당한다. 공인회계사 자격증을 보유한 김부실 씨는 회사에서 대금회수업무를 담당하기에 가장 적합한 사람이다. 그는 적시에 문제를 해결하고 고객 요구에 신속하게 대처할 수 있다. 현금을 수령하면 즉시 현금집계표와 두 장의 입금표를 작성하고, 매일 은행에 입금한다. 김부실 씨는 현금수입분개장과 매출채권원장을 갱신하는 데 현금집계표를 이용하며, 미회수된 매출채권을 회수하기 위해 고객들과 접촉한다.<\/p><p>김부실 씨는 회사의 업무내용과 고객을 매우 잘 알고 있기 때문에 신용거래와 매출할인을 승인하며, 회수불가능한 대손계정의 대손확정 업무를 맡고 있다. 대한주식회사의 사장은 김부실 씨의 탁월한 업무수행능력으로 회사운영에 소요되는 시간을 단축해 효율적으로 업무가 진행되고 있어 만족하고 있다.<\/p><p>사장은 김부실 씨가 회사의 매출채권 회수액 중 상당액을 횡령해 왔음을 금년 초 외부감사과정에서 알게 되었고 이에 경악하였다. 김부실 씨는 그동안 ① 매출기록을 누락시키고, ② 매출채권의 부당한 대기메모(예 : 부당한 대손확정)를 했으며, ③ 매출채권을 과대계상하는 방법으로 대금회수액을 횡령한 사실이 밝혀졌다.<\/p>","9-서술④":"<p>다음은 대구주식회사의 매출과 대금회수활동에 관한 감사절차이다.<\/p><p>(1) 적송서류에서 표본을 추출하여 해당 매출송장번호가 기입되어 있는지 검토한다.<br>(2) 영업부장과 면담해 매출에누리 중 보고기간말 이후에 승인된 항목 중 당기에 귀속되어야 할 항목이 있는지 확인한다.<br>(3) 연령잔액시산표의 각 난을 합계검증하고 총계정원장의 총계와 비교한다.<br>(4) 총계정원장의 총액과 매출채권 연령잔액시산표를 독립적으로 비교하는지 검토한다.<br>(5) 5월중 적송부서에 보관된 적송서류의 수를 개략적으로 파악하여 매출분개장에 있는 매출송장의 수와 비교한다.<br>(6) 적송서류에서 표본을 추출해 그 날짜를 관련 매출송장부본과 보조원장으로 추적하여 비교한다.<br>(7) 회수불능채권으로 대손처리된 거래처에 조회서를 발송해 실제로는 대금을 지급한 사실이 있는지 검토한다.<br>(8) 매출채권보조원장을 검토해 장기미회수거래처, 이자부매출채권, 관계회사거래 등의 구분표시가 적절한지 검토한다.<br>(9) 적송서류에서 표본을 추출해 그 날짜를 보고기간말 전후 며칠간 매출분개장에 기록된 날짜와 비교한다.<br>(10) 당해연도의 회수불능채권과 매출채권의 비율을 과거 연도와 비교한다.<br>(11) 매출채권보조원장에서 현금회수 이외의 사유로 매출채권이 감소한 항목에서 표본을 추출한 후 적절한 승인(대손, 반품)이 있었는지 확인한다.<\/p>","9-서술⑤":"<p>20×3년 6월 30일로 종료하는 대한주식회사를 감사하는 김한국 회계사는 매출채권에 대해 외부조회를 실시하였다. 10개의 조회대상으로부터 다음의 내용을 회신받았다.<\/p><p>(1) 20×3년 5월 5일의 매출채권 ₩256,000은 이미 지급된 것입니다.<br>(2) 귀사의 외부조회서를 왜 우리에게 발송했는지 이유를 모르겠습니다.<br>(3) 금액은 맞으나 위탁판매이므로 팔리는 대로 대금을 송금하겠습니다.<br>(4) 귀사가 조회한 매출채권잔액 ₩368,000은 20×3년 7월 6일에 지급하였습니다.<br>(5) 귀사가 조회한 매출채권잔액 ₩956,000은 우리가 지급해야 할 금액보다 많습니다.<br>(6) 우리 회사 정책에서는 계정확인을 요하는 어떠한 조회에도 회신하지 않도록 규정하고 있습니다(전화로 통지를 받았음).<br>(7) 귀사가 조회한 매출채권잔액 ₩350,000은 20×3년 5월 7일자에 발생한 귀사에 대한 당사의 채권과 상계했습니다.<br>(8) 귀사가 조회한 잔액은 당사의 수입임대료로서 이는 20×3년 7월 1일부터 20×4년 6월 30일까지의 임대료에 해당하는 금액을 당사가 선수한 것입니다.<br>(9) 귀사가 조회한 잔액은 우리가 20×3년 4월 20일에 상품을 수령하기 전에 먼저 지급한 것으로 ₩426,000 중에서 차감되어야 할 금액입니다.<br>(10) 귀사가 조회한 잔액은 이미 지급했습니다.<\/p>","9-서술⑥":"<p>이가을 회계사는 (주)신라컴퓨터의 20×7년 재무제표감사에 참여하고 있다. (주)신라컴퓨터는 컴퓨터를 제조하여 국내 및 중국 등에 판매하며 20×5년초에 코스닥시장에 상장되었다. 이가을 회계사가 이번 감사에서 담당한 계정은 매출채권과 매출이며, 20×7년 10월 5일부터 9일까지 5일 동안 (주)신라컴퓨터를 방문하여 매출 및 대금회수활동의 내부통제를 평가하였다. 이가을 회계사는 통제테스트에서 신용승인 없이 외상매출이 이루어진 다수의 거래를 발견하였으며, 이에 따라 (주)신라컴퓨터의 왜곡표시위험 수준을 높게 평가하였다. 이가을 회계사는 현재 매출채권 및 매출의 실증절차를 수행중에 있으며, 다음과 같은 총괄표를 작성하였다.<\/p><p style=\"text-align:right\">(단위 : 원)<\/p><table><thead><tr><th>구 분<\/th><th>기초금액<\/th><th>당기증가<\/th><th>당기감소<\/th><th>기말금액<\/th><\/tr><\/thead><tbody><tr><td>매출채권<\/td><td>17,600,000<\/td><td>68,500,000<\/td><td>62,100,000<\/td><td>24,000,000*<\/td><\/tr><tr><td>대손충당금<\/td><td>170,000<\/td><td>200,000<\/td><td>170,000<\/td><td>200,000<\/td><\/tr><\/tbody><\/table><table><thead><tr><th>구 분<\/th><th>전 기<\/th><th>당 기<\/th><\/tr><\/thead><tbody><tr><td>매 출<\/td><td>84,000,000<\/td><td>87,000,000<\/td><\/tr><\/tbody><\/table><p>* 기말 매출채권 ₩24,000,000 중 ₩5,800,000은 받을어음이며, 이 중 ₩1,000,000은 기업이 현재 보관중이고 나머지 잔액은 대한은행에 위탁 보관하고 있다.<\/p>","9-서술⑦":"<p>매출과 대금회수활동은 고객 주문에서 출발하여 상품이 판매되어 매출채권계정으로 전환되고 현금으로 회수되는 과정까지의 모든 활동을 포함한다.<\/p>","9-서술⑧":"<p>회계감사기준에서 회계추정치란 정확한 측정수단이 없을 때의 화폐금액 근사치를 말한다. 회계추정치는 추정을 요구하는 금액뿐만 아니라, 추정불확실성이 존재하는 공정가치로 측정된 금액에 대하여도 사용된다. 그중에서 공정가치의 측정과 관련된 회계추정치를 ‘공정가치 회계추정치’라고 한다.<\/p><div class=\"box\"><p>A(주)는 20×5년중 바이오산업을 영위하는 비상장회사인 B(주)의 지분 100%를 800억원에 취득하였다. A(주)의 경영진은 동 지분 취득과 관련하여 Y회계법인에 의뢰하여 공정가치 평가보고서를 입수하였으며, 회계처리에 반영하였다. Y회계법인의 공정가치 평가보고서에 따르면 취득대가 800억원의 구성내역은 다음과 같다.<\/p><table><thead><tr><th>구 분<\/th><th>금 액<\/th><\/tr><\/thead><tbody><tr><td>순자산 공정가치<\/td><td>400억원<\/td><\/tr><tr><td>추가 식별한 기술가치<\/td><td>300억원<\/td><\/tr><tr><td>영업권<\/td><td>100억원<\/td><\/tr><tr><td>합 계<\/td><td>800억원<\/td><\/tr><\/tbody><\/table><p>X회계법인은 A(주)의 회계감사를 수행하고 있으며, X회계법인의 매니저 김 회계사는 계정담당자인 이 회계사의 감사조서를 검토하고 있다. 다음은 김 회계사와 이 회계사의 대화내용이다.<\/p><div class=\"box\">김 회계사 : 이 회계사는 바이오산업에 대한 공정가치 평가보고서 검토경험이 충분한가요?<br>이 회계사 : <u>① 바이오산업에 대한 전문지식이나 공정가치 평가보고서에 대한 검토경험은 없지만 회계사 경력이 4년이나 되고, 사용된 가정이나 계산과정이 외부전문가의 공정가치 평가보고서에 상세히 기술되어 있으며, 일부 이해하기 어려운 부분이 있었지만 제가 아는 범위 내에서 최선을 다했습니다.<\/u><br>김 회계사 : 해당 시장이 아직 활성화되지 않았고, 회사의 기술력이 아직 검증되지 않았는데, 회사의 향후 5년간 연평균 매출성장률을 50%로 추정한 것은 과도한 것 아닌가요?<br>이 회계사 : <u>② 공정가치 평가보고서에 기술된 산업의 전망치들은 공개된 산업통계자료를 이용하였고, 해당 산업의 시장규모 및 B(주)의 예상 시장점유율을 근거로 판단했을 때 적정하다고 생각합니다.<\/u><br>김 회계사 : 공정가치 평가보고서는 Y회계법인이 작성하였는데, Y회계법인 담당자는 해당 산업을 충분히 이해하고 있나요?<br>이 회계사 : <u>③ Y회계법인의 담당자인 최 회계사와 직접 유선통화로 확인하였습니다.<\/u> <u>④ 최 회계사는 바이오산업의 업무는 처음이지만 회계사 경력이 10년 이상이나 되고, 공정가치 평가업무를 수차례 수행한 경험이 있어 적격성을 갖추고 있다고 생각합니다.<\/u><\/div><\/div>","9-사례":"<p>바로회계법인은 하이킥주식회사의 감사인으로서 과거의 감사경험을 근거로 내부통제의 신뢰수준이 높다고 평가하였다. 바로회계법인은 내부통제의 통제테스트와 분석적절차의 비중을 높이고 계정잔액의 세부테스트를 축소하는 감사계획을 수립하였다.<\/p><p>다음은 바로회계법인이 하이킥주식회사의 내부통제검증과정에서 입수한 업무기술서의 일부이다.<\/p><div class=\"box\"><p style=\"text-align:center\">업무기술서<\/p>• 신규거래처를 확보하면 영업팀은 신규거래처의 신용도를 조사하고 거래처를 등록한다.<br>• 영업팀에서는 팀장 승인을 받은 후 출고지시서 3부를 작성하여 1부는 보관하고, 1부는 창고로, 나머지 1부는 회계팀으로 송부한다.<br>• 영업팀이 창고를 직접 관리하며, 매일 정오에 출고가 종료된다.<br>• 창고에서는 영업팀으로부터 수령한 출고지시서에 기재된 품목을 출고한 후, 운송업자에게 인수증 2부를 발행한다.<br>• 운송업자는 당일 운송완료를 원칙으로 하며, 운송완료 후 고객으로부터 확인받은 인수증 1부는 회계팀에 제출하고 해당 운송비를 직접 수령한다.<br>• 창고에서는 매일 출고된 품목과 수량을 집계하여 일일출고내역서를 작성한 후 영업팀장의 승인을 받는다.<br>• 영업팀에서는 출고지시서에 기재된 품목과 수량이 일일출고내역서와 일치하는지 확인하고 매출원장에 기록한다.<br>• 회계팀에서는 운송업자로부터 회수한 인수증과 출고지시서를 대조한 후, 매출채권원장에 기록한다.<\/div>","6-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","7-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","9-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","12-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","12-서술①":"<p>김똑똑 회계사는 한국주식회사의 원재료 구매, 검수, 보관, 출고의 내부통제를 평가하였다. 김 회계사는 회사의 내부통제를 파악한 후 다음과 같은 서술식 업무기술서를 작성하였다.<\/p><p>(1) 원재료는 주로 고가의 전자부품으로 잠금장치가 있는 창고에 보관한다.<br>(2) 창고에는 감독자 한 명과 네 명의 직원이 있다. 이들은 잘 훈련되어 있고 유능하며 재정보증보험에도 가입되어 있다.<br>(3) 원재료는 생산담당책임자의 구두 또는 서면 승인이 있는 경우에만 출고된다.<br>(4) 재고자산에 관한 계속기록법 장부가 별도로 없다. 창고직원들은 물품을 수령하거나 반출할 때 아무런 기록을 하지 않는다. 계속기록을 하지 않는 대신 철저한 감독하에 매월 창고직원이 재고자산을 실사한다.<br>(5) 실사 후 창고감독자가 실지재고량과 재주문점을 비교하여 재주문점수량에 미달될 때에는 감독자가 원재료구입목록을 작성하여 이를 매입채무담당자에게 보낸다.<br>(6) 매입채무담당자는 각 부서가 요청한 예정주문량에 따라 주문서를 작성하여 최근에 구입한 구매처에 구매주문서를 발송한다.<br>(7) 주문한 원재료가 도착하면 창고직원이 수령한다. 창고직원은 수령한 원재료의 수량이 거래명세서 및 공급자송장의 수량과 일치하는지 조사한다. 판매자가 송부한 모든 거래명세서에 날짜를 기입하고 서명한 후, 이를 원재료반입영수증에 대신하여 보관한다.<\/p>","12-서술②":"<p>엄다리 회계사는 명륜회계법인의 책임회계사로 혜화카메라(주)의 20×1년 12월 31일자 재무제표감사를 수행하고 있다. 엄 회계사는 20×1년 9월 15일부터 18일까지 중간감사를 수행하였으며 매입 및 검수관련 내부통제를 평가하였다. 엄 회계사는 통제테스트 결과를 기초로 실증절차를 확대하는 세부감사계획을 수립하고 매입채무 및 재고자산의 감사절차를 수행하고 있다.<\/p><p>혜화카메라(주)는 구성부품 규격이 매우 중요한 고가의 정밀 카메라를 제조하는 회사이다. 회사는 제품을 제조하기 위해 고가의 카메라 렌즈와 금속판 및 나사못을 구매해야 한다. 나사못과 렌즈는 단위당 가격으로 공급자에게 대금을 지급하며, 금속판은 중량당 가격으로 지급한다. 검수직원은 검수한 원자재의 품질과 수량을 문서로 작성해야 한다. 엄 회계사는 회사의 내부통제에서 다음의 절차를 확인했다.<\/p><p>(1) 구매주문서 : 사전에 일련번호가 부여된 구매주문서에 대해 적절한 승인이 이루어지고 번호순서로 철한다. 공급자에게 송부하는 구매주문서와 동일한 부본이 검수직원에게 보내진다. 검수직원은 물품의 검수사실을 구매주문서 부본에 기록한다.<br>(2) 금속판 : 금속판은 기차로 운송된다. 한국철도공사는 금속판 무게를 측정한 후, 중량과 검수일자를 화물운송증에 기록한다. 화물운송증은 모든 물품과 함께 검수직원에게 보내진다. 검수직원은 화물운송증의 중량을 구매주문서와 대조하여 일치여부를 확인한다.<br>(3) 나사못 : 검수직원은 물품 상자를 개봉하여 내용물은 검사하고 무게를 측정하는데, 무게는 환산표를 이용하여 개수로 환산한다. 검수직원은 환산한 개수를 구매주문서와 대조하여 일치여부를 확인한다.<br>(4) 카메라 렌즈 : 카메라는 각각 분리된 골판지상자에 포장되어 배송된다. 검수직원은 상자 수를 세어 수량을 구매주문서와 대조하여 일치여부를 확인한다.<\/p>","12-서술③":"<p>다음은 매입채무의 실증절차를 설명한 것이다.<\/p><p>(1) 보고기간말 전후 며칠간의 현금지출에 관련된 증빙서류를 검토한다.<br>(2) 보고기간말 마지막 수일간과 차기의 처음 수일간에 해당하는 현금수입과 지출거래 중 금액이 크거나 비경상적인 거래가 있는지 검토한다.<br>(3) 총계정원장과 증빙서류를 추적하여 매입채무와 관련된 관계기업과의 거래, 기타 관련 자산과 부채가 재무제표에 적절하게 표시되었는지 검토한다.<br>(4) 외화표시부채의 환산에 적용된 환율을 조사하고 계산이 정확한지 검토한다.<br>(5) 매입채무계정명세서에 포함된 금액 중 관계기업, 차기메모 및 담보부지급어음과 관련된 항목이 있는지 회계담당자에게 질문한다.<br>(6) 회계담당자로부터 거래처가 송부한 공급자월별계산서를 구해 매입채무계정명세서와 대조한다.<br>(7) 공급자로부터 직접 구한 공급자월별계산서를 매입채무계정명세서와 대조한다.<br>(8) 매입채무계정명세서를 계산검증하고 총계정원장과 비교한다.<\/p>","12-서술④":"<p>다음 각 통제절차는 유형자산에 공통적으로 적용되는 통제절차들이다.<\/p><p>(1) 유형자산별로 세부명세의 기록을 유지하기 위해 개별보조원장을 사용한다.<br>(2) 자본적 지출, 운임, 설치비, 교체 및 수선유지비계정의 성격을 식별하기 용이하도록 명문화된 회계방침이 존재하고 회계담당자가 숙지하고 있다.<br>(3) ₩200,000,000 이상의 유형자산 취득은 이사회 승인을 받아 집행한다.<br>(4) 기계장치에는 금속성 표지의 고유번호를 부착하고 체계적으로 관리한다.<br>(5) 감가상각비는 개별자산별로 계산하고, 개별보조원장에 기록하며, 독립적인 제삼자가 정기적으로 검증한다.<\/p>","12-서술⑤":"<p>B사는 유형자산의 감가상각방법으로 정액법을 채택하고 있다. B사의 감사인인 정직해 회계사는 유형자산의 취득 및 처분은 연중 평균적으로 발생한다고 가정하고 감가상각비의 분석적절차를 수행하였다. 정 회계사가 수행한 분석적절차에서 추정한 감가상각비보다 B사의 재무제표 감가상각비 금액이 현저히 작은 것으로 나타났다. 정 회계사의 이러한 질문에 대해 B사의 원가관리 책임자는 당기에 대규모 설비투자가 이루어졌으며, 대부분이 12월에 완료되어 관련 제품 생산이 연말에 이루어졌기 때문이라고 설명했다.<\/p>","12-서술⑥":"<p>김나라 회계사는 (주)도미의 회계팀장으로부터 유형자산명세서를 전달받아 유형자산의 취득과 처분이 연중 평균적으로 발생한다고 가정하여 다음과 같이 감가상각비 적절성에 대한 분석적절차를 수행하였다.<\/p><p>〈수행한 분석적절차〉<br>• 평균 감가상각대상 자산금액 : 394,000백만원[＝(352,000백만원＋436,000백만원)/2]<br>• 평균 상각률 : 7.5%(＝29,550백만원/394,000백만원)<br>• 평균 상각기간 : 13.3년<\/p><p>〈분석적절차 결과〉<br>• 20×7년 평균 상각기간은 13.3년으로 20×6년의 분석결과는 10.7년이나 동종업종 평균 상각기간인 10년보다 길기 때문에 감가상각비의 과소계상 가능성이 매우 높음.<\/p><p>김 회계사는 (주)도미의 유형자산담당자에게 유형자산 항목 중 특이한 사항이 있는지 질문했다. 담당자는 20×7년중 (주)도미가 부담한 공장진입로 포장공사비 5,000백만원은 보수 및 유지책임이 (주)도미에 있으므로 토지로 분류했다고 답변했다. 정부보조금은 전액 특정 기계장치 취득목적으로 정부로부터 수령한 상환의무가 없는 보조금이라는 설명을 들었다. (주)도미는 동 보조금을 자산에서 차감하는 회계원칙을 적용하고 있고, 모든 상각대상자산은 정액법으로 감가상각하고 있으며 잔존가치는 미미하다.<\/p><p style=\"text-align:center\">유형자산명세서<\/p><p style=\"text-align:right\">(단위 : 백만원)<\/p><table><thead><tr><th>구 분<\/th><th>20×6년<\/th><th>20×7년<\/th><\/tr><\/thead><tbody><tr><td>토 지<\/td><td style=\"text-align:right\">85,000<\/td><td style=\"text-align:right\">102,000<\/td><\/tr><tr><td>건물과 구축물<\/td><td style=\"text-align:right\">101,000<\/td><td style=\"text-align:right\">125,000<\/td><\/tr><tr><td>기 계 장 치<\/td><td style=\"text-align:right\">93,000<\/td><td style=\"text-align:right\">117,000<\/td><\/tr><tr><td>(정부보조금)<\/td><td style=\"text-align:right\">(12,000)<\/td><td style=\"text-align:right\">(10,000)<\/td><\/tr><tr><td>리 스 자 산<\/td><td style=\"text-align:right\">53,000<\/td><td style=\"text-align:right\">53,000<\/td><\/tr><tr><td>건설중인자산<\/td><td style=\"text-align:right\">32,000<\/td><td style=\"text-align:right\">49,000<\/td><\/tr><tr><td>합 계<\/td><td style=\"text-align:right\">352,000<\/td><td style=\"text-align:right\">436,000<\/td><\/tr><tr><td>감가상각비<\/td><td><\/td><td style=\"text-align:right\">29,550<\/td><\/tr><\/tbody><\/table>","12-사례":"<p>귀하는 20×6년 12월 31일로 종료하는 한국회사의 재무제표를 감사하고 있다. 다음 표의 토지, 건물 및 기계장치와 각각의 감가상각누계액계정명세서는 한국회사가 작성한 것이다. 귀하는 기초잔액을 전년도 감사조서와 대조하여 확인했다.<\/p><p style=\"text-align:center\"><u>토지 · 건물 · 기계장치와 관련 감가상각누계액계정명세서<\/u><\/p><p>한국회사　　20×6년 12월 31일 현재　　(단위 : 천원)<\/p><table><thead><tr><th>항 목<\/th><th>20×5년 12월 31일<\/th><th>증 가<\/th><th>감 소<\/th><th>20×6년 12월 31일<\/th><\/tr><\/thead><tbody><tr><td>유형자산<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>　토 지<\/td><td style=\"text-align:right\">₩225,000<\/td><td style=\"text-align:right\">₩50,000<\/td><td><\/td><td style=\"text-align:right\">₩275,000<\/td><\/tr><tr><td>　건 물<\/td><td style=\"text-align:right\">1,200,000<\/td><td style=\"text-align:right\">175,000<\/td><td><\/td><td style=\"text-align:right\">1,375,000<\/td><\/tr><tr><td>　기계장치<\/td><td style=\"text-align:right\">3,850,000<\/td><td style=\"text-align:right\">404,000<\/td><td style=\"text-align:right\">₩260,000<\/td><td style=\"text-align:right\">3,994,000<\/td><\/tr><tr><td><\/td><td style=\"text-align:right\">₩5,275,000<\/td><td style=\"text-align:right\">₩629,000<\/td><td style=\"text-align:right\">₩260,000<\/td><td style=\"text-align:right\">₩5,644,000<\/td><\/tr><tr><td>감가상각누계액<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>　건 물<\/td><td style=\"text-align:right\">₩600,000<\/td><td style=\"text-align:right\">₩51,500<\/td><td><\/td><td style=\"text-align:right\">₩651,500<\/td><\/tr><tr><td>　기계장치<\/td><td style=\"text-align:right\">1,732,500<\/td><td style=\"text-align:right\">392,200<\/td><td><\/td><td style=\"text-align:right\">2,124,700<\/td><\/tr><tr><td><\/td><td style=\"text-align:right\">₩2,332,500<\/td><td style=\"text-align:right\">₩443,700<\/td><td><\/td><td style=\"text-align:right\">₩2,776,200<\/td><\/tr><\/tbody><\/table><p>귀하는 한국회사를 감사하는 중에 다음과 같은 사실을 발견하였다.<\/p><p>(1) 한국회사는 정액법으로 감가상각을 실시하며 모든 유형자산의 잔존가치는 ₩0이다. 건물의 내용연수는 25년이며, 기타 다른 유형자산은 모두 10년이다.<br>(2) 한국회사는 공장건물의 증축을 6월 30일에 완료하였으며, 증축으로 건물의 내용연수는 연장된다. 공장을 증축하면서 발생한 ₩175,000을 건물계정에 기록하였다. 한국회사는 건물 증축을 위해 회사의 직원과 장비를 활용하였으며 ₩160,000을 지출하였다(직접재료원가 : ₩75,000, 직접노무원가 : ₩55,000, 제조간접원가 : ₩30,000).<br>(3) 8월 18일 한국회사는 회사가 보유한 토지에 ₩50,000을 지출하여 포장을 하고 벽돌담을 친 후 종업원 주차장으로 사용하고 있다. ₩50,000을 토지계정에 기록하였다.<br>(4) 감가상각누계액명세서의 감소란에 표시된 금액은 20×2년에 ₩480,000에 구입한 자산을 9월 5일에 처분하고 받은 현금수입액이다. 20×6년에 회계담당자는 이 자산의 감가상각비를 ₩35,000으로 기록하였다.<br>(5) 한국회사의 사장인 김호영 씨는 공정가치가 각각 ₩10,000과 ₩400,000인 토지와 건물을 회사에 기증하였다. 9월 1일부터 한국회사는 이 토지와 건물을 사용하기 시작하였으나, 동 자산의 취득을 위해 지출한 현금이 없어 장부에 기록하지 않았다.<\/p>","13-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","13-서술①":"<p>이우리 회계사는 20×3회계연도의 감사계획단계에서 (주)금성에 대한 분석적절차를 수행하던 중 매출총이익률의 변동이유를 재무팀장인 조민국 이사에게 질문을 했고 다음과 같은 답변을 들었다.<\/p><div class=\"box\">“원래 저희 회사는 두 개의 사업부를 운영하고 있었습니다. 20×1년도에 두 사업부에 대한 매출총이익률을 분석했습니다. 생산구조가 복잡해 주로 자동화 제조장비로 생산하는 A-type제품 사업부에서는 매출총이익이 발생하나, 생산구조가 단순해 주로 수작업에 의존하는 B-type제품 사업부에서는 매출총손실이 발생하고 있었습니다.<br>분석결과를 바탕으로 이사회에서는 회사 전체의 매출총이익률을 높이기 위해 20×1년말 B-type제품 사업부를 폐쇄하였습니다. 신규 투자자금을 차입해 A-type제품 사업부의 자동화 제조장비 증설에 투자하였습니다.<br>이로 인해 20×2년과 20×3년에 A-type제품 사업부의 판매규모가 두 배로 증가해 20×1년 매출규모를 유지하면서도 매출총이익률은 지속적으로 증가할 수 있었습니다.”<\/div><p>조민국 이사의 답변과 관련해 이우리 회계사는 추가적으로 다음과 같은 사실을 확인했다.<\/p><p>• 20×1년까지 (주)금성에는 직접노무비 비중이 작은 A-type제품 사업부와 직접노무비 비중이 큰 B-type제품 사업부가 있었다.<br>• (주)금성은 자동화 제조장비에 대한 감가상각비가 대부분인 제조간접비를 직접노무비를 기준으로 배부하는 전통적인 원가배부시스템을 사업초기부터 20×1년까지 계속 유지하고 있었다.<br>• 20×1년 A-type제품과 B-type제품 사업부의 생산 · 판매수량과 판매단가에는 큰 차이가 없기 때문에 각 사업부의 매출규모도 비슷하였다.<br>• 공장 전체 발생원가 중 재료비 비중은 미미하였으며, 직접노무비와 제조간접비의 비중은 1 : 3 정도였다.<br>• 최근 3년간 A-type제품과 관련된 시장상황의 변화는 거의 없었으며, 판매단가와 단위당 원재료비 및 시간당 노무비 역시 거의 변동이 없었다.<\/p><p>[요구사항] 이우리 회계사는 재무제표의 왜곡표시가능성이 높은 것으로 판단하였다.<\/p>","13-서술②":"<p>최고회계법인의 박신중 회계사는 (주)초일류의 20×6년 재무제표를 감사하는 감사팀 일원으로 참여하고 있다.<br>20×6년 12월 31일 (주)초일류의 반월공장에 도착한 박신중 회계사는 모든 현장재고에 재고조사표(tag)를 부착하기로 했다는 회사담당자의 설명을 듣고, 다음의 감사절차를 수행하였다.<\/p><p>① 재고실사에 사용한 재고조사표의 통제(tag control)<br>② 기간귀속(cut-off)자료의 입수 및 검토<br>③ 회사에서 작성한 재고실사지침서의 수령 및 검토<br>④ 재고자산 실사를 수행할 현장 사전답사<br>⑤ 표본에 의한 재고자산 실사입회<br>⑥ 재고실사입회 문서화 및 종결<\/p>","13-서술③":"<p>가구조립회사인 월출회사의 20×4년 12월 31일로 종료하는 재무제표를 감사하고 있는 박성실 회계사는 20×4년 12월 31일 현재 회사의 창고에 보관된 재고자산의 실사절차를 회사의 재무담당임원과 의논하고 있다.<br>완제품, 부품, 소모품은 회사의 창고건물에 보관되어 있고, 재고자산 실사기간에도 공장은 계속 가동한다. 12월 31일의 생산에 필요한 부품과 소모품은 12월 30일에 창고에서 조립공정으로 이동하며, 12월 31일 당일 생산을 위한 긴급요청이 있을 수도 있다. 실사를 수행하는 동안, 창고에서는 계속해서 부품과 소모품을 수령하고 완제품을 출고한다. 12월 31일에 생산된 완제품은 실사 이후 시점까지 공장에서 보관할 예정이다.<\/p>","13-서술④":"<p>나선명 회계사는 B회사의 외부감사인으로 20×3 회계연도의 재무제표 회계감사를 수행하고 있다. B회사는 반도체조립업체로 주요 원재료인 고가의 반도체칩을 공정 초기에 투입하여 자동화공정을 거쳐 완제품을 제조하는 중견기업이다.<\/p><p>〈자료 1〉 회사가 제시한 재무제표에는 20×3년말 현재 자산총계는 1,500억원, 매출액과 당기순이익은 각각 2,000억원과 150억원이다. 재고자산은 600억원으로 이 중 원재료는 500억원이다. 원재료 비중이 높은 이유에 대해 경영진은 회사가 제품수요를 충족하기 위하여 반도체칩을 미리 확보하여 보관하고 있기 때문이라고 설명하였다. 회사는 재고자산을 ① 본사공장, ② 지방소재 공장 두 곳, ③ 제삼자의 보관과 통제하에 있는 임차창고에 보관하고 있다.<\/p><p>〈자료 2〉 나선명 회계사가 재고자산 실사입회에서 수행한 절차는 다음과 같다.<br>① 회사는 20×3년 12월 31일 기준의 재고자산을 20×4년 1월 3일에 실사할 것을 계획하고 있다. 이에 나 회계사는 본사공장의 실사에 입회할 예정이라고 회사에 미리 통보하였다.<br>② 현장실사에 입회하여 회사가 수행하는 실사절차를 확인했으며, 실사목록 중 일부 품목을 무작위 표본추출하여 현장의 실제 재고품목과 비교하였다.<br>③ 임차창고에 보관되어 있는 재고자산의 보관확인증을 B회사로부터 제출받아 확인하였다.<\/p><p>〈자료 3〉 나 회계사는 기말재고 실사입회 후 세부테스트 수행에서 20×3년도 임금이 전년 수준으로 동결되었고 제품판매단가도 200원으로 전년과 동일한데 매출총이익률이 20×2년의 10%에서 20×3년에는 25%로 상승하였음을 발견하였다. 나 회계사는 원인을 파악하기 위해 제품제조원가의 변화를 분석했는데 제품단위당 제조원가가 다음과 같이 변화했음을 파악하였다.<\/p><p style=\"text-align:right\">(단위 : 원)<\/p><table><thead><tr><th rowspan=\"2\">항 목<\/th><th colspan=\"2\">20×3년<\/th><th colspan=\"2\">20×2년<\/th><\/tr><tr><th>금 액<\/th><th>비 율<\/th><th>금 액<\/th><th>비 율<\/th><\/tr><\/thead><tbody><tr><td>재료비<\/td><td style=\"text-align:right\">100<\/td><td style=\"text-align:right\">66%<\/td><td style=\"text-align:right\">130<\/td><td style=\"text-align:right\">72%<\/td><\/tr><tr><td>노무비<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">14%<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">11%<\/td><\/tr><tr><td>경 비<\/td><td style=\"text-align:right\">30<\/td><td style=\"text-align:right\">20%<\/td><td style=\"text-align:right\">30<\/td><td style=\"text-align:right\">17%<\/td><\/tr><tr><td>합 계<\/td><td style=\"text-align:right\">150<\/td><td style=\"text-align:right\">100%<\/td><td style=\"text-align:right\">180<\/td><td style=\"text-align:right\">100%<\/td><\/tr><\/tbody><\/table>","13-사례":"<p>김한국 회계사는 대한주식회사의 8월 31일 재고자산을 실사입회하고 있다. 회사는 엔진부품의 도 · 소매업을 영위하며, 재고자산은 작은 볼트에서부터 중장비 엔진에 이르기까지 다양하다.<br>회사는 실사를 수행할 때 공급처로부터 물품을 수령하거나 도매고객에게 물품을 적송하는 것을 제외하고는 재고자산의 이동을 통제한다. 9월 2일 실사일에 김 회계사는 전날 발행된 마지막 적송서류와 마지막 검수보고서 번호를 감사조서에 기재하였다. 그 번호는 각각 No.109.314와 No.41.682이다.<br>김 회계사는 회사의 실사에 입회하여 일부를 표본으로 추출해 실사하였고 수량과 명세가 정확하다는 결론을 내렸다. 실사입회를 종료한 후 창고를 떠나기 전에 김 회계사는 다음의 몇 가지 보충적 감사절차를 수행하였다.<\/p><p>(1) 검수보고서를 검토하였는데, 마지막 번호는 No.41.685였다. 검수원은 9월 2일에 수령된 모든 물품은 2~3일 전에 수령된 물품과 함께 검수부서에 보관하고 있다고 답변했다.<br>(2) 적송서류를 검토하였는데, 마지막 번호는 No.109.317이었다. 적송부서 담당자는 당일 출고분 중 3건은 오전에, 2건은 오후에 이루어졌고, 현재 운송중인 것은 1건뿐이라고 답변했다.<br>(3) 검수부서에 문의해 9월 1일에 수령된 물품을 확인하였다. 검수원에 따르면 검수보고서 No.41.680에서 No.41.682까지가 9월 1일에 선적된 것이었다.<br>(4) 적송부서에 문의해 9월 1일에 출고되거나 직접 판매된 물품을 확인하였다. 담당자에 따르면 적송서류 No.109.311부터 No.109.313까지는 9월 1일에 출고된 것이었다. 그는 김 회계사에게 약 300장에 달하는 매출주문서 부본을 제시하였고, 9월 1일 매출액(소매)은 총 ₩12,690이나 8월 매출액에 포함되지 않았다.<br>(5) 검수부서에서 회사 실사팀의 수량조사내용을 확인하였으며, 재고수량에 포함된 검수보고서 번호는 No.41.674에서 No.41.684까지이다.<br>(6) 적송부서에서 회사 실사팀의 수량조사내용을 확인하였으며, 재고수량에 포함된 적송서류 번호는 No.109.316에서 No.109.317까지이다. 9월 2일에 출고된 모든 재고자산이 재고자산의 수량조사에 포함된 것을 확인했다.<\/p><p>김 회계사는 기말감사절차의 수행중 물품수령과 출고에 관한 다음의 구입원가, 판매가격, FOB조건 및 기타 관련자료를 수집하였다.<\/p><p style=\"text-align:center\">〈자료 1 : 재고자산의 수령〉<\/p><table><thead><tr><th>검수보고서 번호<\/th><th>선적일<\/th><th>수령일<\/th><th>수령액<\/th><th>8월수령대장에 포함여부<\/th><th>FOB조건<\/th><\/tr><\/thead><tbody><tr><td>No.41.679<\/td><td style=\"text-align:right\">8-29<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">₩860<\/td><td>포 함<\/td><td>도착지<\/td><\/tr><tr><td>No.41.680<\/td><td style=\"text-align:right\">8-27<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">1,211<\/td><td>포 함<\/td><td>선적지<\/td><\/tr><tr><td>No.41.681<\/td><td style=\"text-align:right\">8-20<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">193<\/td><td>포 함<\/td><td>선적지<\/td><\/tr><tr><td>No.41.682<\/td><td style=\"text-align:right\">8-27<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">4,674<\/td><td>포 함<\/td><td>도착지<\/td><\/tr><tr><td>No.41.683<\/td><td style=\"text-align:right\">8-30<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">450<\/td><td>비포함<\/td><td>도착지<\/td><\/tr><tr><td>No.41.684<\/td><td style=\"text-align:right\">8-30<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">106<\/td><td>비포함<\/td><td>선적지<\/td><\/tr><tr><td>No.41.685<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">2,800<\/td><td>비포함<\/td><td>선적지<\/td><\/tr><tr><td>No.41.686<\/td><td style=\"text-align:right\">8-30<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">686<\/td><td>비포함<\/td><td>도착지<\/td><\/tr><\/tbody><\/table><p style=\"text-align:center\">〈자료 2 : 재고자산의 출고〉<\/p><table><thead><tr><th>적송서류 번호<\/th><th>선적일<\/th><th>판매가격<\/th><th>8월판매대장에 포함여부<\/th><\/tr><\/thead><tbody><tr><td>No.109.310<\/td><td style=\"text-align:right\">8-31<\/td><td style=\"text-align:right\">₩780<\/td><td>포 함<\/td><\/tr><tr><td>No.109.311<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">56<\/td><td>포 함<\/td><\/tr><tr><td>No.109.312<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">3,194<\/td><td>포 함<\/td><\/tr><tr><td>No.109.313<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">635<\/td><td>포 함<\/td><\/tr><tr><td>No.109.314<\/td><td style=\"text-align:right\">9-01<\/td><td style=\"text-align:right\">193<\/td><td>포 함<\/td><\/tr><tr><td>No.109.315<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">1,621<\/td><td>비포함<\/td><\/tr><tr><td>No.109.316<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">945<\/td><td>비포함<\/td><\/tr><tr><td>No.109.317<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">78<\/td><td>비포함<\/td><\/tr><tr><td>No.109.318<\/td><td style=\"text-align:right\">9-02<\/td><td style=\"text-align:right\">3,611<\/td><td>비포함<\/td><\/tr><\/tbody><\/table><p>[요구사항] 검수부서와 적송부서로부터 얻은 9월 1일의 물품수령과 출고정보가 정확하다고 가정하고 다음 물음에 답하시오.<\/p>","14-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","14-서술①":"<p>이우리 회계사는 (주)금성의 이자비용과 차입금에 대한 분석적절차를 수행하였다. 이와 관련하여 기업으로부터 수집한 자료는 다음과 같다.<\/p><table><thead><tr><th>계정과목<\/th><th>20×6.1.1<\/th><th>증 가<sup>*<\/sup><\/th><th>감 소<sup>**<\/sup><\/th><th>20×6.12.31<\/th><\/tr><\/thead><tbody><tr><td>차입금<\/td><td>100억원<\/td><td>50억원<\/td><td>20억원<\/td><td>130억원<\/td><\/tr><\/tbody><\/table><p>* 동 차입금은 20×6.7.1에 신규로 조달되었다.<br>** 기초에 존재하던 차입금 중 일부가 20×6.10.1에 만기가 도래하여 상환되었다.<\/p>","14-서술②":"<p>김대한 회계사는 B회계법인 소속 공인회계사로서 PK(주)의 20×2 회계연도 어음 발행기록을 검토하고 있다.<br>경리부장은 미사용어음을 은행거래용 인감과 함께 금고에 넣어 관리하며, 퇴근 후에는 경비전문회사가 외부 침입을 감시하고 있다(도난 손실은 경비회사가 모든 책임을 짐). 경리부장은 타 부서의 요청이 있으면 인수증을 수령하고 어음을 교부하며, 어음발행대장에 즉시 기록한다. 다음은 감사절차에서 입수한 자료이다.<\/p><p>(자료 1) 회사의 유일한 거래은행인 여의도 은행으로부터 도착된 20×2년 12월 31일 현재 금융기관조회서(은행조회서) 내용 중 어음용지 교부 및 은행 미도래(즉 어음 미회수) 내역은 다음과 같다. 아래의 20×2년 12월 31일 현재 상황은 감사기간중에도 변동이 없었다.<\/p><table><thead><tr><th>교부일자<\/th><th>교부어음번호<\/th><th>미회수어음번호<\/th><\/tr><\/thead><tbody><tr><td>20×2. 1. 7<\/td><td>#12340~#12349<\/td><td style=\"text-align:right\">12342, 12344, 12345,<br>12347, 12348, 12349<\/td><\/tr><\/tbody><\/table><p>(자료 2) 회사의 어음 발행대장 : 모든 발행기록이 포함됨　　(단위 : 백만원)<\/p><table><thead><tr><th>발행일자<\/th><th>어음번호<\/th><th>액면금액<\/th><th>비 고<\/th><\/tr><\/thead><tbody><tr><td>20×2.01.10<\/td><td style=\"text-align:right\">#12340<\/td><td style=\"text-align:right\">200<\/td><td><\/td><\/tr><tr><td>20×2.02.01<\/td><td style=\"text-align:right\">12346<\/td><td style=\"text-align:right\">850<\/td><td><\/td><\/tr><tr><td>20×2.04.03<\/td><td style=\"text-align:right\">12343<\/td><td style=\"text-align:right\">1,000<\/td><td><\/td><\/tr><tr><td>20×2.06.14<\/td><td style=\"text-align:right\">12344<\/td><td>백지<\/td><td>차입금 담보로 제공<\/td><\/tr><tr><td>20×2.08.06<\/td><td style=\"text-align:right\">12341<\/td><td style=\"text-align:right\">5,000<\/td><td><\/td><\/tr><tr><td>20×2.09.07<\/td><td style=\"text-align:right\">12349<\/td><td style=\"text-align:right\">200<\/td><td>계약 이행의 담보로 제공<\/td><\/tr><tr><td>20×2.11.09<\/td><td style=\"text-align:right\">12347<\/td><td style=\"text-align:right\">250<\/td><td><\/td><\/tr><\/tbody><\/table><p>(주) 비고란에 특별한 표시가 없는 것은 외상매입금 결제용임.<\/p><p>(자료 3) 외상매입금 결제를 위해 발행한 어음은 지급어음계정에 기록하며, 차입금계정은 어음의 발행과 관계가 없다. 지급어음계정의 당기 대변기입액 합계는 7,050백만원이었다.<br>(자료 4) 담보로 제공된 어음은 회사가 어음보관 영수증 원본을 갖고 있음을 확인했으며, 미사용어음용지의 실사에서 예외사항은 발견되지 않았다.<\/p>","14-서술③":"<p>온세계 회계사는 20×1년 12월 31일로 종료하는 지구주식회사 재무제표의 감사종료단계에서 후속기간에 해당하는 “20×2년도초의 전표철과 분개의 타당성에는 어떤 문제점도 존재하지 않는다”고 주장하는 지구주식회사의 이사와 감사업무에 대한 대화를 나누었다. 이 이사는 “① 너무 늦게 거래처로부터 청구서를 받았기 때문에 20×1년 12월의 전표철에 포함되지 못한 20×1년도의 청구액은 원장을 수정기입해 20×1년으로 바르게 회계처리되었고, ② 내부감사인은 재무제표일 후의 후속사건을 세부검증하였으며, ③ 온 회계사에게 전표철 회계시스템에서 발생할 수 있는 부외부채는 존재하지 않는다는 경영진서면진술을 제출하겠다”고 진술하였다.<\/p>","14-서술④":"<p>공기청정기를 제조판매하는 샛별기업은 최근 5년 동안 판매가 급증해 빠른 성장을 하고 있다. 당해연도말 현재 상당한 여유자금을 확보하여 장래의 시설확장에 대비하고 있다. 작년에 새로 취임한 김재무 사장은 올해 여유자금 상당금액을 단기매매목적으로 상장주식에 투자했으며, 일부는 소액이지만 파생상품에도 투자했다.<br>샛별기업은 자산운용전문사에게 투자자산의 관리를 위탁했으나, 증권 매매거래에 관한 최종의사결정은 김재무 사장이 직접 수행하고 있다. 샛별기업의 재무제표를 감사하는 김태평 회계사는 당년도의 감사계획 수립과정에서 다음 사항을 발견하였다.<\/p><p>(1) 이사회 운영규정에 따라 김 사장은 투자전략을 수립해 이사회의 승인을 받는다. 이사회는 금융자산의 매매의사결정에 관여하지 않으며, 파생상품 매매계약체결에도 관여하지 않는다.<br>(2) 연말 금융자산 비중은 총자산의 15% 정도를 차지한다. 대부분이 단기매매목적으로 보유한 주식이며, 고위험 주식의 비중도 꽤 높은 편이다.<br>(3) 김 사장이 직접 단기매매 또는 현금흐름수취 등 투자목적의 의도와 분류방법을 결정한다.<br>(4) 당기의 금융자산평가이익 금액이 전기에 비해 크게 증가하였다.<br>(5) 회사는 빠른 속도로 성장하고 있으며, 김 사장은 자산수익률에 따라 상여금이 결정되는 보상계약을 체결하였다.<\/p>","14-서술⑤":"<p>임꺽정 회계사는 고려주식회사의 은행거래와 관련한 내부통제를 검토하고 다음과 같은 사실을 확인하였다.<\/p><div class=\"box\">회사는 인터넷을 통한 자금이체제도를 이용하고 있다. 회사는 출납직원인 김미화와 담당부장을 은행에 거래 담당직원으로 등록하고 은행거래를 위한 비밀번호를 이들에게 부여하고 있다.<br>인터넷 자금이체제도를 통하여 김미화는 회사의 은행계좌간 자금이체뿐만 아니라 회사의 거래처에 대한 매입채무의 지급 및 직원의 계좌로의 급여이체 업무를 수행하고 있다. 김미화는 개별금액이 천만원 미만이면 단독으로 인터넷 자금이체제도를 사용하여 자금을 이체할 수 있으며, 천만원이 초과하면 담당부장과 김미화가 동시에 은행의 전산망에 접근(access)해야만 자금을 이체할 수 있다.<br>개별금액이 천만원 미만이면 김미화가 인터넷 자금이체제도를 이용할 수 있는 일일 사용횟수의 제한은 없다. 김미화는 매월말 당좌거래은행계좌에 대하여만 은행계정조정을 실시하고 그 결과를 담당부장에게 보고하며 기타의 은행계좌에 대하여는 은행계정조정을 실시하지 않고 있다. 김미화와 담당부장은 5년 이상 회사의 자금관리업무를 특별한 사고 없이 잘 수행하고 있다.<\/div>","14-서술⑥":"<p>별나주식회사는 현금거래의 내부통제가 매우 취약하다. 감사인은 20×1년 11월 30일 현금및현금성자산잔액과 관련해 다음 사항을 파악하였다.<\/p><p>(1) 회사의 현금원장 잔액은 ₩1,890,162이다. 동 잔액은 미기록예금을 포함하고 있으며, 은행측 기록의 회사예금 이자수익 ₩10,000은 현금출납장에 표시되어 있지 않았다.<br>(2) 은행잔액증명서의 잔액은 ₩1,555,000이다. 기발행미지급수표는 No.62(₩11,625), No.103(₩15,000), No.284(₩25,325), No.8621(₩19,071), No.8623(₩20,680), No.8632(₩14,528)로 확인되었다.<br>(3) 출납담당자는 미기록예금을 ₩379,441인 것으로 추산하였고 이에 따라 다음과 같은 은행계정조정표를 작성하였다.<\/p><table><tbody><tr><td>Ⅰ. 회사측 잔액(20×1.11.30)<\/td><td><\/td><td><\/td><\/tr><tr><td>　가산 : 기발행미지급수표<\/td><td><\/td><td style=\"text-align:right\">₩1,890,162<\/td><\/tr><tr><td>　No.8621<\/td><td><\/td><td><\/td><\/tr><tr><td style=\"text-align:right\">　　8623<\/td><td style=\"text-align:right\">₩19,071<\/td><td><\/td><\/tr><tr><td style=\"text-align:right\">　　8632<\/td><td style=\"text-align:right\">20,680<\/td><td><\/td><\/tr><tr><td><\/td><td style=\"text-align:right\">14,528<\/td><td style=\"text-align:right\">44,279<\/td><\/tr><tr><td><\/td><td><\/td><td style=\"text-align:right\">₩1,934,441<\/td><\/tr><tr><td>　차감 : 미기록예금<\/td><td><\/td><td style=\"text-align:right\">(379,441)<\/td><\/tr><tr><td>Ⅱ. 은행측 잔액(20×1.11.30)<\/td><td><\/td><td style=\"text-align:right\">₩1,555,000<\/td><\/tr><tr><td>　차감 : 기록누락 대변금액(이자수익)<\/td><td><\/td><td style=\"text-align:right\">(10,000)<\/td><\/tr><tr><td>　현금시재액(20×1.11.30)<\/td><td><\/td><td style=\"text-align:right\">₩1,545,000<\/td><\/tr><\/tbody><\/table>","14-서술⑦":"<p>다음은 20×5년 10월 중순 어느 일간신문에 게재된 기사의 내용을 요약 · 정리한 것이다.<br>“국내 기업들이 타인의 양도성예금증서(CD)를 잠시 빌려오거나, 편법으로 발행한 분식(粉飾)회계 규모가 최대 1조 8,600억원에 달하는 것으로 조사됐다.”<\/p><p>〈참고〉<br>(가) 편법 CD 빌리기란 기업이 CD 발행비용과 거래차익을 부담하고, 증권사로 하여금 은행으로부터 CD를 구입하도록 하고, 증권사가 구입한 CD를 잠시 빌려와 기말에 보유하고 있는 것처럼 회계장부를 꾸며 자산을 부풀리는 행위이다.<br>(나) 편법 CD 발행이란 기업이 은행에서 CD를 발행하는데 대금은 증권사가 부담하는 변칙거래이다. 기업은 연말 감사기간에 증권사로부터 자금을 제공받아 은행으로부터 CD를 구입하여 자산으로 계상한다. 감사가 종료되면 해당 기업은 자금을 제공한 증권사에 해당 CD를 할인된 가격으로 매각하고, 증권사는 이를 투신사 등에 차익을 붙여 되판다.<\/p><div class=\"box\"><p style=\"text-align:center\">편법 CD발행 거래<\/p>은 행 ← 수수료 ― 기 업 ← 자금지원 ― 증권사 ← 매매차익 ― 투신사<br>은 행 ― 기업명의 CD발행 → 기 업 ― 감사종료 후 싼값에 CD 매각 → 증권사 ― 재매각 → 투신사<\/div><p>[요구사항] 감사인은 재무제표를 중요하게 왜곡표시할 수 있는 상황이 존재한다는 전문가적인 의구심을 가지고 CD 등의 실재성 및 소유권 등을 확인하기 위한 절차를 수행해야 한다. 위와 같은 유형의 거래에서 감사인이 수행해야 할 다음의 감사절차를 기술하시오.<\/p>","14-사례":"<p>대한회사의 총계정원장에 기록된 어음상 차입금계정 기말잔액은 ₩186,000이고, 지급어음의 수는 20매이며, 어음소지자(수취인)는 총 8명이다. 지급기간은 30일에서 120일까지 다양하며, 금액도 ₩1,000에서 ₩10,000까지 다양하다. 현금조달을 위해 발행한 경우와 유형자산의 구입을 위해 발행한 경우 등 여러 유형이 있다. 회사는 모든 자산이 담보물로 근저당으로 설정되어 있어 단기차입금에 의존할 수밖에 없다. 대한회사는 이러한 이유로 심각한 운영자금 부족난을 겪고 있다.<br>감사인은 발행어음의 장부기록절차도 높은 빈도의 차입금 거래를 고려할 때 양호하다고 판단하였다. 어음보조원장도 없고 기말잔액에 대한 독립적인 내부검증절차도 존재하지 않는다. 발행어음의 기록업무는 현금에의 접근이 통제된 회계담당자가 수행하고 있다.<br>대한회사에 관한 회계감사는 수년간 동일한 회계법인이 수행하고 있으며, 당기에는 어음상 차입금계정 검증을 위해 다음의 감사절차를 수행하였다.<\/p><p>① 회사로부터 차입금계정명세서를 받아 명세서의 지급어음잔액을 계산검증하고 총계정원장에 금액을 추적한다.<br>② 차입금계정명세서에 포함된 모든 기발행미지급어음은 어음부본을 검토한다. 어음부본의 수취인(채권자) 성명, 금액, 발행일 등을 명세서와 대조한다.<br>③ 차입금계정명세서의 어음소지자에게 조회한다. 조회내용에는 지급기일, 지급금액, 재무제표일 현재 미지급이자 등이 포함되어 있다.<br>④ 차입금계정명세서에 포함된 모든 어음의 발생이자를 재계산한다. 정확한 발생이자를 계산하는 데 필요한 정보는 어음부본으로부터 구한다. 발생이자의 금액을 재계산한 후 총계정원장의 금액과 비교한다.<\/p>","15-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","15-서술①":"<p>감사인은 경영진이 어떻게 특수관계자를 파악하고 이에 대한 공시를 적절히 하는지, 그리고 재무제표에 중요한 특수관계자거래가 미치는 영향을 어떻게 파악하고 공시하는지 충분하고 적합한 감사증거를 입수할 수 있도록 감사절차를 설계하고 수행해야 한다.<\/p>","15-서술②":"<p>한국회계법인의 김철수 공인회계사는 디자인주식회사의 20×4회계연도 재무제표에 대한 감사절차를 종료하고 상급자(담당이사)와 감사의견을 협의할 예정이다. 김철수 회계사는 감사절차에서 파악한 사항을 다음과 같이 요약하였다.<\/p><p>• 20×4년 12월 31일 현재 총자산은 3,000억원, 부채총계는 2,900억원, 자본총계는 100억원이다. 이 중 유동자산은 1,000억원이며 유동부채는 1,200억원이다.<br>• 20×4년 매출액은 3,000억원, 매출총이익은 600억원, 영업이익은 100억원, 이자비용은 150억원이다.<br>• 기업은 20×0년도까지는 실적이 양호한 초우량기업이었으나 창업주의 2세가 경영권을 물려받은 후부터 공격적으로 경영하여 기업의 재무상태가 악화되어 20×3년도에 법정관리에 들어갔다. 기업은 채권단과 채무상환계획을 조정하여 원금상환을 유예받고 20×4년부터 원금을 상환하기로 하였다. 기업은 법정관리 합의사항에 따라 20×4년도 10월에 제1차 원금을 상환하기로 했으나 자금사정으로 상환을 하지 못하고 있다.<br>• 기업의 부채총계 2,900억원 중 금융기관 차입금은 2,000억원으로 법정관리 합의사항에 따라 20×4년부터 매년 400억원씩 상환해야 한다.<br>• 기업은 채권단과 채무상환계획을 재협의하여 이자율을 인하하고 원금의 일정부분을 면제받으려고 협상중이다. 채권단은 100개 이상의 금융기관으로 구성되어 있으며, 기업이 작성한 채무조정안에 대하여 일체의 의견을 제시하지 않고 있다. 전체 채권단의 회의는 20×5년 6월중에 열릴 예정이며, 이 회의에서 채무조정안의 채권단 의견이 결정된다.<br>• 채권단에서 한국회계법인의 감사보고서를 20×5년 3월 31일까지 요구하고 있다.<\/p><p>[요구사항] ※ 다음 각 요구사항은 독립적인 상황이다.<\/p>","15-서술③":"<p>강정아 회계사는 벤처기업인 (주)광우킬러의 20×1년 재무제표를 감사하고 있다. 강 회계사는 벤처기업에서는 계속기업전제의 검토가 중요하다고 판단하여 감사계획을 수립하는 과정에서 기업과 관련한 거시 및 미시적 경쟁상황을 파악하였다. 강 회계사의 이해에 따르면, (주)광우킬러는 경쟁환경이 치열해져가는 상황이나 이와 관련하여 기업이 20×3년 이후 광우병 예방주사가 출시되면 대폭적인 매출신장으로 이어질 것으로 판단하고 있다. 식품의약품안전처에서 신약에 대한 승인을 강화하는 추세이다.<br>강 회계사는 차입금계정을 감사하던 중 기업이 (1) <u>명륜은행과의 대출조건을 이행하지 못하고 있음을 발견하였다.<\/u> 강 회계사는 차입약정서의 대출조건 준수 불이행으로 계속기업의 유의적인 불확실성이 존재한다고 판단하고 경영진에게 향후 계획을 질문하였다. (2) <u>(주)광우킬러의 대표이사인 소 사장이 작성한 자금수지계획서에 따르면 20×3년에 출시할 광우병 예방주사로 매출은 현재보다 300%로 급증할 것이며, 마진율이 높기 때문에 영업활동 현금흐름이 개선되어 차입금상환이 약정대로 이루어질 것으로 기대하고 있다.<\/u><\/p>","15-서술④":"<p>X회계법인은 대형해운사인 A해운(주)의 20×1년도 재무제표(1.1~12.31)를 감사하고 있다. 최근 세계경제의 악화로 작년에 중대형 해운업체 38개 중 4개사가 퇴출되고 3개사는 워크아웃되었다. 감사인은 해운업의 불황으로 계속기업전제의 검토가 매우 중요하다고 판단하고 있다.<br>(1) <u>A해운(주)의 경영진은 계속기업으로서의 존속능력에 대한 예비평가를 수행하였으며, 계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 상황을 식별하였다.<\/u><br>A해운(주)는 최근 3년간 상당한 규모의 영업손실이 발생하여, 20×2년 9월에 만기가 도래하는 확정만기 차입금을 정상적인 영업활동으로는 상환이 불가능한 것으로 나타났다. 만약 만기도래하는 차입금을 상환하지 못하면 A해운(주)는 부도위험에 직면할 수 있다. 감사인은 만기도래 예정인 차입금의 상환가능성이 계속기업으로서의 존속능력에 유의적 의문을 초래한다고 판단하였다. 감사인은 이를 극복하기 위한 향후 계획을 경영진에게 질문하였다.<br>이에 대하여 (2) <u>경영진은 경영개선계획을 작성하여 감사인에게 제시하였다.<\/u> (3) <u>경영진이 제시한 경영개선계획에 따르면, A해운(주)는 20×2년 3월부터 브라질에 소재한 B정유와 독점적으로 원유수송업무를 제공하는 계약을 체결할 예정이다. 이러한 계약이 체결되면 영업활동 현금흐름이 개선되어 예정대로 차입금을 상환할 수 있을 것으로 전망하고 있다.<\/u><\/p>","15-서술⑤":"<p>재무제표일 후에 발생한 중요한 사항을 적절히 감사보고서에 반영해야 한다. 다음 각 사례는 재무제표에 중대한 영향을 줄 수 있는 사건이며, 모든 사례는 국제회계기준을 채택하고 있다.<\/p><table><thead><tr><th>사 례<\/th><th>사건발생일<\/th><th>사건확인(발견)일<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>재무제표일 이전<\/td><td>감사보고서일 이전<\/td><\/tr><tr><td>B<\/td><td>재무제표일 이전<\/td><td>감사보고서 제출일 직전<\/td><\/tr><tr><td>C<\/td><td>재무제표일 이후<\/td><td>감사보고서일 이전<\/td><\/tr><tr><td>D<\/td><td>감사보고서일 이후<\/td><td>감사보고서 제출일 직전<\/td><\/tr><tr><td>E<\/td><td>감사보고서 제출일 이후<\/td><td>감사보고서 제출일 이후<\/td><\/tr><\/tbody><\/table>","15-서술⑥":"<p>다음은 대한주식회사에서 보고기간말 이후부터 감사보고서일까지 발생한 독립적인 사건이다.<\/p><p>(1) 전년도 법인세에 대한 국세청의 추징결의서가 당년도 보고기간말 이후에 기업에게 통보되었다.<br>(2) 지방자치단체는 기업이 당기에 배출한 폐수와 관련하여 보고기간말 이후에 기업을 검찰에 환경공해사범으로 고소하였다.<br>(3) 보고기간말 이후 이사회에서 무상증자를 결의하였다.<br>(4) 큰 비중의 처분이익이 발생하는 유형자산을 보고기간말 이후에 매각하였다.<\/p>","15-서술⑦":"<p>X회계법인은 A(주)의 20×1년 재무제표를 감사중이다(감사보고서일 : 20×2년 2월 14일). 감사인은 감사보고서일에 알았더라면 감사보고서를 수정할 원인이 될 수도 있었던 사실을 20×2년 2월 28일에 알게 되었다. 감사인은 감사보고서를 아직 회사에 전달하지 않았다.<\/p>","15-서술⑧":"<p>감사인은 모든 활동유형에 대해 통제테스트와 실증절차를 마친 후, 감사의 종료단계에서 개별 감사결과를 종합하고 수집된 증거를 평가하여 의견을 형성한다.<\/p>","15-서술⑨":"<p>다음은 A해운(주)의 감사절차를 종료하는 시점에서 X회계법인의 업무수행이사와 현장책임회계사가 나눈 대화이다.<\/p><p>업무수행이사 : A해운(주)로부터 서면진술은 입수했나요? 감사조서를 보니 감사대상기간(20×1.1.1~20×1.12.31)중인 20×1년 5월 1일에 최고경영진이 차○○ 사장에서 변○○ 사장으로 변경되었군요.<br>현장책임회계사 : 변○○ 사장은 회계기간중에 취임했기 때문에 취임 전 기간에 대한 서면진술을 제공할 수 없다고 하네요. 감사계약서에도 차○○ 사장이 서명하지 않았냐며 항의했습니다.<br>업무수행이사 : 그래서 서면진술은 누구에게, 어떻게 받았습니까?<br>현장책임회계사 : <u>(1)로부터<\/u> 서면진술을 받았습니다. 서면진술일은 <u>(2)의 일자<\/u>로 확인받았습니다.<\/p>","15-서술⑩":"<p>감사인은 감사절차의 성격, 시기 및 범위를 결정하거나 왜곡표시의 영향을 평가할 때 중요성을 고려해야 한다. 한국(주)의 다음 자료를 토대로 감사과정에서 발견된 사항과 감사인이 설정한 중요성기준에 관련된 다음의 물음에 답하시오. 단, 법인세비용은 고려하지 않는다.<\/p><p>(1) 5년 전부터 코스닥등록을 준비해온 한국(주)는 12월말 결산법인(회계기간 : 1.1~12.31)이며, 통신부품의 생산, 판매를 주력사업으로 하며 부동산임대업을 부수적으로 영위하고 있다.<br>(2) 한국(주)의 전기감사에서 파악한 미수정왜곡표시사항은 다음과 같다.<br>① 상각후원가측정금융자산의 손상차손 : ₩3,000,000 미계상<br>② 위험회피회계 적용대상인 확정계약의 평가손실 : ₩250,000 미계상<br>(3) 당기감사에서 발견한 사항<br>① 당기말 재고자산의 실증절차에서 ₩2,000,000의 불량재고가 포함되어 있음이 밝혀졌다. 불량재고의 공정가치는 ₩500,000으로 즉시 매각가능하다. 기업의 경영진은 실제로 매각을 하기 전까지는 취득원가인 ₩2,000,000으로 계상하는 것이 타당하다고 주장했다.<br>② 당기 1월 1일, 생산공정 개선과 관련하여 외부의 전문엔지니어링사로부터 1년간 기술자문을 받기로 계약하였다. 기술자문료는 총 ₩4,800,000이나, 자문료 지급 약정에 따라 매년 ₩2,400,000씩 2년간에 걸쳐 지급하기로 하였다. 기업의 경영진은 당기에 지급한 ₩2,400,000을 기술자문료로 계상하였다.<br>③ 위험회피회계 적용대상인 확정계약의 평가손실이 당기말에 ₩500,000이 추가로 발생하였다. 기업의 경영진은 확정계약이 이행될 예정인 다음 회계연도 1월 10일까지 회계처리를 하지 않기로 결정하였다.<br>④ 기업의 주요 거래처에 대한 대손충당금 추정에 있어 기업의 경영진은 ₩4,500,000의 대손충당금을 설정하였다. 감사인은 감사증거를 입수해 ₩6,500,000을 설정하는 것이 합리적이라고 판단하여 경영진에게 수정을 요구하였다. 경영진은 감사인의 수정요구를 거부했다.<\/p>","15-사례":"<p>바른회계법인의 공명한 회계사는 생수를 시판하는 샘물기업(상장기업)의 재무제표를 감사중이다. 공 회계사는 감사업무의 수행중 샘물기업의 대표이사와 면담해 재무담당부사장(CFO)인 조신중 씨가 다음과 같은 이유로 당기감사인이 요구하는 경영진서면진술에 서명하지 않고 있다는 사실을 알게 되었다.<\/p><p>(1) 올해 가뭄과 지난 겨울의 평균 이하 적설량으로 심각한 식수부족이 발생해, 정부에서는 한시적으로 식수의 소비제한을 고려하는 등 식수절약운동을 적극 추진하고 있다.<br>(2) 조신중 씨는 정부의 식수소비제한 조치가 주생산품인 생수 매출에 미치게 될 영향을 우려하고 있다. 조신중 씨는 정부의 조치로 매출 20%에 해당하는 많은 재고가 증가하고 앞으로 매출이 감소할 것으로 믿고 있다. 어떤 방법으로 측정하든 이 금액은 매우 커 기업 운영에 심각한 자금난을 초래할 것으로 판단한다.<\/p><p>기업의 다른 임원들은 재무담당부사장(CFO)인 조신중 씨의 자금난 전망 의견에 동의하지 않고 있다. 사장은 모든 사람은 물이 필요하고 식수부족은 사람들을 집 안에 더 머물도록 하기 때문에 생수의 판매가능성은 오히려 증가할 것이라고 주장하고 있다. 조신중 씨를 제외한 다른 임원들도 금년도의 재고량이 과다한 수준이라고 생각하고 있다.<br>샘물기업을 감사하고 있는 공 회계사는 과거의 판매수준을 고려했을 때 기업의 재고가 적정한 수준이라고 판단하고 있다. 공 회계사는 기업의 영업활동에 대한 조신중 씨의 견해가 매우 중요하다고 믿고 있다. 조신중 씨가 경영진서면진술에 서명하기를 거부했다는 사실을 인용하여 감사보고서에 감사범위 제한에 따른 한정의견을 표명하려고 한다.<\/p>","16-진위":"<p>다음의 설명을 읽고, 틀린 기술이라면 그 이유를 제시하시오.<\/p>","16-서술①":"<p>다음의 몇 가지 독립적인 상황을 읽고 아래 물음에 답하시오.<\/p><p>(1) P공인회계사는 감사보고서 발행 전 후속사건의 검토과정에서 보고기간말 이후의 후속기간에 두 개의 공장 중 한 곳에 화재가 발생해 막대한 손실을 입었다는 사실을 알게 되었다. 공장은 화재보험에 가입되지 않았다. 기업측이 작성한 재무제표와 주석에서는 화재로 인한 손실이 공시되지 않았다. 이러한 사항이 재무제표에 미치는 영향은 중요하며 전반적이다.<br>(2) L공인회계사는 여러 도시에 지점망을 갖고 있는 대규모 제조기업의 재무제표를 감사하고 있다. L회계사는 여러 지점 영업소의 회계연도말 송금액에 대한 미기록 예금액을 확인할 수 없었다. L회계사는 대금회수의 기간귀속 검증을 위한 대체적 감사절차로 당기말 은행계정조정표의 미기록예금을 후속기간 검증 등을 통해 조사했다. 그는 이러한 대체적인 절차를 수행해 대금회수의 기간귀속에 대해 만족할 만한 결과를 얻었다.<br>(3) 20×5년 1월 2일, 새벽자동차제조기업은 주공급업자로부터 즉시 모든 도매가격을 10% 인상할 것이라는 통지를 받았다. 통지사항에 근거하여, 새벽자동차제조기업은 20×4년 12월 31일 현재의 재고자산을 다음 연도초에 인상될 원가를 반영하여 재평가하였다. 재고자산은 총자산에서 큰 비중을 차지한다. 유동자산에 미치는 영향은 중요하나, 재무제표에 미치는 영향은 전반적이지 않다. 이러한 평가증의 사실은 적절히 주석으로 공시되었다.<br>(4) 아침법인의 연구진은 20×4년중 새로운 공해방지장치를 개발하는 데 전력을 기울였다. 연구단계에서 발생한 지출을 무형자산으로 계상하여 20×4년 12월 31일 재무상태표에 보고하였다. 공인회계사인 K씨는 20×4년 재무제표를 감사하는 과정에서, 연구결과가 시장성 있는 제품을 생산하는 데 기여할 수 있다는 설득력 있는 증거를 입수하지 못하였다. 무형자산으로 계상된 금액은 당기순이익에서 차지하는 비중이 중요하며, 재무제표에 미치는 영향도 전반적이다.<br>(5) C공인회계사는 샛참제조기업의 재무제표를 감사하고 있다. 감사범위와 관련하여 기업측의 요구로 재고자산실사가 제한되었다. C회계사는 재고자산이 중요한 금액이고 대체적 감사절차로는 만족할 수 없다고 판단하고 있으며, 이러한 감사범위 제한사항이 재무제표에 미치는 영향은 중요하지만 전반적이지는 않다.<br>(6) P회계사는 동녘기업의 재무제표를 감사하는 과정에서 이사회 회의록의 열람을 거절당했다. 이러한 제한이 재무제표에 미치는 영향은 중요하며 전반적이다. 기업측은 P회계사에게 회계문제에 관련한 기업의 모든 결정과 조치에 대하여 경영진서면진술을 제공했다.<br>(7) A공인회계사는 20×4년 12월 31일로 종료하는 왕고물버스기업의 재무제표감사를 수행중이다. 20×4년 이전에 기업은 버스의 내용연수를 10년으로 정하여 감가상각했다. 20×4년중 기업은 보다 현실적인 추정내용연수는 12년이라고 결정하고 수정된 추정치에 근거하여 20×4년 감가상각비를 계상하였다. A회계사는 12년의 내용연수변경이 정당한 사유에 근거하고 있다고 인정하였다. 왕고물버스기업은 추정내용연수의 변경과 그 변경이 20×4년 당기순이익에 미치는 효과가 중요하므로 이를 재무제표의 주석으로 적절히 공시하였다.<\/p>","16-서술②":"<p>다음 각 상황은 독립적이다.<\/p><p>(1) (주)고려는 20×7년 12월 31일 현재 단기자금운용목적으로 거래소 상장기업인 (주)백제의 주식 2%(취득원가 100억원, 공정가치 95억원)를 취득하여 보유하고 있다. (주)고려는 20×7년에 동 주식을 공정가치로 평가하며 평가손실 5억원을 인식하여 재무제표에 반영하였다. (주)고려의 20×7년 재무제표에 대한 감사가 진행중인 20×8년 1월 20일에 (주)백제를 상대로 특허권 침해소송이 제기됨에 따라 (주)고려가 보유한 (주)백제 주식의 가치는 60억원으로 하락하였다. 경영진은 (주)백제의 주식 가격하락이 결산일 이후에 발생한 것이며, 결산시점에서 전혀 예측할 수 없었던 사안이므로 20×7년 재무제표를 수정하지도 않았고 주석으로 공시하지도 않았다.<br>(2) (주)부여는 기계장치의 내용연수를 10년에서 12년으로, 건물의 내용연수를 20년에서 25년으로 변경하였다. 감사인은 이러한 내용연수 변경이 타당하다고 판단했다. (주)부여는 내용연수 변경의 누적효과를 계산해 기초이익잉여금에 반영했으며 변경내용과 영향을 주석으로 적절히 공시하였다.<br>(3) (주)조선은 20×7년 10월에 특허권 침해와 관련하여 로열티와 손해배상금을 지급할 것을 요구하는 소송에 피소되었으며, (주)조선도 상대방을 제소하여 재판에 계류중이다. 20×7년 12월 31일 현재 최종 재판결과는 예측할 수 없으며, (주)조선은 소송의 결과로 부담할 수 있는 손실에 대해 재무제표 본문에 반영하지 않고 주석으로 공시했다.<br>(4) (주)신라에너지는 20×7년 12월 31일 현재 원유 100,000배럴을 재고자산으로 보유하고 있으며, 배럴당 구입원가는 1,000원이었다. 재무제표일로부터 감사보고서일 사이에 중동에서 전쟁이 발발하여 유가가 배럴당 2,000원으로 급등하였다. (주)신라에너지는 재무제표일 후 중요한 가격변화를 반영하여 20×7년 12월 31일 재무제표에 재고자산을 배럴당 2,000원으로 평가하여 보고하였다.<br>(5) (주)명륜은 핸드폰을 제조하는 업종을 영위하는 중견기업으로 제품의 대부분을 국내보다는 중국에 수출하고 있다. 초창기에는 수출물량이 많아 영업실적이 상승하였으나 최근 2~3년 전부터 중국의 경쟁기업들이 핸드폰 가격을 인하하여 (주)명륜의 영업실적이 급격히 악화하고 있다. 향후 중국 휴대폰 시장의 경쟁심화와 주요 원자재의 가격상승으로 영업환경의 어려움이 예상된다. 회계감사를 수행하고 있는 장 회계사는 이 상황이 계속기업으로서의 존속능력에 유의적인 의문을 초래할 상황으로 파악하고 있다. 장 회계사는 이 기업이 계속기업으로 존속할 수 있을 것인지를 판단하기 위하여 충분하고 적합한 감사증거를 수집하고 경영진이 작성한 영업실적개선계획서도 제시받아 검토하는 등의 감사절차를 수행하였다.<br>장 회계사는 (주)명륜의 경영진이 작성하여 제시한 영업실적 개선계획서의 내용을 검토했는데 실현가능성이 없다고 판단하였다.<br>〈사례 가〉 계속기업 관련 불확실성이 재무제표에 적절히 공시된 경우<br>〈사례 나〉 계속기업 관련 불확실성이 재무제표에 적절히 공시되지 않은 경우<\/p>","16-서술③":"<p>비교재무제표에 표시되는 전기재무제표와 관련하여 세 가지 상황이 발생할 수 있다. 전기에 이어 당기에도 동일감사인이 계속감사, 전기재무제표를 전임감사인이 감사, 전기재무제표가 감사를 받지 않은 경우로 구분할 수 있다.<\/p><p>(상황 1)<br>전기(20×1년)에 이어 당기(20×2년)에도 동일감사인인 한국회계법인이 감사하고 있다. 20×1년에는 한정의견이었으며, 20×2년에는 적정의견이 표명될 예정이다. 전기의 한정의견 사유는 당기말까지 해소되지 않았다.<\/p><p>(상황 2)<br>전기(20×1년)에 이어 당기(20×2년)에도 동일감사인인 한국회계법인이 감사하고 있다. 20×1년에는 한정의견이었으며, 20×2년에는 적정의견이 표명될 예정이다. 전기의 한정의견 사유는 당기중에 해소되었다.<\/p><p>(상황 3)<br>전기(20×1년)에는 다른 감사인이 감사했으며, 당기에 재무제표감사를 수임하였다. 감사인은 재고자산의 기초잔액과 관련하여 충분하고 적합한 감사증거를 입수할 수 없었다. 이러한 사항이 재무제표에 미치는 영향은 중요하지만, 전반적이지 않다. 재고자산의 기말잔액은 적절하게 계상되었으며, 법규상 의견의 분리가 금지되어 있지 않고, 전기재무제표의 감사보고서 재발행이 필요하지 않은 상황이다.<\/p><p>(상황 4)<br>전기재무제표는 외부감사법상 감사대상에 해당되지 않아 감사를 받지 않았다. 당기재무제표를 감사한 결과, 중요한 왜곡표시는 발견되지 않았다.<\/p>","16-서술④":"<p>다음 각각의 상황은 독립적이다.<\/p><p>(상황 1)<br>감사인은 감사현장을 철수하기 전에 기업으로부터 입수한 사업보고서 초안에 기재된 재무요약이 첨부된 감사보고서에 기재된 금액과 중요하게 불일치하는 것을 발견하였다. 감사인은 사업보고서에 기재된 금액을 경영진에게 수정할 것을 권고하였으나, 경영진은 사업보고서의 기재사항은 감사대상이 아니므로 수정할 필요가 없다며 수정 권고를 거절하였다.<\/p><p>(상황 2)<br>감사인은 감사보고서일 후 사업보고서에 기재된 재무요약과 감사보고서에 첨부된 재무제표에 기재된 금액이 중요하게 불일치하는 것을 발견하였다. 경영진은 감사인의 수정 권고에 동의하였으나, 감사보고서는 이미 배포되었다.<\/p>","16-서술⑤":"<p>대한민국에 소재하고 있는 지배회사인 ABC(주)는 3개의 종속회사(A, B, C)를 보유하고 있다. ABC(주)와 종속회사의 결산일은 모두 12월 31일이다. 지배회사 및 종속회사의 20×5년 주요 정보는 다음과 같다.<\/p><p style=\"text-align:right\">(단위 : 억원)<\/p><table><thead><tr><th>회사명<\/th><th>ABC(주)<\/th><th>A(주)<\/th><th>B(주)<\/th><th>C(주)<\/th><\/tr><\/thead><tbody><tr><td>구 분<\/td><td>지배회사<\/td><td>종속회사<\/td><td>종속회사<\/td><td>종속회사<\/td><\/tr><tr><td>매출액<\/td><td style=\"text-align:right\">5,000<\/td><td style=\"text-align:right\">2,000<\/td><td style=\"text-align:right\">400<\/td><td>－<\/td><\/tr><tr><td>세전손익<\/td><td style=\"text-align:right\">400<\/td><td style=\"text-align:right\">160<\/td><td>(－)18<\/td><td>(－)2<\/td><\/tr><tr><td>당기순손익<\/td><td style=\"text-align:right\">320<\/td><td style=\"text-align:right\">120<\/td><td>(－)15<\/td><td>(－)2<\/td><\/tr><tr><td>자산총계<\/td><td style=\"text-align:right\">6,000<\/td><td style=\"text-align:right\">3,000<\/td><td style=\"text-align:right\">500<\/td><td style=\"text-align:right\">50<\/td><\/tr><tr><td>자본총계<\/td><td style=\"text-align:right\">1,500<\/td><td style=\"text-align:right\">600<\/td><td>(－)100<\/td><td style=\"text-align:right\">48<\/td><\/tr><tr><td>외부감사인<\/td><td>X회계법인<\/td><td>Y회계법인<\/td><td>Z회계법인<\/td><td>감사받지 않음<\/td><\/tr><\/tbody><\/table><p>상기 재무정보는 별도재무제표 기준이며, 연결실체간의 내부거래(매출 · 매입 및 채권 · 채무 등)는 없지만, ABC(주)는 B(주)의 금융기관 차입금 400억원에 대하여 지급보증을 제공하고 있다. C(주)는 신규사업을 위해 당기에 설립되었으며, 당기말 현재 사업을 준비중이다.<br>X회계법인은 ABC(주)에 대한 20×5년 그룹감사를 수행하고 있으며, 중요성기준은 세전이익의 5%로 설정하였다.<\/p>","16-서술⑥":"<p>지배회사 AtoZ(주)는 바이오 제품을 주로 국내 및 신흥국에서 생산, 판매하고 있는 생명공학회사이다. AtoZ(주)의 종속회사는 24개이며 모두 해외에 소재하고 있다. X회계법인은 20×2년도 부문감사에 대한 사전감사계획을 수립하고 있다. AtoZ(주)의 20×1년도 재무정보는 아래와 같다. 그룹재무제표는 내부거래 등을 제외한 연결기준이며 부문정보는 별도기준이다.<\/p><p style=\"text-align:right\">(단위 : 억원)<\/p><table><thead><tr><th rowspan=\"2\"><\/th><th rowspan=\"2\">그룹재무제표<\/th><th colspan=\"4\">부문정보<\/th><\/tr><tr><th>A<\/th><th>B<\/th><th>C<\/th><th>D~Z<sup>(주)<\/sup><\/th><\/tr><\/thead><tbody><tr><td colspan=\"6\">재무상태표 주요 항목(12월 31일)<\/td><\/tr><tr><td>현 금<\/td><td style=\"text-align:right\">600<\/td><td style=\"text-align:right\">270<\/td><td style=\"text-align:right\">60<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">140<\/td><\/tr><tr><td>매출채권<\/td><td style=\"text-align:right\">3,500<\/td><td style=\"text-align:right\">1,000<\/td><td style=\"text-align:right\">400<\/td><td style=\"text-align:right\">200<\/td><td style=\"text-align:right\">800<\/td><\/tr><tr><td>재고자산<\/td><td style=\"text-align:right\">2,500<\/td><td style=\"text-align:right\">800<\/td><td style=\"text-align:right\">300<\/td><td style=\"text-align:right\">150<\/td><td style=\"text-align:right\">500<\/td><\/tr><tr><td>유형자산<\/td><td style=\"text-align:right\">1,200<\/td><td style=\"text-align:right\">360<\/td><td style=\"text-align:right\">120<\/td><td style=\"text-align:right\">60<\/td><td style=\"text-align:right\">290<\/td><\/tr><tr><td>선급비용<\/td><td style=\"text-align:right\">325<\/td><td style=\"text-align:right\">150<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><tr><td>매입채무<\/td><td style=\"text-align:right\">3,400<\/td><td style=\"text-align:right\">1,020<\/td><td style=\"text-align:right\">350<\/td><td style=\"text-align:right\">170<\/td><td style=\"text-align:right\">1,200<\/td><\/tr><tr><td>미지급비용<\/td><td style=\"text-align:right\">800<\/td><td style=\"text-align:right\">300<\/td><td style=\"text-align:right\">100<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">100<\/td><\/tr><tr><td colspan=\"6\">손익계산서 주요 항목<\/td><\/tr><tr><td>매 출<\/td><td style=\"text-align:right\">48,000<\/td><td style=\"text-align:right\">14,000<\/td><td style=\"text-align:right\">5,000<\/td><td style=\"text-align:right\">2,400<\/td><td style=\"text-align:right\">16,000<\/td><\/tr><tr><td>매출원가<\/td><td style=\"text-align:right\">32,000<\/td><td style=\"text-align:right\">9,600<\/td><td style=\"text-align:right\">3,000<\/td><td style=\"text-align:right\">1,600<\/td><td style=\"text-align:right\">8,000<\/td><\/tr><tr><td>판매관리비<\/td><td style=\"text-align:right\">6,000<\/td><td style=\"text-align:right\">1,800<\/td><td style=\"text-align:right\">230<\/td><td style=\"text-align:right\">180<\/td><td style=\"text-align:right\">1,500<\/td><\/tr><tr><td>세전순이익<\/td><td style=\"text-align:right\">10,000<\/td><td style=\"text-align:right\">3,000<\/td><td style=\"text-align:right\">800<\/td><td style=\"text-align:right\">1,160<\/td><td style=\"text-align:right\">3,000<\/td><\/tr><\/tbody><\/table><p>(주) D~Z는 부문 D부터 부문 Z까지 21개 부문의 단순합산이다.<\/p><p>다음은 회계감사기준에 근거한 X회계법인의 내부감사매뉴얼의 일부이다.<\/p><div class=\"box\"><p style=\"text-align:center\">내부감사매뉴얼<\/p>1. 유의한 부문의 식별<br>그룹재무제표 벤치마크(예, 그룹세전순이익, 그룹영업이익 등) 기준으로 15%를 초과하는 부문은 재무적 유의성을 가지므로 명백한 반증이 없는 한 재무적으로 유의한 부문으로 식별한다.<br>(사례)<br>• 그룹재무제표 벤치마크 : 그룹세전순이익<br>• 그룹세전순이익 : 1,000억원<br>• 부문 X의 세전순이익 : 160억원(그룹세전순이익의 16%)<br>• 그룹재무제표 벤치마크의 15%를 초과하므로 부문 X를 재무적으로 유의한 부문으로 식별<br>2. 유의적이지 않은 부문의 감사절차<br>유의한 부문이 아니어도 해당 부문에 그룹재무제표의 수행중요성을 초과하는 계정이 있다면 해당 계정에 대하여는 적절한 감사절차를 수행해야 한다.<\/div><p>김 회계사는 20×2년 AtoZ(주)의 그룹 및 종속회사의 부문재무제표가 20×1년과 크게 다르지 않을 것이라고 예상하였다. 이에 따라 김 회계사는 내부감사매뉴얼에 근거하여 20×2년도 그룹재무제표 수준의 중요성기준(planned materiality)을 500억원(20×1년 세전순이익의 5%)으로, 수행중요성(performance materiality)을 250억원으로 설정하였다. 김 회계사는 해외부문이 모두 감사인의 신뢰도가 낮은 신흥국에 위치하고 있으므로 그룹감사 목적으로 그룹감사인의 관여 정도를 강화할 예정이다.<\/p>","16-서술⑦":"<p>다음 각 사례는 서로 독립적이다.<\/p><p>(1) X회계법인은 전기부터 A(주)의 재무제표를 감사하고 있으며, A(주)는 전기부터 건물과 기계장치를 감가상각하지 않고 있다. X회계법인은 전기재무제표에 대해 적정의견을 표명하였다. 회계기준에 따라 감가상각한다면 20×1회계연도와 20×2회계연도의 당기순이익은 각각 6억원이 감소되어야 한다.<br>(2) A(주)는 당기에 취득한 시장성 있는 유가증권을 공정가치가 아닌 취득원가로 평가하였다. 경영진이 해당 유가증권을 공정가치로 평가한다면, 금융자산은 12억원이 감소되어야 한다. 경쟁기업인 B(주)는 특허권 침해로 A(주)에 소송을 제기하였다. 소송 결과는 예측할 수 없으며, 패소한다면 A(주)의 기업경영에 중대한 영향을 미치는 매우 이례적인 사건이 될 수 있다. A(주)는 해당 소송사건을 재무제표 주석으로 적절하게 기술하고 있다.<br>(3) X회계법인은 A(주)가 지분법을 적용하고 있는 조인트벤처 투자지분의 재무정보에 대하여 충분하고 적합한 감사증거를 입수할 수 없었다. A(주)가 조인트벤처에 투자한 지분금액은 A(주) 순자산의 20%(A(주)의 순자산 : 500억원)에 해당한다.<br>(4) A(주)의 당기말 재무상태표에는 재고자산 100억원이 계상되어 있다. 경영진은 재고자산을 취득원가와 순실현가능가치 중 낮은 금액으로 표시하지 않고, 취득원가로 평가하였다. 경영진이 취득원가와 순실현가능가치 중 낮은 금액으로 재고자산을 평가한다면, 기말재고자산은 35억원만큼 평가손실을 인식해 순실현가능가치로 보고해야 한다.<br>(5) X회계법인은 당기부터 A(주)를 감사하고 있다. 전기재무제표는 Y회계법인이 감사하였으며 전기감사의견은 적정의견이었다. X회계법인은 Y회계법인에 전기감사조서의 열람을 신청하였으나 거절당했다. X회계법인은 기초잔액에 대하여 대체적 감사절차를 수행하였으며, 기초재고자산 4억원이 과대계상된 것으로 확인하였다.<\/p>","16-서술⑧":"<p>감사인은 경영진이 작성한 재무제표에 대해 감사절차를 수행하고, 중요성 관점에서 해당 재무보고체계에 따라 공정하게 표시되었는지에 관한 의견을 형성하여 정보이용자에게 전달한다.<\/p>","16-사례":"<p>다음은 서로 독립적인 사례이다.<\/p><p>〈사례 1〉<br>기업은 당해연도에 처음으로 감사를 받게 되어 회계연도 개시일로부터 1개월 후 현 감사인과 감사계약을 체결하였다. 감사인은 감사계약을 체결한 후 재고조사를 즉시 실시하여 기초 재고자산에 대한 충분하고 적합한 증거를 확보하였으나 담당공인회계사의 실수로 금액적으로 중요한 기초 현금에 대한 충분하고 적합한 감사증거를 입수하지 못하였다. 기중의 현금거래에 대해서는 충분하고 적합한 증거를 확보하였다. 소규모 기업인 점을 감안하여 내부통제의 평가를 생략하고 적절한 계획에 따라 실증절차를 수행하였다. 감사결과에 따르면 상기 이외의 중요한 예외사항은 발견되지 않았다.<\/p><p>〈사례 2〉<br>갑(주)의 감사를 수행하고 있는 ABC회계법인은 갑(주)의 매출 3,000억원(기말 현재 매출채권잔액은 500억원) 전액이 갑(주)의 100% 출자기업인 을(주)에 대한 매출인 것을 확인했다. ABC회계법인은 채권 · 채무조회서를 발송하여 감사현장 철수일 이전에 회신받았고, 회계감사기준에서 정한 적절한 절차를 수행하였다. 감사인은 갑(주)의 매출액은 적절하지만 매출채권은 을(주)의 재무상태로 볼 때 회수가능성이 전혀 없다고 판단한다. 을(주)의 재무상태는 수년 전부터 좋지 않았지만 특히 당해연도에 더욱 악화되었다. 갑(주)는 전년도에도 유사한 상황이었지만 당해연도에 채권을 회수하고 새로운 매출을 하는 등 활동적인 거래가 있어 현재의 매출채권도 내년에 회수할 수 있을 것이라고 기대하고 있다. 이러한 이유로 재무제표에 기재된 것처럼 매출채권에 대한 대손충당금을 설정하지 않는 것이 바람직하다고 결론내렸다. 갑(주)는 을(주)와의 거래 및 기말 현재 채권잔액의 내용을 주석에 기재하였다. 감사인은 갑(주)의 당해연도 매출채권 잔액이 왜곡되면 재무제표 전체를 왜곡시킬 만큼 특히 중요한 사항이라고 판단하고 있다.<\/p><p>〈사례 3〉<br>갑(주)는 컴퓨터를 생산 · 판매하며, 결산일은 20×4년 12월 31일이다. 갑(주)는 기말 현재 3년 전에 생산했으나, 판매하지 못하고 보유중인 재고자산 500억원(총재고자산은 3,000억원)을 재무제표에 보고했다. ABC회계법인은 이들 재고가 정상적인 가격에 판매되는 것이 불가능하다고 판단하지만, 기업은 적절한 구매처만 만나면 정상적인 가격에 판매할 수 있다고 주장하고 있다. ABC회계법인의 담당공인회계사가 시장조사를 한 결과 비교가능한 제품의 현재 시장거래 가격은 220억원으로 추정되며, 여러 경로로 확인할 수 있었다. 기말감사를 수행하던 중 ABC회계법인은 진부화된 재고자산 중 50억원을 갑(주)의 100% 출자기업인 을(주)에 재무제표일 이후 55억원에 외상으로 판매했다는 것을 알게 되었다. 나머지 진부화된 재고자산을 2개월 이내에 을(주)에 520억원에 판매하기로 계약한 사실도 알게 되었다. 을(주)는 폐기물처리업체이며 당해 거래 당시 자본이 잠식된 상태로 당좌거래가 정지된 상황이다. 갑(주)는 현재 감사받고 있는 재무제표를 수정할 의사가 전혀 없다. 감사인은 당기순이익에 미치는 영향이 200억원 이상이면 중요하다고 판단하고, 중요성기준의 2배를 초과하는 예외사항은 특히 중요하다고 판단한다.<\/p><p>〈사례 4〉<br>갑(주)는 건설업을 영위하며, 결산일은 20×4년 12월 31일이다. 갑(주)에 대한 감사를 처음으로 수행하는 ABC회계법인의 담당공인회계사는 기말 실증절차를 수행하는 과정에서 북유럽 건설현장의 재고자산 및 장비 등에 대한 실사를 수행해야 하는 것을 인지하지 못하고 누락하였다. 이를 제외한 모든 감사절차는 회계감사기준에 따라 수행했다. 주주총회일이 임박한 상황에서 북유럽의 화산폭발로 유럽행 비행기가 모두 결항되어 향후 1개월 이내에 비행편을 구할 수 없다. 주주총회 일정을 더 이상 연기하는 것도 불가능하다. 북유럽 건설현장의 재고자산 및 장비 등이 갑(주)의 재무제표에서 차지하는 비중은 자산총계의 30%로서 업무담당 공인회계사는 이들 사항이 왜곡되었을 경우 재무제표 전체를 왜곡시킬 만큼 특히 중요하며 실사 이외의 방법으로는 충분하고 적합한 감사증거를 확보할 수 없다고 판단하고 있다. 업무담당 공인회계사는 갑(주)의 경영진과 의견을 조율하는 과정에서 충분하고 적합한 증거를 확보하지 못했기 때문에 적정의견 이외의 감사의견을 표명할 것이라고 주장하고 있다. 기업의 경영진은 이는 전적으로 감사인의 잘못된 판단 때문에 발생한 문제이므로 감사인은 적정의견을 표명해야 한다고 주장하고 있다. 실제로 직전연도의 감사인은 적절한 시기에 모든 해외 건설현장에 대한 실사를 수행하였으며, 북유럽의 건설현장은 20×4년 중에 새롭게 시작한 현장이다. 업무담당 공인회계사가 회계법인 내부에서 이 문제를 논의했는데, 감사보고서를 발행하지 않으면 회계법인의 예상 피해액이 워낙 막대하여 감사보고서를 발행하기로 했다. 갑(주)도 여러 가지 상황을 고려할 때 ABC회계법인으로부터 감사보고서를 제출받을 수밖에 없는 상황이다.<\/p><p>〈사례 5〉<br>갑(주)는 사무용 의자를 제조 · 판매하고 있으며, 결산일은 20×4년 12월 31일이다. 갑(주)에 대한 감사를 계속해 수행하는 ABC회계법인의 담당공인회계사는 연결재무제표 감사를 수행하고 적절한 감사의견을 표명하고자 한다. 연결 대상 종속기업 중 유럽 현지법인인 유레카 Ltd.의 재무제표감사는 현지 감사인이 수행했으며, 감사의견은 적정의견이었다. 담당공인회계사는 현지 감사인이 현지 지역에 국한된 소규모 회계법인이며, 개업 이후 첫 감사 거래처가 유레카 Ltd.인 것을 알게 되었다. 유레카 Ltd.가 연결재무제표에서 차지하는 비중은 자산총계와 매출액 기준 모두 15%를 초과한다. ABC회계법인은 연결재무제표 감사를 위해 현지에 공인회계사들을 직접 파견하여 다음과 같은 정보를 얻을 수 있었다.<\/p><div class=\"box\">유레카 Ltd.의 재무제표는 현지 회계기준에 따르면 공정하지만, 갑(주)와 다른 종속기업이 적용하고 있는 회계기준에 따르면 자산 중 20%가 과대계상되었다. 이러한 자산의 과대계상이 유레카 Ltd.의 재무제표에서 차지하는 비중은 중요하지만 갑(주)의 연결재무제표에 미치는 영향은 중요하지 않다.<\/div><p>갑(주)의 경영진은 유레카 Ltd.에서 발생한 오류를 수정반영하지 않겠다는 입장이다. 지배기업과 유레카 Ltd.를 제외한 모든 종속기업의 재무제표는 ABC회계법인이 감사하였으며 감사의견은 적정의견이었다.<\/p>"},"questions":[{"id":"TB6-TF01","ch":6,"k":"ox","tb":"6장 진위 (1)","tg":"6-진위","q":"비상장법인은 연속하는 매 3개 연도의 감사인을 동일감사인으로 하여 최초 사업연도 개시일로부터 4개월 이내에 감사인선임위원회의 승인을 받아 감사인을 선임해야 한다.","a":false,"ex":"비상장법인 중 대형비상장법인과 금융회사를 제외한 회사는 매 사업연도에 감사 또는 감사위원회가 매 사업연도 개시일로부터 45일 이내에 감사인을 선임한다.","src":"IMG_7610.JPG · p.250","cx":"6-진위","asrc":"IMG_7634.JPG · 해답 p.46"},{"id":"TB6-TF02","ch":6,"k":"ox","tb":"6장 진위 (2)","tg":"6-진위","q":"상장법인과 비상장법인의 감사에 참여하는 감사인은 감사보조자를 3개 사업연도마다 교체해야 한다.","a":false,"ex":"상장법인만 감사보조자를 주기적으로 교체할 의무가 있다.","src":"IMG_7610.JPG · p.250","cx":"6-진위","asrc":"I 에서 전문직업인으로서의 높은 명성을 유지하려고 한다. 감사품질관리기준을 강화하면 성실성이 결여된 경영진과의 연루관계를 차단할 수 있다.\n회계법인마다 유지하고자 하는 감사품질관리기준의 성격과 범위가 다르므로, 새로운 고객의 수임기준도 매우 다양할 것이다. 높은 감사의 품질을 지향하는 회계법인은 경영진의 성실성에 의심이 가는 기업의 감사수임을 거부할 것이다. 단기적으로는 감사보수의 저하를 가져올 수 있으나, 장기적으로는 감사인 명성이 높아지므로 우수한 고객을 많이 확보할 수 있다.\n고객확보에 많은 관심을 갖는 회계법인은 사례에서처럼 경쟁자도 없이 보수도 양호하며 미래에도 계속감사의 가능성이 높은 고객을 선호할 것이다.\n최대풍 씨와의 감사계약체결 전에 유의하여 판단할 사항은\n① 당시에는 법률적으로 적합 혹은 부적합할 수도 있었던 이전 행위를 현재의 판단기준으로 과거 행위를 평가하지 않도록 주의한다.\n② 12년 전에 발생했던 사실의 시간적 경과에 유의한다(최대풍 씨의 최근 경영행위는 모범적이며 자선사업에 열심이고 기업 평판도 좋음).\n최대풍 씨의 개인소유인 건강식품회사와 부동산개발회사에 대한 그의 재량적 권한이 과거보다 대폭 확대되었으며, 이전의 행위가 반복되지 않는다고 확신할 수 없다. 일반적으로 경영진에 대한 신뢰성이 낮으면 정당하고 독립적인 감사를 수행하기 어렵고 부정발견에 대한 감사인의 책임과 관련하여 소송에 연루될 가능성이 높다. 감사수임이 이루어지더라도 특별한 관리가 필요한 경영진의 부정위험에 유의하며 감사를 실시해야 한다.","pts":[],"ex":"","src":"IMG_7616.JPG · p.256 ~ IMG_7617.JPG · p.257","asrc":"IMG_7640.JPG · 해답 p.52 ~ IMG_7641.JPG · p.53"},{"id":"TB6-C1-2","ch":6,"k":"essay","tb":"6장 사례연구 2","tg":"6-사례","cx":"6-사례","q":"대륙회계법인은 최대풍 씨와 감사계약을 체결하는 것이 바람직한가?","model":"새로운 고객과 감사계약을 체결하지 않는 것이 바람직하다. 최대풍 씨의 현재 경영방식 및 성실성을 정확히 판단할 수 없으므로, 감사인의 추후 법적 소송 연루가능성을 미리 예측하는 것은 불가능하다. 다만 일반고객과 다른 점은 과거에 부정에 연루된 경력이 있고, 이러한 사실이 없었던 고객과 비교할 때 과거 잘못을 상쇄시켜 줄 수 있는 긍정적인 내용을 확인할 수 있어야 한다.\n최대풍 씨는 ① 적극적인 사회사업 수행, ② 거래은행 및 경제연구소 보고서의 좋은 평판, ③ 부정을 적발한 과거의 회계법인에 감사를 의뢰하고 있다는 점에서 긍정적이다. 다만, 이러한 긍정적 측면이 과거의 부정연루 경력을 상쇄시킬 수 있을지는 감사를 수임하려는 감사인의 위험성향이나 위험태도에 따라 달라질 것이다.","pts":[],"ex":"","src":"IMG_7616.JPG · p.256 ~ IMG_7617.JPG · p.257","asrc":"IMG_7641.JPG · 해답 p.53"},{"id":"TB7-TF01","ch":7,"k":"ox","tb":"7장 진위 (1)","tg":"7-진위","q":"내부통제가 설계, 실행 및 유지되는 방식은 기업규모와 복잡성에 따라 다양하다.","a":true,"ex":"","src":"IMG_7618.JPG · p.306","cx":"7-진위","asrc":"IMG_7642.JPG · 해답 p.57"},{"id":"TB7-TF02","ch":7,"k":"ox","tb":"7장 진위 (2)","tg":"7-진위","q":"대부분의 내부통제는 일상적인 거래를 대상으로 하므로 비경상적인 거래가 발생하면 효과적으로 작동하지 않을 수 있다.","a":true,"ex":"","src":"IMG_7618.JPG · p.306","cx":"7-진위","asrc":"IMG_7642.JPG · 해답 p.57"},{"id":"TB7-TF03","ch":7,"k":"ox","tb":"7장 진위 (3)","tg":"7-진위","q":"자산보관담당  파악하고 주문을 승인한다.<\/td><\/tr><tr><td>출고지시서 · 출고물량을 대조<\/td><td>거래처 주문서와 제품이 다르거나 물량차이가 발생하여 거래처와 분쟁이 발생할 위험이 있다.<\/td><td>③<\/td><\/tr><tr><td>(예시) 현금결제<\/td><td>(예시) 매출채권을 영업사원이 직접 수령하여 회수대금이 횡령될 위험이 있다.<\/td><td>(예시) 매출채권은 반드시 기업통장으로 온라인 송금으로 회수한다.<\/td><\/tr><\/tbody><\/table>(예시)를 참조하여 해당번호에 기재해야 할 내용을 서술하시오.","model":"① 거래처의 신용한도 설정 및 변경은 영업담당자가 품의하여 대표이사 승인을 받아야 한다.\n② 승인받지 않은 주문서는 부당한 매출을 발생하게 할 위험이 있다.\n③ 출고담당자는 출고물량과 출고지시서를 대조하고 출고가 출고지시서에 따라 이루어지는지 확인한다.","pts":[],"ex":"","src":"IMG_7630.JPG · p.410","cx":"9-서술⑦","asrc":"IMG_7655.JPG · 해답 p.75"},{"id":"TB9-E7-2","ch":9,"k":"essay","tb":"9장 서술⑦ 2","tg":"9-서술⑦","q":"다음은 기업이 매출과 대금회수활동과 관련하여 설정한 통제활동이다.<br>〈통제활동〉<div class=\"box\">① 대금청구 누락을 방지하기 위해 매출송장부본을 개별 적송서류에 합철하고 있다.<br>② 대금청구담당자는 모든 적송서류의 부본을 일련번호대로 보관한다. 독립적인 제삼자는 정기적으로 매출분개장의 회계처리가 적절한지 일련번호순으로 확인하며, 누락된 문서가 있다면 이유를 조사한다.<br>③ 현금 취급이나 매출채권장부 유지책임이 없는 부서에서 월별명세서를 작성하여 고객에게 통지하고 회신을 받아 고객 회신철을 작성한다.<\/div>상기의 각각의 통제활동에 대해 감사인이 수행해야 할 통제테스트를 서술하시오.","model":"① 적송서류의 연속성을 확인한 후 관련 매출송장부본이 부착되어 있는지 확인한다.\n② 매출분개장에서 매출송장번호(또는 거래)를 추출하여 대금청구과정에서 누락되거나 이중처리된 숫자 또는 일련번호 순서를 이탈한 송장이 있는지 확인한다.\n③ 독립적인 사람이 월별명세서 통지를 관리하는지 관찰하고 고객 회신철을 검토하여 월별명세서가 고객에게 적절히 고지되는지 확인한다.","pts":[],"ex":"","src":"IMG_7631.JPG · p.411","cx":"9-서술⑦","asrc":"IMG_7655.JPG · 해답 p.75"},{"id":"TB9-E7-3","ch":9,"k":"essay","tb":"9장 서술⑦ 3","tg":"9-서술⑦","q":"감사인은 왜곡표시위험이 높다고 평가하여 외부조회를 실시하였다. 다음은 감사인이 수행한 외부조회절차이다.<br>〈감사인이 수행한 외부조회절차〉<div class=\"box\">① 기업 창고가 아닌 제삼의 장소에 보관된 재고자산에 대해 외부조회를 실시하였다. 타처보관 재고자산의 비중은 전체 재고자산에서 90%를 차지하고 있다.<br>② 매입채무의 완전성 주장을 확인하기 위해 감사인은 매입채무보조부에서 잔액이 큰 매입처를 중심으로 조회서를 발송하였다.<br>③ 특수관계자와의 거래가 매우 빈번하고 거액이므로 외부조회를 수행하여 잔액을 확인하였다.<\/div>(1) ①에서 수행한 외부조회절차를 통해서도 확인할 수 없는 경영진주장은 무엇인가? 확인하지 못한 경영진주장에 대해 감사인이 추가로 수행해야 할 절차를 기술하시오.<br>(2) ②에서 감사인이 수행한 외부조회절차는 적절한지를 판단하시오. 만약 적절하지 않다면 매입채무 완전성 주장을 확인하기 위해 감사인이 수행해야 할 외부조회절차를 서술하시오.<br>(3) ③에서 수행한 외부조회절차에 추가하여 신뢰성 있는 감사증거를 수집하기 위해 감사인이 수행해야 할 절차를 서술하시오.","model":"① 타처보관 재고자산에 대한 외부조회로는 재고자산의 평가(진부화 정도)에 관한 주장을 확인할 수 없다. 타처보관 재고자산의 금액이 중요하므로 외부조회보다는 기업과 협의하여 직접 실시입회해야 한다.\n② 적절하지 않다. 기중거래가 빈번하였다면 기말에도 큰 잔액이 있을 것이므로, 잔액이 없더라도 기중에 거래가 빈번했던 주요 거래처를 대상으로 조회서를 발송해야 한다.\n③ 특수관계자에 대한 조회는 신뢰성이 낮다. 추가적으로 객관적인 증빙문서(예를 들어 신용장이나 선하증권)를 검사해야 한다.","pts":[],"ex":"","src":"IMG_7631.JPG · p.411","cx":"9-서술⑦","asrc":"IMG_7655.JPG · 해답 p.75"},{"id":"TB9-E7-4","ch":9,"k":"essay","tb":"9장 서술⑦ 4","tg":"9-서술⑦","q":"감사인은 보고기간말 채권, 채무 상황을 확인하기 위해 조회서를 발송하기로 하였다. 매출채권명세서에 기재된 거래처에서 조회처 100곳을 선정하였다. 경영진은 선정된 조회처에서 2곳에 대해 조회서의 발송을 거부하였다. 감사인은 외부조회의 발송을 거부한 이유를 질문하였는데, 외부조회를 제한하는 경영진 요청이 비합리적이라고 판단하였다. 이러한 상황에서 감사인이 수행해야 할 감사절차를 서술하시오.","model":"① 외부조회를 제한하는 경영진 요청은 심각한 부정위험요소의 징후일 수 있으므로 해당 감사목표의 중요왜곡표시위험에 대한 평가를 수정한다.\n② 조회를 거부한 2곳에 대해서는 대체적 절차를 수행하지 않고 감사범위 제한에 따른 의견변형을 고려한다.","pts":[],"ex":"","src":"IMG_7631.JPG · p.411","cx":"9-서술⑦","asrc":"IMG_7655.JPG · 해답 p.75"},{"id":"TB9-E8-1","ch":9,"k":"essay","tb":"9장 서술⑧ 1","tg":"9-서술⑧","q":"상기 대화내용[①~④] 중 감사와 관련하여 가장 적절하지 않은 문장 두 가지를 지적하고, 추가적으로 수행할 감사절차를 서술하시오.","model":"<table><thead><tr><th>문장번호<\/th><th>추가적인 감사절차<\/th><\/tr><\/thead><tbody><tr><td>①<\/td><td>담당 감사팀원이 공정가치 평가보고서의 일부를 이해하는 데 어려운 부분이 있었다. 보다 경험이 많은 다른 인력을 배정하거나 적합한 자문을 받도록 해야 한다. 필요하다면 감사인측 전문가를 활용해야 한다.<\/td><\/tr><tr><td>③<\/td><td>유선통화로 입수한 감사증거는 구두증거에 해당하여 감사증거력이 낮으므로 서면확인서를 수령하여 감사조서에 포함시켜야 한다.<\/td><\/tr><\/tbody><\/table>","pts":[],"ex":"","src":"IMG_7632.JPG · p.412","cx":"9-서술⑧","asrc":"IMG_7656.JPG · 해답 p.76"},{"id":"TB9-C1-1","ch":9,"k":"essay","tb":"9장 사례연구 1","tg":"9-사례","cx":"9-사례","q":"상기의 업무기술서에 근거하여 하이킥주식회사의 매출거래와 관련된 통제활동의 취약점을 업무분장(segregation of duty) 관점에서 기술하시오.","model":"영업부서에 이해상충이 발생할 수 있는 너무 많은 권한이 집중되어 있다.\n(1) 거래집행의 승인기능과 회계장부기록기능의 분리\n동일한 부서에서 거래집행의 승인기능과 매출원장의 기록기능을 수행해서는 안 된다. 매출원장의 기록기능은 회계팀이 담당해야 한다.\n(2) 거래집행의 승인기능과 관련 자산보관기능의 분리\n영업팀장이 창고를 관리해서는 안 된다. 매출거래의 집행승인과 재고자산의 출고를 승인하는 부서(영업팀)는 재고자산을 실물 보관하며 불출을 담당하는 부서(창고팀)의 관리기능으로부터 분리해야 한다.\n(3) 영업부서에서 신용승인절차의 미분리\n신규거래처의 신용평가 및 신용한도의 설정업무는 일상 영업거래를 승인하고 집행하는 부서(영업팀)에서 분리되어야 한다. 이 업무는 채권관리부서(혹은 자금팀)에서 수행해야 한다.\n(4) 회계팀에서 자금집행기능의 분리\n장부기록을 담당하는 회계팀에서는 자금집행업무를 담당하지 않아야 한다. 운송비 지급은 자금팀에서 담당해야 한다.","pts":[],"ex":"","src":"IMG_7633.JPG · p.413","asrc":"IMG_7656.JPG · 해답 p.76"},{"id":"TB9-C1-2","ch":9,"k":"essay","tb":"9장 사례연구 2","tg":"9-사례","cx":"9-사례","q":"상기의 업무기술서에 근거하여 매출거래의 발생사실(occurrence)을 확인하기 위해 바로회계법인이 어떤 통제활동을 테스트하는 것이 가장 효과적인지 설명하시오.","model":"매출원장에서 무작위로 표본을 추출하여 고객으로부터 확인받은 인수증으로 추적·대조하면 매출기록의 발생사실(실재성)을 확인할 수 있다.","pts":[],"ex":"","src":"IMG_7633.JPG · p.413","asrc":"IMG_7656.JPG · 해답 p.76"},{"id":"TB12-TF01","ch":12,"k":"ox","tb":"12장 진위 (1)","tg":"12-진위","cx":"12-진위","q":"구매요청에 대해 적절한 사전승인절차를 유지하면 불필요한 구매나 과잉구매를 억제할 수 있다.","a":true,"ex":"","src":"IMG_7793.JPG · p.553","asrc":"IMG_7837.JPG · 해답 p.102"},{"id":"TB12-TF02","ch":12,"k":"ox","tb":"12장 진위 (2)","tg":"12-진위","cx":"12-진위","q":"구매부서에서 구매주문서를 작성해 매입처에 송부한 후 검수의 완전성을 위해 품목과 수량이 기재된 구매주문서 부본을 검수부서로 발송하였다.","a":false,"ex":"검수부서에서 검수한 실제 수량을 직접 확인하여 기록하도록 검수부서에 보내는 주문서에는 수량이 삭제되어야 한다.","src":"IMG_7793.JPG · p.553","asrc":"IMG_7837.JPG · 해답 p.102"},{"id":"TB12-TF03","ch":12,"k":"ox","tb":"12장 진위 (3)","tg":"12-진위","cx":"12-진위","q":"기업은 이중지급과 종업원 횡령을 방지하기 위해 지급요청서에 첨부된 관련 증빙원본에 지급이 완료되었다는 완불날인표시를 하고 있다.","a":true,"ex":"","src":"IMG_7793.JPG · p.553","asrc":"IMG_7837.JPG · 해답 p.102"},{"id":"TB12-TF04","ch":12,"k":"ox","tb":"12장 진위 (4)","tg":"12-진위","cx":"12-진위","q":"구매부서 담당자는 구매행위원인부서에서 수령한 구매요청서에 부서장 승인이 있는지 확인한 후 최적의 품질과 가격으로 매입하기 위해 가장 최근에 구입한 구매처에 구매주문서를 발송하였다.","a":false,"ex":"가장 최근 구입한 구매처라고 해서 시간경과 또는 가격변동으로 반드시 최적의 품질과 가격으로 매입한다는 보장이 없다.","src":"IMG_7793.JPG · p.553","asrc":"IMG_7837.JPG · 해답 p.102"},{"id":"TB12-TF05","ch":12,"k":"ox","tb":"12장 진위 (5)","tg":"12-진위","cx":"12-진위","q":"감사인은 매입채무의 거래기록 완전성을 검증하기 위해 개별 거래처별 매입채무 계정잔액이 큰 기업을 대상으로 조회확인을 요청하였다.","a":false,"ex":"매입채무의 감사절차에서 완전성목표가 중요하다. 이를 달성하기 위해서는 기중거래가 빈번하고 금액이 컸던 거래처를 대상으로 조회확인을 요청해야 한다. 조회는 매입채무 잔액이 0원인 주요 거래처에 대해서는 반드시 조회대상에 포함해야 한다.","src":"IMG_7793.JPG · p.553","asrc":"IMG_7837.JPG · 해답 p.102"},{"id":"TB12-TF06","ch":12,"k":"ox","tb":"12장 진위 (6)",
