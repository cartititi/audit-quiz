c":"IMG_7793.JPG · p.553","asrc":"IMG_7838.JPG · 해답 p.103"},{"id":"TB12-E1-1","ch":12,"k":"essay","tb":"12장 서술① 1","tg":"12-서술①","cx":"12-서술①","q":"한국주식회사의 원재료 구매, 검수, 보관, 출고절차에 대한 내부통제의 취약점을 지적하고 이러한 취약점에 대해 김 회계사가 권고할 개선안을 다음의 [답안양식]에 따라 제시하시오.<br>[답안양식]<table><thead><tr><th>문항번호<\/th><th>취약점<\/th><th>개선안<\/th><\/tr><\/thead><tbody><tr><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table>","model":"<table><thead><tr><th>문항번호<\/th><th>취약점<\/th><th>개선안<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:right\">(3)<\/td><td>생산담당책임자의 구두승인으로 원재료가 출고될 수 있다.<\/td><td>원재료는 서면승인으로만 출고되도록 한다.<\/td><\/tr><tr><td style=\"text-align:right\">(4)<\/td><td>계속기록법을 사용하지 않고 있다. 도난 혹은 감모손실을 별도로 확인할 수 없으며, 월말에 보유하고 있는 재고자산이 다음달 재고실사 때까지 사용할 충분한 양의 확보 혹은 재고자산에 과다한 투자와 진부화 여부를 확인할 수 있는 장치가 없다.<\/td><td>수량과 가격의 정보가 포함된 계속기록법을 채택하여 원재료수불을 담당하지 않는 사람이 장부를 유지하도록 한다. 주기적으로 총계정원장과 원재료수불장을 비교하고, 재고실사수량을 계속기록법으로 기록한 장부수량과 비교한다. 원재료의 물리적 통제도 강화해야 한다. 재고자산 실사는 창고부서 외의 독립적인 제삼자가 수행하도록 한다.<\/td><\/tr><tr><td style=\"text-align:right\">(5)<\/td><td>원재료는 미리 정해진 재주문점에서 규정된 수량만큼 구매된다. 매월 생산수준은 항상 동일하지 않기 때문에 주문량이 당월의 필요량보다 너무 많거나 적을 위험이 있다.<\/td><td>원재료 구매는 생산담당책임자만이 요청할 수 있도록 하고, 생산계획과 현재 재고수량을 근거로 요청이 이루어지도록 한다.<\/td><\/tr><tr><td style=\"text-align:right\">(6)<\/td><td>매입채무담당자가 구매업무와 외상매입의 공급자송장 처리업무를 동시에 취급한다. 업무가 적절하게 분장되지 않고 있다.<\/td><td>매입채무담당자와는 별도의 구매부서에서 구매주문서를 작성하고 통제한다. 구매주문서의 사본은 매입채무담당부서와 검수부서에 보낸다. 검수부서에 보내는 사본에는 주문수량이 기록되지 않아야 하고 검수직원이 실제 수량을 직접 기록하도록 한다.<\/td><\/tr><tr><td style=\"text-align:right\">(6)<\/td><td>원재료를 항상 최근에 구입한 동일한 구매처에서만 구입하므로 높은 가격을 지불할 가능성이 있다.<\/td><td>일정한 금액을 초과하는 구매는 입찰을 통해 구매처를 선정해야 한다.<\/td><\/tr><tr><td style=\"text-align:right\">(7)<\/td><td>독립된 검수부서와 검수보고서가 존재하지 않는다. 업무를 적절하게 분리하기 위해서 검수업무를 창고업무와 분리해야 한다.<\/td><td>별도의 검수부서에서 구매품을 검수하고 검수보고서를 작성하도록 한다.<\/td><\/tr><\/tbody><\/table>","pts":[],"ex":"","src":"IMG_7794.JPG · p.554","asrc":"IMG_7838.JPG · 해답 p.103 ~ IMG_7839.JPG · p.104"},{"id":"TB12-E2-1","ch":12,"k":"essay","tb":"12장 서술② 1","tg":"12-서술②","cx":"12-서술②","q":"다음의 (1) 구매주문서, (2) 금속판의 검수, (3) 나사못의 검수, (4) 카메라 렌즈의 검수활동과 관련하여 회사의 통제절차가 적절한지와 이유를 다음의 [답안양식]에 따라 기술하시오.<br>[답안양식]<table><thead><tr><th>문항번호<\/th><th>적절 또는 부적절한 사항<\/th><th>적절 또는 부적절한 이유<\/th><\/tr><\/thead><tbody><tr><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table>","model":"<table><thead><tr><th>문항번호<\/th><th>적절 또는 부적절한 사항<\/th><th>적절 또는 부적절한 이유<\/th><\/tr><\/thead><tbody><tr><td>(1) 구매주문서<\/td><td>검수직원에게 송부하는 구매주문서에 수량이 기입되어 있다.<\/td><td>수량을 기록하면 검수직원이 실제 수량을 측정하지 않고 기록된 수량으로 보고할 가능성이 있다. 즉 검수직원이 단지 구매주문서와 거래명세서만을 비교하여 검수보고서를 작성할 수 있다. 이러한 취약점으로 적격미달의 품질이나 부정확한 수량의 부품이 입고될 수 있다.<\/td><\/tr><tr><td>(2) 금속판의 검수<\/td><td>검수직원은 단지 구매주문서와 철도청이 발행한 화물운송증의 수량만 비교하고 수량과 품질을 확인하는 절차를 수행하지 않는다.<\/td><td>한국철도공사에서 독립적으로 계량한 기록이 화물운송증으로 제공되므로 수량 정확성의 보완적인 통제기능이 수행된다고 볼 수 있다. 여전히 품질의 검증은 이루어지지 않고 있다.<\/td><\/tr><tr><td>(3) 나사못의 검수<\/td><td>검수직원이 직접 무게를 측량하고 이를 수량으로 환산한다.<\/td><td>수량 통제는 적절하며, 검수직원의 검사과정에서 품질이 불량한 나사못을 적발할 수 있어 품질 통제도 적절하게 이루어질 수 있다.<\/td><\/tr><tr><td>(4) 카메라 렌즈의 검수<\/td><td>검수직원은 실제 렌즈를 검사하지 않고 있다.<\/td><td>적격미달의 품질 또는 부정확한 수량의 부품이 입고될 수 있다.<\/td><\/tr><\/tbody><\/table>","pts":[],"ex":"","src":"IMG_7794.JPG · p.554 ~ IMG_7795.JPG · p.555","asrc":"IMG_7839.JPG · 해답 p.104"},{"id":"TB12-E3-1","ch":12,"k":"essay","tb":"12장 서술③ 1","tg":"12-서술③","cx":"12-서술③","q":"각 감사절차에서 적용가능한 증거입수방법을 밝히시오.","model":"<table><thead><tr><th>감사절차<\/th><th>증거수집방법<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:right\">(1)<\/td><td>문서검사<\/td><\/tr><tr><td style=\"text-align:right\">(2)<\/td><td>문서검사, 분석적절차<\/td><\/tr><tr><td style=\"text-align:right\">(3)<\/td><td>문서검사, 계산검증<\/td><\/tr><tr><td style=\"text-align:right\">(4)<\/td><td>문서검사, 계산검증<\/td><\/tr><tr><td style=\"text-align:right\">(5)<\/td><td>질문<\/td><\/tr><tr><td style=\"text-align:right\">(6)<\/td><td>문서검사<\/td><\/tr><tr><td style=\"text-align:right\">(7)<\/td><td>외부조회<\/td><\/tr><tr><td style=\"text-align:right\">(8)<\/td><td>문서검사, 계산검증<\/td><\/tr><\/tbody><\/table>","pts":[],"ex":"","src":"IM 으로는 감사절차를 생략할 수 없다. 대체적인 감사절차를 수행하여 재고자산의 실재성에 대한 충분하고 적합한 감사증거를 수집해야 한다. 예를 들어 취득한 재고자산 입고관련 및 매출관련 증빙서류를 조사하여 재고자산의 수량을 확인하는 대체적인 감사절차를 수행해야 한다.","src":"IMG_7800.JPG · p.584","asrc":"IMG_7843.JPG · 해답 p.108"},{"id":"TB13-TF08","ch":13,"k":"ox","tb":"13장 진위 (8)","tg":"13-진위","cx":"13-진위","q":"감사인은 외부에 보관된 재고자산이 재무제표에서 차지하는 비중이 중요하다고 판단했다. 조회확인을 할 때 조회서에 진부화된 재고자산의 존재여부를 확인하는 요청문구를 추가하고, 재고자산이 실제 입고된 일자를 기재하도록 요청하였다.","a":true,"ex":"","src":"IMG_7800.JPG · p.584","asrc":"IMG_7843.JPG · 해답 p.108"},{"id":"TB13-TF09","ch":13,"k":"ox","tb":"13장 진위 (9)","tg":"13-진위","cx":"13-진위","q":"감사인은 기업의 재고자산 저가평가가 정당했는지 확인하기 위해 보고기간말 이후에 판매된 품목의 실제 판매가격을 이용해 공정가치를 추정하였다.","a":true,"ex":"","src":"IMG_7800.JPG · p.584","asrc":"IMG_7843.JPG · 해답 p.108"},{"id":"TB13-TF10","ch":13,"k":"ox","tb":"13장 진위 (10)","tg":"13-진위","cx":"13-진위","q":"기업의 재고자산이 여러 곳에 분산되어 보관되어 있고, 감사인은 일정상 한 곳만 실사입회가 가능한 상황이다. 이에 감사인은 기업과 실사입회할 장소를 사전에 협의하고자 한다.","a":false,"ex":"감사인의 일정상 한 곳에 대해서만 실사입회가 가능하다면 기업과 사전에 협의하지 않고 불시에 실사입회해야 한다. 기업에 사전통보하면 재고자산 수량을 재고자산목록에 맞춰 준비할 수 있다.","src":"IMG_7800.JPG · p.584","asrc":"IMG_7843.JPG · 해답 p.108"},{"id":"TB13-E1-1","ch":13,"k":"essay","tb":"13장 서술① 1","tg":"13-서술①","cx":"13-서술①","q":"이러한 판단을 한 근거를 제시하시오.","model":"판단의 근거자료는 다음과 같다.\n(1) 회사는 두 개의 사업부문을 운영하고 있는데, 직접노무비와 제조간접비의 비중은 1 : 3이다. A-type은 자동화이고, B-type은 수작업이므로 A-type에 더 많은 제조간접비를 배부해야 한다. 제조간접비를 직접노무비를 기준으로 배부하면 중요한 제조간접비금액이 자동화된 A-type에는 적게 배분되는 원가왜곡현상이 발생한다.\n(2) 20×1년말 B-type제품 사업부를 폐쇄하였는데, 감가상각비는 회피불능원가에 해당하므로 A-type에 전액 배부되어야 한다. 매출액이 일정하다고 가정할 때 원가가 상승하므로 A-type의 매출총이익률은 하락해야 한다. 매출총이익률이 증가하고 있으므로 매출원가의 과소계상을 의심할 수 있다.","pts":[],"ex":"","src":"IMG_7801.JPG · p.585","asrc":"IMG_7844.JPG · 해답 p.109"},{"id":"TB13-E1-2","ch":13,"k":"essay","tb":"13장 서술① 2","tg":"13-서술①","cx":"13-서술①","q":"상대적으로 왜곡표시위험이 높을 것으로 예상하는 항목을 지적하시오.","model":"다음의 항목에서 왜곡표시위험이 높을 것으로 예상할 수 있다.\n(1) 상대적으로 비중이 큰 제조간접비의 잘못된 배부(B-type제품 사업부로 과대배부)로 원가의 왜곡현상(실제로는 B-type제품 사업부의 매출총이익률이 더 높음)이 발생하였다. 이를 근거로 경영진이 의사결정을 잘못해 회사 전체의 매출총이익률이 오히려 하락했다. 그런데도 회사가 제시한 매출총이익률은 오히려 증가하는 양상을 보이고 있다.\n(2) 매출액은 일정한데 매출총이익률이 증가하므로 매출원가가 과소계상되었을 가능성이 높다. 예를 들어 감가상각비 등 제조간접원가가 과소계상될 수 있다.","pts":[],"ex":"","src":"IMG_7801.JPG · p.585","asrc":"IMG_7844.JPG · 해답 p.109"},{"id":"TB13-E2-1","ch":13,"k":"essay","tb":"13장 서술② 1","tg":"13-서술②","cx":"13-서술②","q":"위에 언급된 재고실사입회절차를 합리적인 진행순서대로 나열하시오.<br>( ③ ) → (　) → (　) → (　) → (　) → ( ⑥ )","model":"③ → ④ → ① → ⑤ → ② → ⑥","pts":[],"ex":"","src":"IMG_7802.JPG · p.586","asrc":"IMG_7844.JPG · 해답 p.109"},{"id":"TB13-E2-2","ch":13,"k":"essay","tb":"13장 서술② 2","tg":"13-서술②","cx":"13-서술②","q":"재고실사입회와 관련한 다음의 사항에 대하여 답하시오.<br>(1) 재고조사표의 통제방법<br>(2) 실사지침을 수령하고 검토하는 이유<br>(3) 실사입회할 현장을 사전답사하는 이유","model":"(1) 재고실사표의 일련번호 기재여부, 총인쇄부수와 사용된 수량, 폐기된 수량, 남은 수량의 조정, 폐기된 실사표 번호관리의 방법으로 재고실사표를 통제한다.\n(2) 회사 규정에 따라 재고실사가 계획되고 승인되었는지 파악하여 실사입회 범위를 결정할 목적으로 실사지침을 검토한다.\n(3) 현장의 모든 재고에 재고실사표 부착여부, 현장의 정돈상태, 재고의 보관위치 파악 등 효율적인 재고실사입회를 수행할 목적으로 현장을 사전답사한다.","pts":[],"ex":"","src":"IMG_7802.JPG · p.586","asrc":"IMG_7844.JPG · 해답 p.109 ~ IMG_7845.JPG · p.110"},{"id":"TB13-E2-3","ch":13,"k":"essay","tb":"13장 서술② 3","tg":"13-서술②","cx":"13-서술②","q":"박신중 회계사는 현장답사 중 재고조사표는 부착되어 있으나 다른 재고자산과 별도로 보관되어 있는 재고자산을 발견하고, 회사담당자에게 질문하였다. 회사담당자는 해당 재고자산이 오늘중(재고실사입회종료 전)으로 출고될 재고자산이라 별도로 보관하고 있다고 답변하였다. 박신중 회계사가 추가로 요구하여 검토해 보아야 할 서류(문서)는 무엇인가? 재고자산과 관련하여 계정잔액의 세부테스트를 추가로 실시해야 할 필수적인 감사절차를 기술하시오.","model":"(1) 선하증권, 적송서류 혹은 출고증 등 현장 철수 전에 출고가 이루어졌다는 사실을 증빙하는 관련서류를 검토한다.\n(2) 기말재고종합표(최종목록)에서 해당 수량을 실제로 차감하였는지 검증해야 한다.","pts":[],"ex":"","src":"IMG_7802.JPG · p.586","asrc":"IMG_7845.JPG · 해답 p.110"},{"id":"TB13-E3-1","ch":13,"k":"essay","tb":"13장 서술③ 1","tg":"13-서술③","cx":"13-서술③","q":"재고실사에 포함되어야 할 모든 항목이 조사되고 같은 항목이 중복 계산되지 않도록 하기 위해 월출회사가 수립해야 하는 재고자산의 실사절차를 단계별로 설명하시오.","model":"(1) 재고수량조사를 실시하기 전에 모든 물품은 검수장소에서 적절한 장소로 이동, 보관되어야 한다.\n(2) 이중계산을 방지하기 위하여 창고에 입고되는 부품과 소모품은 검수장소에 보관하며, 실사가 끝나기 전까지는 재고자산수량에 포함시키지 않는다.\n(3) 가능하다면 그날의 완성품은 계수가 시작되기 전에 창고로 옮긴다.\n(4) 창고 내부에서 이동된 품목들은 특별한 주의를 기울여야 한다. 부품과 소모품의 갑작스런 출고요청이나 예정에 없던 완성품의 출고가 이에 해당한다. 이러한 이동을 통제 · 기록하는 방법은 다음과 같다.\n① 이동하는 물품 목록을 확인하고 이미 계수한 것인지 확인한다.\n② 재고자산에 포함된 품목에 한해 재고조사표(inventory tag)에 이동사실을 기록한다.\n③ 원재료요청서나 선적지시서에 해당 품목이 재고자산에 포함되었다는 사실을 표시한다. 이 중 어떤 방법을 적용하든 창고직원이나 재고자산기록담당자는 계수기록을 수정해야 한다.\n(5) 창고에 보관하고 있는 당일 생산의 완제품 등은 계수가 끝난 다음에 재고자산에 포함시킨다.\n(6) 창고에서 기입하는 모든 서류의 날짜는 물품을 수령하거나 출고한 날짜를 기준으로 한다.\n(7) 재고자산담당자는 12월 31일 생산분과 출고분의 날짜를 기록할 때 공장생산보고서와 선적보고서의 날짜를 확인하여 이를 기준으로 기록해야 한다. 이렇게 기록해야 적절한 기간귀속이 이루어진다.\n(8) 재고수량 차이는 장부에 수정분개를 하기 전에 재무담당임원과 창고책임자가 검토해야 한다. 비정상적 차이가 발생하면 이유를 조사하며, 정상적인 차이에 대해서는 다시 계수한다.","pts":[],"ex":"","src":"IMG_7802.JPG · p.586 ~ IMG_7803.JPG · p.587","asrc":"IMG_7845.JPG · 해답 p.110"},{"id":"TB13-E4-1","ch":13,"k":"essay","tb":"13장 서술④ 1","tg":"13-서술④","cx":"13-서술④","q":"나선명 회계사는 회사의 경영진으로부터 “회사는 20×3년중 불량품을 해체하여 고가의 반도체칩을 분리 회수해 제조공정에 원재료로 재활용하여 약 200억원 정도의 원가절감 효과를 보았다”는 설명을 들었다. 이러한 경영진진술의 적절성을 확인하기 위하여 나선명 회계사가 취해야 할 감사절차 세 가지를 기술하시오.","model":"당기순이익 150억원에 비하여 반도체칩의 수율향상(원재료 재활용)에 따른 원가절감액이 200억원이라는 주장은 감사계획 수립에서 매우 중요한 의미를 가진다. 원재료에 대한 감사절차를 다음과 같이 확대한다.\n(1) 원재료 구매주문서, 원재료 검수보고서 및 원재료수불부를 검토해 실제투입수량을 확인해 불량품이 설명대로 재활용되었는지 수량 검증한다.\n(2) 제조원가계산과정에서 원재료 계산검증을 위해 공손품계정이 원재료비계정으로 적절하게 대체되었는지 검증한다.\n(3) 공손품관련 타계정대체액이 원재료에 포함되었는지와 제조원가 총액에 포함되었는지 검증한다.","pts":[],"ex":"","src":"IMG_7803.JPG · p.587 ~ IMG_7804.JPG · p.588","asrc":"IMG_7846.JPG · 해답 p.111"},{"id":"TB13-E4-2","ch":13,"k":"essay","tb":"13장 서술④ 2","tg":"13-서술④","cx":"13-서술④","q":"나선명 회계사가 1에서 수행한 감사절차에서 만족스러운 증거를 수집하지 못했다. 재무제표의 왜곡표시가능성과 관련하여 제조원가 및 재고자산에 대하여 전체적인 관점에서 추가로 확인해야 할 감사절차를 기술하시오(재고자산에 대한 실사입회는 제외).","model":"(1) 제품제조원가명세서를 구하여 계산검증하고 완제품 제조공정 및 부품구성도를 조사한다. 이를 근거로 1단위 생산에 필요한 원재료 수량결정방법(수율을 감안하여)을 추정한 후 실제투입(재활용을 고려)된 수량과 비교한다.\n(2) 기말재고자산계정(원재료평가액 및 재공품평가액 포함)이 과대계상되었을 가능성에 전문가적 의구심을 갖고, 원재료 가격결정(pricing)절차 및 계산검증(compilation)절차를 재수행한다.","pts":[],"ex":"","src":"IMG_7803.JPG · p.587 ~ IMG_7804.JPG · p.588","asrc":"IMG_7846.JPG · 해답 p.111"},{"id":"TB13-E4-3","ch":13,"k":"essay","tb":"13장 서술④ 3","tg":"13-서술④","cx":"13-서술④","q": 4-서술②","cx":"14-서술②","q":"회사의 어음 관련업무를 검토해 볼 때, 직무의 분리나 어음의 발행 및 관리와 관련하여 내부통제 개선이 필요한 업무절차 두 가지를 기술하시오.","model":"(1) 경리부장이 어음의 실물용지와 인감을 보유하고 있어 적절한 업무분장이 이루어지고 있지 않다. 경리부장은 자신의 필요에 따라 언제든지 어음을 발행하여 개인목적으로 유용할 수 있다. 어음 · 수표 부정은 계속기업의 유지에도 중요한 불확실성이 야기될 위험이 있다.\n(2) 어음을 발행할 때 일련번호의 통제가 이루어지고 있지 않다. 어음용지가 부당유용되거나 분실되면 그 사실을 파악하기 어렵다.","pts":[],"ex":"","src":"IMG_7807.JPG · p.625 ~ IMG_7808.JPG · p.626","asrc":"IMG_7851.JPG · 해답 p.116"},{"id":"TB14-E2-2","ch":14,"k":"essay","tb":"14장 서술② 2","tg":"14-서술②","cx":"14-서술②","q":"20×3년 1월 1일 김대한 회계사가 어음용지를 실사하기 위해 경리부장과 함께 금고를 열었을 때, 금고의 파손이 없는 상태에서 2매의 용지만 남아 있었다. 어음용지가 2매만 남아 있을 수 있는 이유를 제시하시오.","model":"경리부장이 1매의 어음용지를 개인목적으로 유용한 것으로 의심할 수 있다. 회사가 1매의 용지로 차입을 하고 지급어음 장부에 기록하지 않았을 수도 있다.","pts":[],"ex":"","src":"IMG_7807.JPG · p.625 ~ IMG_7808.JPG · p.626","asrc":"IMG_7851.JPG · 해답 p.116"},{"id":"TB14-E2-3","ch":14,"k":"essay","tb":"14장 서술② 3","tg":"14-서술②","cx":"14-서술②","q":"위의 자료를 검토하면 부외부채가 존재할 것으로 의심할 수 있는 어음이 있다. #12340~#12349 중에서 어떤 것인가?","model":"어음번호 #12347을 의심할 수 있다.\n발행된 것으로 기록했으나 지급어음계정에 기록이 없으며 감사현장종료일까지 은행으로부터 회수되지도 않았다. 회사에 실물이 존재하지 않기 때문에 부외부채와 관련된 것으로 추정할 수 있다.","pts":[],"ex":"","src":"IMG_7807.JPG · p.625 ~ IMG_7808.JPG · p.626","asrc":"IMG_7852.JPG · 해답 p.117"},{"id":"TB14-E3-1","ch":14,"k":"essay","tb":"14장 서술③ 1","tg":"14-서술③","cx":"14-서술③","q":"20×1년도에 기록을 누락한 거래처의 청구서에 대해 회사가 후속기간에 이를 확인하여 원장에 바르게 수정기입하였다. 이러한 사항은 감사절차에 어떠한 영향을 미치는가?","model":"회사가 거래처의 청구액을 후속기간에 발견하여 스스로 원장에 기록했으므로 부외부채 감사절차를 축소할 수 있으며, 내부통제의 신뢰성은 증가한다. 감사인은 부외부채 감사절차를 생략할 수 없다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627","asrc":"IMG_7852.JPG · 해답 p.117"},{"id":"TB14-E3-2","ch":14,"k":"essay","tb":"14장 서술③ 2","tg":"14-서술③","cx":"14-서술③","q":"내부감사인에 의한 내부검증기능이 존재한다는 사실로 감사인은 부외부채의 감사절차 범위를 축소할 수 있는가?","model":"내부감사인이 수행한 업무를 신뢰할 수 있다면 감사인은 감사절차의 범위를 축소할 수는 있다. 내부감사인은 독립성이 결여되어 있으므로 감사인은 내부감사인이 수행한 업무에 대한 감사절차를 생략할 수는 없다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627","asrc":"IMG_7852.JPG · 해답 p.117"},{"id":"TB14-E4-1","ch":14,"k":"essay","tb":"14장 서술④ 1","tg":"14-서술④","cx":"14-서술④","q":"샛별기업의 금융자산 관련 중요왜곡표시위험을 평가하시오.","model":"① 샛별기업의 다음 사항은 금융자산 투자활동 관련 고유위험을 증가시킨다.\n• 총자산의 15%에 해당하는 금액이 고위험 금융자산에 투자되고 있어 시세변동에 민감한 영향을 받는다.\n• 소액이지만 파생금융자산은 상품구조 및 회계처리의 복잡성, 시장가격의 고탄력성으로 매우 높은 수준의 평가(valuation) 불확실성이 존재한다.\n• 김 사장의 보상계약 중 자산수익률에 연계된 비중이 높다.\n② 다음의 사실들은 통제위험을 증가시키거나 감소시킨다.\n• 김 사장의 금융상품 투자경험은 많지 않은데, 이사회 수준의 투자활동 통제절차는 취약하다. 투자전략은 이사회가 승인하나 실제 투자의사결정에 대한 사전 및 사후 통제기능이 존재하지 않는다. 투자한도액에 대한 통제가 없고 사장이 최종의사결정을 하고 있으며 투자수익에 대한 김 사장 개인의 압박이 크다.\n• 자산운용전문사의 이용(신탁운용사의 내부통제가 효과적이라고 가정)은 통제위험을 낮춰주는 요인이다.\n③ 샛별기업의 중요왜곡표시위험은 ① 고유위험과 ② 통제위험이 결합되어 결정된다. 중요왜곡표시위험이 매우 높은 것으로 평가되므로, 높은 수준의 통제테스트를 수행하거나 실증테스트의 범위를 확대하는 감사계획을 수립해야 한다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627 ~ IMG_7810.JPG · p.628","asrc":"IMG_7852.JPG · 해답 p.117 ~ IMG_7853.JPG · p.118"},{"id":"TB14-E4-2","ch":14,"k":"essay","tb":"14장 서술④ 2","tg":"14-서술④","cx":"14-서술④","q":"상장주식과 관련하여 실재성목표를 검증하기 위한 감사절차를 기술하시오.","model":"• 투자자문계약서를 검토하고, 자산운용사에 기말시점의 보유증권 종류, 수량 및 가격을 조회한다.\n• 기말시점의 공시된 상장가격을 직접 구하여 조회서 금액과 비교한다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627 ~ IMG_7810.JPG · p.628","asrc":"IMG_7853.JPG · 해답 p.118"},{"id":"TB14-E4-3","ch":14,"k":"essay","tb":"14장 서술④ 3","tg":"14-서술④","cx":"14-서술④","q":"상기 파생상품에 대해 완전성목표를 검증하기 위한 감사절차를 기술하시오.","model":"파생상품계약은 당시에 현금결제가 수반되지 않는 미래의 이행약속계약이므로 완전성 검증이 쉽지 않다. 잠재적 위험이나 손실을 은폐하려는 속성이 강한 금융자산이다.\n• 계약상대방에게 계약조건과 이면약정이 있는지 조회한다.\n• 기중거래가 있었으나 기말에 보유하지 않은 모든 파생상품 거래상대방에 대해서도 조회서를 발송한다.\n• 당기의 모든 파생상품계약서를 검토하고, 이사회 혹은 투자(리스크관리)위원회 회의록을 확인해 기말에 기재 또는 공시 누락된 계약이 존재하는지 검토한다.\n• 후속기간의 파생상품 결제거래를 검토하여 기말시점 현재 누락계약이 있는지 확인한다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627 ~ IMG_7810.JPG · p.628","asrc":"IMG_7853.JPG · 해답 p.118"},{"id":"TB14-E4-4","ch":14,"k":"essay","tb":"14장 서술④ 4","tg":"14-서술④","cx":"14-서술④","q":"금융자산의 평가목표를 검증하기 위한 감사절차를 기술하시오. 일반 금융상품은 모두 상장주식이며, 파생상품은 공정가치 수준 3의 평가를 필요로 한다.","model":"금융자산의 공정가치 평가는 중요한 감사목표 중 하나이다.\n• 활성시장의 상장주식은 거래소의 종가시세표를 확인해 검증한다.\n• 수준 3의 추정을 필요로 하는 파생금융상품에 대해서는 경영진이 공정가치추정을 위해 사용한 모형의 적절성과 추정치의 합리성을 검증한다. 평가방법과 시장요소(예 : 유동성위험, 신용위험, 이자율위험 등)를 포함하여 사용된 가정을 이해하기 위해 전문가적 판단을 활용한다. 감사인이 독립적인 모형을 사용하여 추정한 값을 회사가 제시한 금액과 비교하고, 해당되는 경우 후속기간 중에 거래된 공정가치 등을 참조하여 경영진 평가의 합리성을 검증한다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627 ~ IMG_7810.JPG · p.628","asrc":"IMG_7853.JPG · 해답 p.118"},{"id":"TB14-E4-5","ch":14,"k":"essay","tb":"14장 서술④ 5","tg":"14-서술④","cx":"14-서술④","q":"김태평 회계사가 감사절차를 수행하는 과정에서 내부 또는 외부 재무금융전문가의 평가관련 조언이 별도로 필요한지 기술하시오.","model":"수준 3의 추정을 요하는 금융상품 감사를 위해 전문가를 활용할 수 있다. 감사인이 전문가를 활용할 때에는 전문가가 객관적이며 적격한 전문지식을 갖추고 있는지에 대한 확신이 필요하며, 추정을 위해 사용한 방법을 이해할 수 있어야 한다. 샛별기업은 금융자산의 복잡성과 투자비중이 높으므로 감사인 측의 내부 혹은 외부 평가전문가를 활용하여 금융상품 평가의 적절성을 검증하는 것이 바람직하다.","pts":[],"ex":"","src":"IMG_7809.JPG · p.627 ~ IMG_7810.JPG · p.628","asrc":"IMG_7853.JPG · 해답 p.118"},{"id":"TB14-E5-1","ch":14,"k":"essay","tb":"14장 서술⑤ 1","tg":"14-서술⑤","cx":"14-서술⑤","q":"은행거래와 관련한 회사의 내부통제의 취약점에 대해 임 회계사가 제시할 수 있는 개선안을 기술하시오.","model":"(1) 업무분장, 승인 및 문서화 : 출납사원은 현업부서의 요청문서(지급결의품의서)에 의해 승인된 거래와 금액만 이체할 수 있도록 한다. 품의부서의 요청문서와는 별도로 자금부서의 자금운용계획을 기간별(예 : 일별 등)로 수립하여 담당부장(혹은 그 이상)의 승인을 받은 후 이체절차를 집행한다.\n(2) 물리적 접근통제 : 업무를 원활하게 집행하기 위하여 승인된 자금이체 계획에 대해 출납사원이 개별금액 일정범위(천만원) 이내는 사전보고 없이 이체할 수 있게 하되 인터넷뱅킹으로 하루에 할 수 있는 이체횟수를 제한한다. 인터넷 거래의 OTP카드와 공인인증서는 담당부장이 보관한다.\n(3) 독립적인 성과검토 : 매일 이체결과표를 작성하여 담당부장에게 보고한다. 담당부장은 정기적으로 이체결과표를 통장과 대조 확인한다. 담당부장과 김미화 사원 외 다른 사원이 당좌계정뿐만 아니라 모든 은행계정에 대해(상호 융통가능성 때문에) 은행조정하여 담당부장보다 상위직급에게 보고하도록 한다. 예금잔액의 독립적 검증절차를 수행해 부정이 개입되어 있다면 이를 사후 적발가능하도록 한다.\n(4) 통제환경(인사정책) : 동일 업무를 계속 담당하지 않도록 순환 배치하고, 불시에 명령휴가를 부여해 다른 직원이 업무를 수행해 부정이 있었는지 확인한다.","pts":[],"ex":"","src":"IMG_7810.JPG · p.628","asrc":"IMG_7854.JPG · 해답 p.119"},{"id":"TB14-E6-1","ch":14,"k":"essay","tb":"14장 서술⑥ 1","tg":"14-서술⑥","cx":"14-서술⑥","q":"출납담당자는 자신의 횡령사실을 감추기 위하여 어떤 방법을 사용했는가?","model":"출납담당자는 ₩71,950을 횡령하였고 다음의 방법으로 횡령사실을 감추려고 하였다.\n① 조정표의 기발행미지급수표의 합계액을 실제보다 적게 기입하였다.\n(₩106,229 → ₩54,279)\n② 회사측 잔액에 가산할 항목(기록누락 대변금액)을 반대로 차감하였다.","pts":[],"ex":"","src":"IMG_7810.JPG · p. 서<br>④ 의견거절 보고서<br>⑤ 부적정의견 보고서","model":"<table><thead><tr><th>상 황<\/th><th>감사보고서 종류<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:right\">(1)<\/td><td>①<\/td><\/tr><tr><td style=\"text-align:right\">(2)<\/td><td>③<\/td><\/tr><tr><td style=\"text-align:right\">(3)<\/td><td>②<\/td><\/tr><tr><td style=\"text-align:right\">(4)<\/td><td>③<\/td><\/tr><tr><td>(5) 사례 가<br>사례 나<\/td><td>② 또는 극히 예외적으로 ④<br>③ 또는 ⑤<\/td><\/tr><\/tbody><\/table>\n(1) 보고기간말 이후에 발생한 사건으로 주식가격이 하락했으므로 당기가 아닌 차기 재무제표에 반영해야 한다. 회사는 적절하게 회계처리하였다.\n(2) 내용연수 변경은 회계정책 변경이 아닌 회계추정 변경에 해당하므로 소급 적용하지 않고 전진적으로 회계처리한다. 기업의 회계처리는 재무보고체계에 위배한다.\n(3) 발생가능성이 거의 확실하지 않으므로 기업의 회계처리는 적절하다.\n(4) 재고자산평가이익을 인식한 기업의 회계처리는 재무보고체계를 위배했다.\n(5) 〈사례 가〉\n계속기업전제가 적절하나 중요한 불확실성이 존재한다. 중요한 불확실성이 적절하게 공시되었으므로 적정의견을 표명한다. 단, 재무제표 전체에 유의적 영향을 미치는 여러 중요한 불확실성이 복합적으로 연루된 상황이라면 의견거절이 적절한지를 고려한다.\n〈사례 나〉\n계속기업전제가 적절하나 중요한 불확실성이 존재한다. 회사가 중요한 불확실성이 적절하게 공시되어 있지 않으므로 한정의견이나 부적정의견을 표명한다.","pts":[],"ex":"","src":"IMG_7825.JPG · p.722 ~ IMG_7826.JPG · p.723","asrc":"IMG_7864.JPG · 해답 p.131 ~ IMG_7865.JPG · p.132"},{"id":"TB16-E3-1","ch":16,"k":"essay","tb":"16장 서술③ 1","tg":"16-서술③","cx":"16-서술③","q":"상기 각각의 상황이 20×2년의 감사보고서에 어떻게 표시되는지 기술하시오.","model":"(상황 1) 감사의견은 표명대상이 되는 재무제표의 각 보고기간(당기재무제표와 전기재무제표 모두에 대해 보고)을 언급해야 한다. 전기에는 한정의견, 당기에는 적정의견을 표명한다.\n(상황 2) 감사인은 전기의 한정의견 사유가 해소되었으므로, 전기와 당기에 모두 적정의견을 표명한다. 전기에 표명한 의견과 당기에 표명하는 전기 감사의견이 다르므로, 이러한 변경된 실질적인 이유를 기타사항문단에 기재한다.\n(상황 3) 초도감사이며 법규상 금지되어 있지 않으므로 의견의 분리가 가능하다. 감사범위의 제한이 있는 기초재고자산이 영향을 미치는 당기의 손익계산서, 자본변동표와 현금흐름표는 한정의견이 표명되며, 당기의 재무상태표는 적정의견이 표명된다. 기타사항문단에 전기재무제표는 전임감사인이 감사하였으며, 전기의 감사의견 및 변형되었다면 그 이유, 감사보고서일을 기재한다. 이러한 사항은 핵심감사사항으로 기재할 수 있다.\n(상황 4) 당기재무제표에는 적정의견이 표명되며, 기타사항문단에 전기의 재무제표는 감사받지 않은 것이라고 기술한다.","pts":[],"ex":"","src":"IMG_7827.JPG · p.724","asrc":"IMG_7865.JPG · 해답 p.132"},{"id":"TB16-E4-1","ch":16,"k":"essay","tb":"16장 서술④ 1","tg":"16-서술④","cx":"16-서술④","q":"상기 각각의 상황에서 감사인이 취해야 할 절차를 기술하시오.","model":"(상황 1) 지배기구와 커뮤니케이션을 해야 하며, 중요한 불일치를 기술하는 사항을 기타사항문단으로 감사보고서에 포함해야 한다. 감사보고서를 전달하지 않고 보류하며, 관련 법규상 가능하다면 감사계약을 해지하는 것을 고려한다.\n(상황 2) 이미 배포된 상황이므로 경영진이 이전에 발행된 재무제표와 이에 대한 감사보고서 및 해당 기타정보를 수령한 사람들에게 동 기타정보가 수정되었다는 것을 통지하였는지 검토할 수 있을 것이다.","pts":[],"ex":"","src":"IMG_7827.JPG · p.724 ~ IMG_7828.JPG · p.725","asrc":"IMG_7866.JPG · 해답 p.133"},{"id":"TB16-E5-1","ch":16,"k":"essay","tb":"16장 서술⑤ 1","tg":"16-서술⑤","cx":"16-서술⑤","q":"회계감사기준에서 규정하고 있는 그룹재무제표를 감사할 때 유의적 부문으로 식별하기 위한 두 가지 특성을 서술하시오.","model":"그룹재무제표를 감사할 때 유의적 부문으로 식별하기 위한 두 가지 특성은 다음과 같다.\n① 그룹에 대하여 개별적으로 재무적 유의성이 있는 경우\n② 부문의 고유한 성격이나 환경으로 인해 그룹재무제표에 유의적인 중요왜곡표시위험이 포함되어 있을 것으로 예상하는 경우","pts":[],"ex":"","src":"IMG_7828.JPG · p.725","asrc":"IMG_7866.JPG · 해답 p.133"},{"id":"TB16-E5-2","ch":16,"k":"essay","tb":"16장 서술⑤ 2","tg":"16-서술⑤","cx":"16-서술⑤","q":"X회계법인이 ABC(주)에 대한 그룹재무제표를 감사할 때 유의적 부문을 식별하고 이유를 [답안양식]에 따라 서술하시오.<br>[답안양식]<table><thead><tr><th>부 문<\/th><th>유의적 부문 여부<br>(○ 또는 ×)<\/th><th>이 유<\/th><\/tr><\/thead><tbody><tr><td>A(주)<\/td><td><\/td><td><\/td><\/tr><tr><td>B(주)<\/td><td><\/td><td><\/td><\/tr><tr><td>C(주)<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table>","model":"<table><thead><tr><th>부 문<\/th><th>유의적<br>부문 여부<\/th><th>이 유<\/th><\/tr><\/thead><tbody><tr><td>A(주)<\/td><td>○<\/td><td>세전이익(160억원)이 연결재무제표의 중요성기준인 27억원(＝540억원(연결세전이익)×5%) 이상이므로 A(주)는 유의적 부문에 해당한다.<\/td><\/tr><tr><td>B(주)<\/td><td>○<\/td><td>세전이익의 절댓값(18억원)이 연결재무제표의 중요성기준인 27억원에 미달하지만, 자산규모에 비해 차입금(400억원)의 비중이 매우 높고 완전자본상태(△100억원)에 있기 때문에 계속기업의 가정에도 중요한 불확실성이 존재하는 상황이다. 이러한 비정상적인 성격으로 연결재무제표에 유의적인 중요왜곡표시위험의 가능성이 높으므로 B(주)는 유의적 부문에 해당한다.<\/td><\/tr><tr><td>C(주)<\/td><td>×<\/td><td>세전이익의 절댓값(2억원)이 연결재무제표의 중요성기준인 27억원에 크게 미달하고 신규사업이 준비중에 있으므로 C(주)는 유의적 부문에 해당하지 않는다.<\/td><\/tr><\/tbody><\/table>","pts":[],"ex":"","src":"IMG_7828.JPG · p.725","asrc":"IMG_7866.JPG · 해답 p.133"},{"id":"TB16-E5-3","ch":16,"k":"essay","tb":"16장 서술⑤ 3","tg":"16-서술⑤","cx":"16-서술⑤","q":"X회계법인의 김 회계사는 B(주)의 부문감사인인 Z회계법인의 박 회계사와 커뮤니케이션과정에서 매출채권조회서 중 50%가량이 회수되지 않았으며, 대체적인 절차도 수행하지 않았다는 것을 확인하였다. 미회수된 매출채권조회서의 금액은 그룹재무제표 관점에서 중요성기준을 초과하며, X회계법인의 김 회계사는 Z회계법인의 매출채권에 대한 감사절차가 충분하지 않다고 판단하였다. 이러한 상황에서 ABC(주)의 그룹감사업무팀이 추가로 수행해야 할 감사절차를 서술하시오.","model":"미회수된 매출채권조회서의 금액이 그룹재무제표 수준의 중요성기준을 초과한다. 그룹감사업무팀은 B(주)의 부문감사인인 Z회계법인에게 매출채권의 미회신조회에 대해 추가 회수노력을 하거나 대체적인 절차를 수행하도록 요청해야 한다. 만약 Z회계법인의 이러한 절차 수행이 실행가능하지 않다고 판단하면 그룹감사업무팀이 직접 그 절차를 추가수행해야 한다.","pts":[],"ex":"","src":"IMG_7829.JPG · p.726","asrc":"IMG_7866.JPG · 해답 p.133 ~ IMG_7867.JPG · p.134"},{"id":"TB16-E6-1","ch":16,"k":"essay","tb":"16장 서술⑥ 1","tg":"16-서술⑥","cx":"16-서술⑥","q":"아래 자료는 그룹감사 목적으로 부문정보에 대하여 수행할 업무유형을 결정(scoping)하기 위하여 김 회계사가 파악한 사실 및 결론을 문서화한 것이다.<div class=\"box\">(부문 A)<br>파악한 사실 : 부문 A의 세전순이익은 그룹세전순이익의 30%에 해당.<br>결론 : 부문 A는 그룹에 대하여 개별적으로 재무적 유의성을 가지므로 유의적 부문으로 식별하고 부문감사인에게 부문 A의 재무제표에 대하여 감사를 요청함.<br><br>(부문 B)<br>파악한 사실 : 부문 B의 세전순이익은 그룹세전순이익의 8%에 해당.<br>결론 : 부문 B의 별도재무제표는 재무적으로 유의하지 않으므로 그룹감사 목적으로 부문감사인에게 별도의 감사절차를 수행하도록 요구하지 않음.<br><br>(부문 C)<br>파악한 사실 : 부문 C의 세전순이익은 그룹세전순이익의 11.6%에 해당됨. 20×2년 3월에 주식을 취득하여 그룹재무제표에 신규 편입되어 그룹 공통의 시스템과 절차가 적용되지 않고, 내부감사업무도 수행되지 않았음.<br>결론 : 그룹세전순이익의 15% 미만이지만, 부문의 고유한 성격과 환경을 감안하여 부문 C를 유의적 부문으로 식별하고 부문감사인에게 부문 C의 재무제표에 대하여 감사할 것을 요청함.<br><br>(부문 D~Z)<br>파악한 사실 : 부문 D~Z의 세전순이익의 합계는 그룹세전순이익의 30%에 해당. 부문 D~Z 어느 하나의 부문도 재무적으로 유의하지 않음.<br>결론 : 부문 D~Z 21개 각각의 부문은 재무적으로 유의하지 않으므로 감사의 효율을 고려하여 별도의 감사절차를 수행하지 않음.<\/div>업무수행이사는 김 회계사가 문서화한 부문감사인과 관련된 결론을 검토하였다. 김 회계사의 결론에서 수정이 필요한 사항과 그 이유를 서술하시오.","model":"(1) 부문 A\n수정요청사항 없음\n(2) 부문 B\n1) 수정요청사항\n• 매출채권, 재고자산, 매입채무, 매출, 매출원가를 부문감사인에게 감사를 요청한다.\n• 현금의 경우 250억원보다 적으나 감사를 수행하는 계정과의 연관성이 높으므로 부문감사인에게 감사를 요청한다.\n2) 이유\n• 내부감사매뉴얼에 따라 수행중요성 250백만원을 초과하는 계정(및 관련성이 높은 계정)은 적절한 감사절차를 수행해야 한다.\n(3) 부문 C\n수정요청사항 없음\n(4) 부문 D~Z\n1) 수정요청사항\n• 그룹수준의 분석적절차를 수행\n• 유의적이지 않은 부문 중 일부를 추출한 후 ① 부문재무제표감사, ② 일부 거래유형, 계정잔액 또는 공시에 대한 감사, ③ 검토, ④ 특정절차의 수행 등을 요청한다.\n• 기간 경과에 따라 추출된 부문을 변경한다.\n2) 이유\n• D~Z가 개별로는 중요하지 않으나 묶음으로는 세전순이익기준 30%에 해당한다. 기존의 범위(Scoping)만으로는 충분하고 적합한 감사증거를 입수하지 못한다.","pts":[],"ex":"","src":"IMG_7829.JPG · p.726 ~ IMG_7831.JPG · p.728","asrc":"IMG_7867.JPG · 해답 p.134"},{"id":"TB16-E6-2","ch":16,"k":"essay","tb":"16장 서술⑥ 2","tg":"16-서술⑥","cx":"16-서술⑥","q":"김 회계사는 그룹감사 목적으로 해외에 소재한 부문감사인에게 부문정보에 대한 감사수행을 요청하기로 결정하였다. 김 회계사는 부문감사인에 대하여 대한민국의 윤리적 요구사항, 전문가적 적격성, 부문감사인의 업무에 관여할 수 있는지 여부, 감사인을 적극적으로 감독하는 규제환경인지를 이해하고 결론을 아래 자료와 같이 문서화하였다.<div class=\"box\">(부문 A)<br>부문감사인 이해결과 : 부문감사인이 20×2회계연도의 재무제표를 작성하고 있음을 확인함.<br>결론 : 부문감사인의 독립성이 훼손되었음. 이를 극복하기 위하여 그룹감사인이 부문감사인의 모든 감사조서를 제공받아 검토함.<br><br>(부문 C)<br>부문감사인 이해결과 : 부문감사인은 그룹재무보고체계인 K-IFRS에 대한 이해가 없어, 해당 국가의 GAAP에 따른 감사의견만을 제시할 수 있는 것으로 확인함. 해당 국가의 독립된 감독기관에 의한 감사품질 모니터링이 취약해 감사인의 신뢰도가 전반적으로 낮은 것으로 파악함.<br>결론 : 그룹경영진에게 질문한 결과, 해당 국가의 GAAP와 K-IFRS 간에 차이가 발생하는 항목은 몇 가지 되지 않고 그룹재무제표에 미치는 영향은 중요하지 않을 것이라고 진술함. 이러한 내용을 향후 서면진술에 기재하고, 부문감사인이 해당 국가의 GAAP에 의하여 수행한 감사결과를 신뢰하고 그룹감사 목적으로 수정 없이 사용하기로 함.<\/div>업무수행이사는 김 회계사가 문서화한 부문감사인과 관련된 결론을 검토하였다. 김 회계사의 결론에서 수정이 필요한 사항과 이유를 서술하시오.","model":"(1) 부문 A\n1) 수정요청사항\n• 그룹경영진에게 부문감사인의 변경을 요청한다.\n• 그룹감사인이 직접 수행한다.\n2) 이유\n독립성 훼손은 부문감사인의 업무에 관여하거나 부문재무정보에 대한 추가적인 위험평가나 추가감사절차의 수행만으로는 극복할 수 없다.\n(2) 부문 C\n1) 수정요청사항\n• 그룹감사업무팀이 부문감사인의 업무에 관여한다.\n• 그룹감사업무팀이 부문정보에 대하여 추가적인 위험평가나 추가감사절차를 직접 수행한다.\n• 그룹감사업무팀이 해당 국가의 GAAP와 K-IFRS의 차이를 전체적으로 분석하고 차이내역 감사를 직접 수행한다.\n• 그룹감사업무팀이 감사증거를 직접 입수할 수 없다면 수임을 거절한다.\n2) 이유\n• 경영진진술만으로 실증절차를 생략할 수 없다.\n• 부문감사인의 적격성(K-IFRS 이해)이 의심되고, 규제환경이 취약하므로 업무 관여도를 높여야 한다.","pts":[],"ex":"","src":"IMG_7831.JPG · p.728","asrc":"IMG_7868.JPG · 해답 p.135"},{"id":"TB16-E7-1","ch":16,"k":"essay","tb":"16장 서술⑦ 1","tg":"16-서술⑦","cx":"16-서술⑦","q":"위 각 사례에 대해 다음의 판단지침을 고려하여, ① 감사의견의 종류와 그 근거, ② 강조사항 또는 기타사항으로 기재할지를 기술하시오.<div class=\"box\">1) 중요하다고 판단하는 중요성기준은 10억원, 중요할 뿐만 아니라 전반적이라고 판단하는 중요성기준은 30억원이다. 중요성 판단은 해당 왜곡표시가 순자산(net asset)에 미치는 영향으로 판단한다.<br>2) 감사인이 설정한 수행중요성은 7억원이다.<br>3) 감사의견을 형성할 때 질적 요소는 고려하지 않는다.<\/div>","model":"(1) ① 전기와 당기의 왜곡표시액이 합하여 12억원이므로 중요성기준을 초과하고 있다. 따라서 “한정의견”을 표명한다.\n② 강조사항과 기타사항으로 기재할 사항은 없다.\n(2) ① 중요성기준을 초과하였으므로 “한정의견”을 표명한다.\n② 계류중인 예외적인 소송사항과 관련하여 불확실성이 존재하며, 회사가 이러한 사항을 주석으로 반영하였으므로 강조사항문단을 추가 }

function bind() {
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.p || null));
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { S.ch = +b.dataset.ch; save(); render(); });
  document.querySelectorAll('[data-mapch]').forEach(b => b.onclick = () => { S.ch = +b.dataset.mapch; save(); go('list', 'essay'); });
  document.querySelectorAll('[data-rv]').forEach(c => c.onclick = () => { c.hidden = true; c.nextElementSibling.hidden = false; });
  const A = (k, f) => { const b = document.querySelector(`[data-act="${k}"]`); if (b) b.onclick = f; };
  A('theme', () => { S.theme = {system: 'light', light: 'dark', dark: 'system'}[S.theme]; applyTheme(); save(); render(); });
  A('resume', () => go('quiz'));
  A('oxLeft', () => start('ox', shuffle(ids('ox').filter(id => !(S.lv[id] >= 2))), 'O/X · 못 끝낸 것'));
  A('oxAll', () => start('ox', shuffle(ids('ox')), 'O/X · 전체'));
  A('esLeft', () => start('essay', ids('essay').filter(id => !(S.lv[id] >= 2)), '서술형 · 못 외운 것'));
  A('esAll', () => start('essay', ids('essay'), '서술형 · 전체'));
  A('wrong', () => start('mix', S.wrong.filter(id => QM[id] && inCh(QM[id])), '오답노트'));
  A('bm', () => start('mix', S.bm.filter(id => QM[id] && inCh(QM[id])), '북마크'));
  A('hide', () => { hideAns = !hideAns; render(); });
  A('print', () => { hideAns = false; render(); document.querySelectorAll('details.ctx').forEach(d => d.open = true); setTimeout(() => window.print(), 50); });
  A('reset', () => { if (confirm('진행 기록을 모두 지울까요?')) { S.lv = {}; S.wrong = []; S.bm = []; S.drafts = {}; S.ses = null; save(); toast('지웠어요'); go('home'); } });
  A('redo', () => { const r = S.last; const f = {}; r.res.forEach(x => { if (!(x[0] in f)) f[x[0]] = x[1]; }); start('mix', Object.keys(f).filter(id => !f[id]), r.title + ' · 다시'); });
}

/* ---------- 세션: O/X는 문항 id, 서술형은 {g, ids} 지문 묶음 ---------- */
function items(list) {
  const out = [], at = {};
  list.forEach(id => {
    const q = QM[id]; if (!q) return;
    if (q.k === 'ox') return out.push(id);
    if (at[q.tg] === undefined) { at[q.tg] = out.length; out.push({g: q.tg, ids: []}); }
    out[at[q.tg]].ids.push(id);
  });
  out.forEach(x => { if (typeof x === 'object') x.ids.sort((a, b) => QS.indexOf(QM[a]) - QS.indexOf(QM[b])); });
  return out;
}
function start(kind, list, title) {
  const q = items(list);
  if (!q.length) return toast('풀 문제가 없어요');
  S.ses = {kind, title, q, i: 0, req: {}, res: []}; save(); go('quiz');
}
function record(id, ok) {
  const v = S.lv[id];
  S.lv[id] = ok ? (v >= 1 ? 2 : 1) : 0;
  if (ok) { if (S.lv[id] >= 2) S.wrong = S.wrong.filter(x => x !== id); }
  else if (!S.wrong.includes(id)) S.wrong.push(id);
}
const itemKey = it => typeof it === 'string' ? it : 'G:' + it.g;
function renderQuiz(app) {
  const ses = S.ses; if (!ses) return go('home');
  if (ses.i >= ses.q.length) { S.last = ses; S.ses = null; save(); return go('result'); }
  const it = ses.q[ses.i];
  if (typeof it === 'object') return groupUI(app, it);
  const id = it, q = QM[id];
  cur = {id, q, done: false};
  const again = (ses.req[id] || 0) > 0;
  app.innerHTML = `
  <div class="wrap">
    ${qTop()}
    <div class="stack" style="margin-top:10px">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
        <div class="qmeta"><span class="mono">${esc(q.tb)}</span><span class="badge">O/X</span>${again ? '<span class="badge w">다시 확인</span>' : ''}</div>
        ${starBtn(id)}
      </div>
      ${CTX[q.cx] ? `<div class="small muted">${CTX[q.cx].replace(/<[^>]+>/g, '')}</div>` : ''}
      <div class="qtext">${q.q}</div>
      <div id="qa"></div>
      <div id="fb"></div>
      ${srcLine(q)}
    </div>
  </div>
  <div class="actionbar"><div class="in" id="act"></div></div>`;
  bindTop();
  oxUI();
}
function qTop() {
  const ses = S.ses, st = {m: ses.i, l: 0, w: 0, n: ses.q.length - ses.i, t: ses.q.length};
  return `<div class="topbar"><button class="iconbtn" id="qx" aria-label="그만하고 홈으로">✕</button><div style="flex:1">${bar(st)}</div><span class="mono small">${ses.i + 1}/${ses.q.length}</span></div>`;
}
const starBtn = id => `<button class="star ${S.bm.includes(id) ? 'on' : ''}" data-star="${id}" aria-label="북마크">${S.bm.includes(id) ? '★' : '☆'}</button>`;
function bindTop() {
  $('#qx').onclick = () => { save(); go('home'); };
  document.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const id = b.dataset.star; if (S.bm.includes(id)) S.bm = S.bm.filter(x => x !== id); else S.bm.push(id); save(); b.classList.toggle('on'); b.textContent = S.bm.includes(id) ? '★' : '☆'; });
}

/* ---------- O/X ---------- */
function oxUI() {
  $('#qa').innerHTML = `<div class="ox"><button class="opt" data-v="1">O</button><button class="opt" data-v="0">X</button></div>`;
  document.querySelectorAll('#qa .opt').forEach(b => b.onclick = () => { if (!cur.done) chooseOx(b.dataset.v); });
  $('#act').innerHTML = `<button class="btn sub" id="bSkip">건너뛰기</button><button class="btn sub" id="bIdk">모르겠어요</button>`;
  $('#bSkip').onclick = skip; $('#bIdk').onclick = () => chooseOx(null);
}
function chooseOx(v) {
  const q = cur.q, ok = v !== null && (v === '1') === q.a;
  document.querySelectorAll('#qa .opt').forEach(b => { const isAns = (b.dataset.v === '1') === q.a; if (isAns) b.classList.add('ok'); else if (b.dataset.v === v) b.classList.add('bad'); b.disabled = true; });
  finishOx(ok);
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="h">${ok ? '정답 ✓' : v === null ? '정답 확인' : '틀렸어요 ✗'}</div>
    <div class="small">${ok ? (S.lv[q.id] >= 2 ? '2번 연속 맞힘 · 완료' : '한 번 더 맞히면 완료') : '이 회차 안에서 다시 나와요 · 오답노트에 추가'}</div>
    <div style="margin-top:8px">${oxMark(q)}${q.ex ? esc(q.ex) : '<span class="small muted">(해답편에 해설 없이 ○만 표시)</span>'}</div></div>`;
  $('#act').innerHTML = `<button class="btn pri" id="bNext">다음 →</button>`; $('#bNext').onclick = advance;
  setTimeout(() => $('#fb')?.scrollIntoView({block: 'nearest', behavior: 'smooth'}), 30);
}
function finishOx(ok) {
  const ses = S.ses, id = cur.id;
  if (cur.done) return; cur.done = true;
  record(id, ok); ses.res.push([id, ok ? 1 : 0]);
  if (!ok && (ses.req[id] || 0) < 2) { ses.req[id] = (ses.req[id] || 0) + 1; ses.q.splice(Math.min(ses.q.length, ses.i + 4), 0, id); }
  ses.i++; save();
}

/* ---------- 서술형: 지문 전체 + 요구사항 전부 ---------- */
const MODES = [['cover', '가리고 떠올리기'], ['first', '첫 글자 힌트'], ['blank', '빈칸 40%'], ['blank2', '빈칸 80%'], ['write', '직접 써 보기'], ['open', '답안 펼치기']];
function groupUI(app, it) {
  const ses = S.ses, g = GM[it.g], key = itemKey(it), again = (ses.req[key] || 0) > 0;
  const m = MODES.some(x => x[0] === S.mode) ? S.mode : 'cover';
  cur = {grp: it, rate: {}};
  app.innerHTML = `
  <div class="wrap">
    ${qTop()}
    <div class="stack" style="margin-top:10px">
      <div class="qmeta"><span class="mono">${esc(g.name)}</span><span class="badge">서술형</span>${again ? '<span class="badge w">다시 확인</span>' : ''}<span>요구사항 ${it.ids.length}개</span></div>
      <h2>${esc(g.title)}</h2>
      ${CTX[it.g] ? `<section class="card"><div class="eyebrow">지문</div><div class="ctxb" style="padding:6px 0 0">${CTX[it.g]}</div></section>` : ''}
      <div class="modes noprint">${MODES.map(([k, v]) => `<button class="${m === k ? 'on' : ''}" data-m="${k}">${v}</button>`).join('')}</div>
      ${it.ids.map(id => { const q = QM[id]; return `
      <section class="card stack" data-q="${id}">
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="qmeta"><span class="mono">${esc(q.tb)}</span></div>${starBtn(id)}</div>
        <div class="qtext">${q.q}</div>
        ${m === 'write' ? `<textarea class="field" data-ta="${id}" placeholder="해답편 답안을 떠올리며 써 보세요. 자동 저장돼요.">${esc(S.drafts[id] || '')}</textarea><button class="btn" data-cmp="${id}">해답과 비교</button>` : ''}
        <div><div class="eyebrow">해답편 답안</div><div class="model" data-model="${id}" style="margin-top:6px"></div><div class="small muted" data-help="${id}"></div></div>
        <div class="row"><button class="btn" style="flex:1" data-rate="0" data-id="${id}">아직 못 외움</button><button class="btn" style="flex:1" data-rate="1" data-id="${id}">외웠어요</button></div>
        ${srcLine(q)}
      </section>`; }).join('')}
    </div>
  </div>
  <div class="actionbar"><div class="in"><button class="btn sub" id="bSkip">건너뛰기</button><button class="btn pri" id="bNext">다음 지문 →</button></div></div>`;
  bindTop();
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.mode = b.dataset.m; save(); const y = window.scrollY; groupUI(app, it); window.scrollTo(0, y); });
  it.ids.forEach(id => {
    const box = document.querySelector(`[data-model="${id}"]`), help = document.querySelector(`[data-help="${id}"]`), model = QM[id].model;
    if (m === 'cover' || m === 'write') {
      box.innerHTML = `<div class="cover">${m === 'write' ? '다 쓰고 「해답과 비교」를 누르거나, 여기를 눌러 답안 보기' : '머릿속으로 답을 떠올린 다음 눌러서 확인'}</div>`;
      box.firstChild.onclick = () => { box.innerHTML = modelHtml(model); };
    } else {
      box.innerHTML = modelHtml(model);
      if (m !== 'open') { wrapWords(box); maskWords(box, m); help.textContent = '가려진 칸이나 힌트 글자를 누르면 그 단어만 보여요.'; }
    }
  });
  document.querySelectorAll('[data-ta]').forEach(ta => ta.oninput = () => { S.drafts[ta.dataset.ta] = ta.value; save(); });
  document.querySelectorAll('[data-cmp]').forEach(b => b.onclick = () => { const id = b.dataset.cmp; compare(document.querySelector(`[data-model="${id}"]`), document.querySelector(`[data-help="${id}"]`), QM[id].model, document.querySelector(`[data-ta="${id}"]`).value); });
  document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
    const id = b.dataset.id; cur.rate[id] = b.dataset.rate === '1';
    document.querySelectorAll(`[data-id="${id}"]`).forEach(x => { x.classList.remove('pri'); x.style.background = ''; x.style.color = ''; x.style.borderColor = ''; });
    if (cur.rate[id]) b.classList.add('pri'); else { b.style.background = 'var(--wrong-soft)'; b.style.color = 'var(--wrong)'; b.style.borderColor = 'var(--wrong)'; }
  });
  $('#bSkip').onclick = skip;
  $('#bNext').onclick = () => finishGroup(it);
}
function finishGroup(it) {
  const ses = S.ses, fail = [];
  it.ids.forEach(id => { if (!(id in cur.rate)) return; const ok = cur.rate[id]; record(id, ok); ses.res.push([id, ok ? 1 : 0]); if (!ok) fail.push(id); });
  const key = itemKey(it);
  if (fail.length && (ses.req[key] || 0) < 2) { ses.req[key] = (ses.req[key] || 0) + 1; ses.q.splice(Math.min(ses.q.length, ses.i + 3), 0, {g: it.g, ids: fail}); toast('못 외운 문항은 이 회차에서 다시 나와요'); }
  ses.i++; save(); advance();
}
const KEEP = /^([(（]?\d+[)）.]?|[①-⑳•·※\-－=×]|[(（]?[가-힣][)）.]|\d+\.)$/;
function wrapWords(root) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (tw.nextNode()) if (tw.currentNode.nodeValue.trim() && !tw.currentNode.parentElement.closest('th')) nodes.push(tw.currentNode);
  nodes.forEach(n => {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(/(\s+)/).forEach(t => {
      if (!t) return;
      if (/^\s+$/.test(t) || KEEP.test(t) || !/[가-힣A-Za-z0-9]/.test(t)) { frag.appendChild(document.createTextNode(t)); return; }
      const s = document.createElement('span'); s.className = 'w'; s.dataset.t = t; s.textContent = t; frag.appendChild(s);
    });
    n.parentNode.replaceChild(frag, n);
  });
}
function maskWords(root, m) {
  const ws = [...root.querySelectorAll('.w')], p = m === 'blank' ? .4 : m === 'blank2' ? .8 : 1;
  ws.forEach(s => {
    const t = s.dataset.t;
    if (m === 'first') { const ch = [...t]; s.textContent = ch[0] + ch.slice(1).map(c => /[가-힣A-Za-z0-9]/.test(c) ? '○' : c).join(''); s.classList.add('hint'); }
    else if (Math.random() < p) s.classList.add('blk');
    s.onclick = () => { s.textContent = t; s.classList.remove('blk', 'hint'); };
  });
}
function compare(box, help, model, txt) {
  box.innerHTML = modelHtml(model); wrapWords(box);
  const nt = txt.replace(/\s+/g, '');
  let hit = 0, tot = 0;
  box.querySelectorAll('.w').forEach(s => {
    const core = s.dataset.t.replace(/[^가-힣A-Za-z0-9%]/g, '');
    if (core.length < 2) return;
    const stem = [...core].length >= 3 ? [...core].slice(0, -1).join('') : core;
    tot++; if (nt.includes(stem)) { hit++; s.classList.add('hit'); } else s.classList.add('miss');
  });
  help.innerHTML = `답안 낱말 ${tot}개 중 <b>${hit}개</b>(${tot ? Math.round(hit / tot * 100) : 0}%)가 내 답에 들어 있어요. 빨간 낱말이 빠진 부분이에요.`;
}

/* ---------- 공통 ---------- */
function skip() { const ses = S.ses; ses.q.splice(ses.i, 1); save(); toast('건너뛰었어요'); advance(); }
function advance() { renderQuiz($('#app')); window.scrollTo(0, 0); }

render();
</script>
</body>
</html>
